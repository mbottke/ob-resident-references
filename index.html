 while breastfeeding. Through 6 weeks postpartum. Adult doses. SEE ALSO 6 Postpartum 2 Emergencies 11 BP meds 20 Neuraxial EVERY HEADACHE Check BP, neurologic exam, fundi and red flags now. Follow every matching branch. ↺ Any change: reopen 07 Any red flag 01 SBP ≥ 140 or DBP ≥ 90 02 Positional headache ≤ 5 d after neuraxial procedure 05 None of these 04 01 Red flags secondary headache ACOG CPG 3 (2022) · ACR Appropriateness Criteria Headache (2022) Sudden severe headache: peak intensity ≤ 1 h after onset Focal deficit, diplopia, field cut Seizure Altered mental status, confusion Fever or neck stiffness Papilledema, visual change Positional change: orthostatic headache stops being orthostatic SBP ≥ 140 or DBP ≥ 90 · abnormal labs (platelets, AST/ALT, Cr) New pattern, different from usual headaches ! Any red flag → examine now Acute focal deficit → stroke alert now; note last known well. BP, neuro exam, fundi; image the same day (panel 03). MRI availability must not delay assessment — use CT (ACOG). Imaging finds a secondary cause in ≥ 25% of acute headaches in pregnancy and postpartum (ACOG); musculoskeletal and primary headaches remain the most common postpartum. 02 Check BP first ACOG PB 222 (reaff. 2026) · PB 203 · CPG 3 · Severe HTN Bundle 2025 SBP ≥ 160 or DBP ≥ 110 persistent ≥ 15 min Treat within 30–60 minFirst dose, pick one: Labetalol 20 mg IV over 2 min · recheck 10 min Hydralazine 5–10 mg IV over 2 min · recheck 20 min Nifedipine IR 10 mg PO, swallow whole · recheck 20 min Still SBP ≥ 160 or DBP ≥ 110 at recheck → later doses, maximums, rescue 2 · B. Target SBP 140–150 and DBP 90–100. Labetalol: avoid with asthma, heart block, bradycardia, decompensated cardiac disease. SBP ≥ 140 or DBP ≥ 90 Up to 6 wk postpartum, headache + raised BP = preeclampsia until proved otherwise. CBC/platelets, Cr, AST/ALT, urine protein/Cr. New headache unresponsive to medication and not explained by another diagnosis = severe feature. Magnesium sulfate (seizure prophylaxis): preeclampsia with severe features or eclampsia → give; new postpartum HTN with headache or blurred vision → consider 6 · B. Load 4–6 g IV over 20–30 min, then 1–2 g/h; toxicity, renal dosing 2 · B. Seizure → eclampsia until proved otherwise. Altered consciousness, vomiting, fever or seizure with HTN → image for PRES or RCVS (03). Postpartum preeclampsia peaks days 3–6. Maintenance antihypertensives 11 · 02 Who to call ASA PDPH statement (2021) · ACOG CPG 3 Stroke team Acute focal deficit: activate now; note last known well. Anesthesia Headache after neuraxial anesthesia: contact anesthesia. Suspected post-dural-puncture headache (PDPH): anesthesia assessment within 24 h; daily review until resolved. Neurology Red flag, abnormal imaging, seizure without HTN. MFM Preeclampsia with severe features, refractory BP, eclampsia. Higher-level care / handoff 27 · E / F Stroke alert Anesthesia Neurology MFM Postpartum HTN readmission 03 Imaging by suspected cause ACR AC Headache 2022 (variants 1, 5, 6) · ACOG CPG 3 · ACR Manual on Contrast Media SUSPECT CLUE STUDY → THEN Any red flag Any item in panel 01 MRI head w/o contrast or CT head w/o both “usually appropriate” (ACR variant 6, new peripartum headache) SAH · stroke Sudden severe headache or focal deficit CT head w/o now ± CTA head → stroke alert RCVS Recurrent thunderclap, wk 1–2 CTA or MRA head; repeat if normal → stop triptans, SSRIs, decongestants CVT Constant, worsening; seizure, papilledema MRI + MRV, or CT + CTV → LMWH, neurology PRES HTN, visual change, seizure, encephalopathy MRI (FLAIR) → BP control, magnesium sulfate Pituitary apoplexy Sudden headache, field loss, low BP or Na MRI pituitary → stress-dose hydrocortisone SAH subarachnoid hemorrhage · RCVS reversible cerebral vasoconstriction syndrome · CVT cerebral venous thrombosis · PRES posterior reversible encephalopathy syndrome Postpartum contrast: gadolinium and iodinated contrast are fine — no need to interrupt breastfeeding (ACR). Classic post-dural-puncture headache (PDPH) needs no imaging before a blood patch (ASA). 04 Primary headache breastfeeding ACOG CPG 3 · LactMed (NLM, 2026) · FDA labels Complete BP, neurologic examination and red-flag assessment first → panels 01–02. Step 1 Acetaminophen 1,000 mg PO + caffeine 130 mg (acetaminophen max 3–4 g/day) or NSAID: ibuprofen 400–600 mg PO q6h (preferred NSAID in lactation) Ketorolac 15–30 mg IV × 1 is acceptable in the first 24–72 h; after that use another NSAID (label: contraindicated in breastfeeding). No relief at 60 min Metoclopramide 10 mg IV + diphenhydramine 25 mg IV · may repeat after 6 h or prochlorperazine 10 mg IV slowly (≤ 5 mg/min; no bolus) Compatible short term. Migraine Sumatriptan 6 mg SUBQ · may repeat after ≥ 1 h; max 12 mg/day or sumatriptan 50–100 mg PO · if partial response, may repeat after ≥ 2 h; max 200 mg/24 h Compatible (LactMed); no routine pumping-and-discarding. Not with uncontrolled HTN, preeclampsia, CAD or suspected RCVS. Avoid Opioids (codeine, hydrocodone, oxycodone: infant sedation, rebound) · butalbital combinations · ergots (ergotamine, DHE). ACOG cites expert opinion to pause breastfeeding 9–12 h after sumatriptan; LactMed: low milk levels, poor infant absorption, pausing only in extreme cases (e.g., preterm infant). 05 Post-dural-puncture headache Uppal et al., JAMA Netw Open 2023 (multisociety PDPH consensus) · ASA 2021 · ICHD-3 Setting Any neuraxial (epidural, spinal, CSE) — a recognized dural puncture is not required. Onset ≤ 5 d after the procedure (consensus: suspect PDPH in any headache or neuro symptoms in this window). Positional Worse upright, often within ~15 min; eased lying flat. Frontal-occipital, neck stiffness. With Tinnitus or muffled hearing, photophobia, nausea. Diplopia (CN VI) → urgent patch. Atypical Investigate: onset > 5 d, nonorthostatic, fever, focal signs, high BP → work up as s","panels":[["01","Red flags"],["02","Check BP first"],["03","Imaging by suspected cause"],["04","Primary headache"],["05","Post-dural-puncture headache"],["06","Treat PDPH"],["07","Reopen the diagnosis"]]},{"f":"15-sick-newborn.html","n":"15-sick-newborn","sid":"15","g":"newborn","t":"The sick newborn","text":"NURSERY · POSTPARTUM ROOM · AFTER TRANSITION 15The sick newborn A term or late-preterm baby who was fine and now isn’t. Recognize, stabilize, call, transfer. Delivery room 5 · A · early-onset sepsis (EOS) risk score 4 · EOS SEE ALSO 5 Newborn 23 NICU transfer 18 Nursery card 10 Feeding A Escalate now Any one flag → peds/NICU at the bedside now; baby to warmer, monitor on (possible HIE: normothermia → F). Don’t wait for the next vitals round. AAP Apnea (Eichenwald 2016) · AAP CCHD 2025 AHA/AAP 2025 Part 5 · AAP 2022 bilirubin Red flags Apnea ≥ 20 s, or shorter with bradycardia (HR < 100), cyanosis or desaturation. In a term baby it is never “normal”. Breathing RR ≥ 60 with grunting, flaring or retractions · gasping → B Color · SpO₂ Central cyanosis · SpO₂ < 90% either limb · pale, gray, mottled CCHD screen Fail → C and echo (screen ≈ 24 h) 5 · D Perfusion Capillary refill > 3 s · weak or absent femoral pulses · cool limbs Temperature < 36 or ≥ 38 °C, or unstable despite a normal environment Behavior Lethargy, hard to wake · weak suck, poor feeding · high-pitched cry, irritability Gut Any green (bilious) emesis → E · distension · bloody stool Neuro Rhythmic jerking, staring, lip-smacking, apnea with eye deviation → F Jaundice Jaundice at < 24 h → obtain total serum bilirubin (TSB) now. TSB ≥ (exchange threshold − 2 mg/dL) → NICU 5 · C Skin Petechiae · vesicles (HSV) · after stabilization: cCMV indications 22 · C At the bedside first 10 minutes Call peds/NICU; assess airway, breathing and HR Peds / NICU attending now; state “sick newborn, needs bedside eval”. Apnea, gasping or HR < 100 → PPV now · NRP 5 · A — position; suction only if obstructed IN PARALLEL — ASSIGN TASKS SpO₂ right hand + a foot Pre- and postductal. Gradient or < 90% → C. O₂ to target B. Glucose now Check point-of-care glucose. If symptomatic and glucose < 40 mg/dL: D10W 2 mL/kg IV then glucose infusion rate (GIR) 5–8 mg/kg/min Pump rates 18 · 04 · newborn glucose 5 · B Temperature · warmer Axillary target: 36.5–37.5 °C. If low: check glucose and consider sepsis. Don’t overheat; maintain normothermia unless the cooling center directs a monitored cooling protocol → F · HIE/cooling. IV access · labs · NPO PIV · blood culture before antibiotics · gas, lactate, CBC, lytes as indicated. Distressed, bilious or lethargic → stop feeds, IV dextrose. Clinical illness overrides every score. A passed critical congenital heart disease (CCHD) screen, a low EOS risk, or a normal CBC does not make a sick baby well. Ask the history GA, hours of life, resuscitation, Apgars, cord gas 3 · D GBS, ROM ≥ 18 h, maternal fever / IAI, antibiotic timing Maternal opioids, magnesium, SSRIs, diabetes, HSV, syphilis · suspected withdrawal, after stabilization 24 · I Last feed, voids, stools, weight loss 10 · 02 Peds / NICU on call ____ · Neonatal code ____ · Transport center ____ 23 · B · Nursery can monitor SpO₂ continuously? ____ B Respiratory distress Tachypnea, grunting, flaring, retractions or an O₂ need after transition: lungs, infection, heart — or not the chest? AAP EOS (Puopolo 2018) · AHA/AAP 2025 Part 5 EPPVDN PPHN consensus (Heart 2016) Support Worsening, apnea, acidosis on gas or rising FiO₂ → NICU, consider intubation · NPO + IV dextrose. Oxygen to the unit SpO₂ target; avoid prolonged 100%. Suspected PPHN: preductal 91–95% (EPPVDN). CPAP for labored breathing or persistent O₂ need while breathing spontaneously, as in the delivery room 5 · A Workup Continuous SpO₂ (pre + post) · blood gas · glucose · CXR Blood culture ± CBC if infection possible → sick = antibiotics D Transient tachypnea of the newborn (TTN) should improve. Worsening distress at any hour → reassess for other causes. Unit SpO₂ target ____ · Max FiO₂ in nursery ____ · CPAP outside NICU? ____ max ____ cm H₂O Transfer if FiO₂ ≥ ____ · CPAP > ____ h · any apnea · IV antibiotics ____ Differential CAUSE CLUES CHEST X-RAY TTN Cesarean without labor, late preterm / early term; tachypnea from birth, mild O₂ need, better by 24–72 h Fluid in fissures, perihilar streaks, hyperinflation RDS Respiratory distress syndrome: late preterm, IDM; grunting that worsens over hours Low volumes, ground glass, air bronchograms Pneumonia · sepsis GBS+, ROM ≥ 18 h, maternal fever / IAI; often poor perfusion, temperature instability → D Any pattern; may mimic RDS or TTN Pneumothorax Sudden worsening, asymmetric breath sounds, after PPV or CPAP Free air; transilluminate if no film yet Meconium aspiration Meconium-stained fluid, depressed at birth; high PPHN risk Patchy infiltrates, hyperinflation PPHN Labile hypoxemia out of proportion to the film; pre > postductal SpO₂ → C Clear, or the underlying disease Cardiac Cyanosis with little distress, murmur, weak femorals, big liver; no rise with O₂ → C Big heart; ↑ or ↓ vascular markings Not the chest Hypoglycemia, hypothermia, metabolic acidosis, polycythemia, CNS depression (maternal opioids or magnesium, HIE, seizures) Normal — check glucose and temperature first C Cyanosis & shock Duct-dependent lesions show as the duct closes Prostin VR Pediatric label (FDA, rev. 2026) AAP CCHD (Oster) 2025 Shock: gray, cool, CRT > 3 s, weak femorals, big liver, acidosis → 4-limb pulses ± BP. Sepsis, duct-dependent systemic flow, hypovolemia, adrenal crisis, inborn error (ammonia, gas, lactate), NAT. Volume 5 · A — cautiously if cardiac failure suspected. Start antibiotics D. Pre > post Right hand higher by > 3% → R→L ductal shunt: PPHN, coarctation, interrupted arch, HLHS Post > pre Foot higher (“reverse differential”) → transposition with PPHN or coarctation: cardiology now Both low, no rise on O₂ Mixing or right-sided obstruction (pulmonary atresia, TOF) — or severe lung disease / PPHN LOCAL Start PGE₁ only with NICU/cardiology. Alprostadil prostaglandin E₁ · suspected duct-dependent lesion 0.05–0.1 mcg/kg/min IV, continuous Apnea in 10–12% — mostly < 2 kg, in the first hour: continuous monitoring, airway ready before transport. Starting infusion per label: 0.1 mcg/","panels":[["A","Escalate now"],["B","Respiratory distress"],["C","Cyanosis & shock"],["D","Suspected sepsis"],["E","Bilious emesis"],["F","Seizures · HIE"],["H","Transfer handoff"],["G","Quick pointers"]]},{"f":"16-pe-dvt.html","n":"16-pe-dvt","sid":"16","g":"emergency","t":"Suspected PE / DVT","text":"ANTEPARTUM · POSTPARTUM · TRIAGE 16Suspected PE / DVT Unstable 01 Stable, pregnant 02 Leg 03 Chest 04 Treat 05 Delivery 06 Postpartum 07 Not PE? 08 Adult doses, normal renal function. SEE ALSO 20 Neuraxial 6 Postpartum 2 Emergencies 27 OB/GYN consult 01 Unstable? No D-dimer/scores 2026 AHA/ACC multisociety PE guideline · ASH 2018 recs 7–8 · Activase label ! Arrest → maternal CPR, uterine displacement, hysterotomy by 5 min 2 · D. Suspected PE in arrest: thrombolysis may be considered during CPR. Unstable Shock, persistent hypotension, severe hypoxemia, syncope (2026 categories D–E) → no D-dimer or scores; bedside echo for RV dilation; CT pulmonary angiography (CTPA) once safe. Call now PE response team or critical care, senior OB, OB anesthesia, MFM; manual left uterine displacement if fundus ≥ umbilicus. Higher-level care / handoff 27 · E 27 · F Anticoagulate now IV UFH by weight-based nomogram (reversible; keeps lysis and procedures open). Life-threatening instability Systemic thrombolysis is suggested in pregnancy (ASH rec 8): alteplase 100 mg IV over 2 h Bleeding risk peaks at and just after birth → catheter-directed therapy, embolectomy or VA-ECMO where available. Isolated RV strain without hemodynamic instability: no routine systemic lysis (ASH rec 7); normotensive shock or deterioration → urgent PERT/MFM review. 02 Stable, pregnant: YEARS Artemis — van der Pol, NEJM 2019 · 2026 AHA/ACC (2b) · Righini, Ann Intern Med 2018 Pregnancy only: these rules are validated in pregnancy. Postpartum: no rule is validated — image: standard adult pathway (CTPA) → panel 04. STEP 1 · SIGNS OF DVT? Yes → compression ultrasound (CUS) first → panel 03 AFTER CUS Clot → treat, no CTPA → panel 05 No clot → step 2; DVT signs still count. No DVT signs, or no clot STEP 2 · COUNT YEARS ITEMS + D-DIMER ① Clinical signs of DVT ② Hemoptysis ③ PE the most likely diagnosis 0 ITEMS D-dimer < 1,000ng/mL FEU? Yes → PE excluded No → chest imaging → panel 04 ≥ 1 ITEM D-dimer < 500ng/mL FEU? Yes → PE excluded No → chest imaging → panel 04 D-dimer assay ____, units FEU / DDU (YEARS cutoffs are FEU; DDU ≈ half) · PE response team: ____ 03 Leg: compression ultrasound ASH 2018 rec 31 · ACOG PB 196 · Chan, CMAJ 2013 · Le Gal (EDVIGE), BMJ 2012 First test Proximal CUS + iliac Doppler, or one whole-leg CUS. Pregnancy DVT is mostly left-sided, proximal. Iliac clue Whole-leg swelling, buttock, flank or back pain → iliac Doppler or MRV even with clear femoral veins. Positive Treat → panel 05. Negative, still suspected Serial CUS (Chan: repeat days 3 and 7) or MR venography without gadolinium. Negative, low suspicion Stop DVT testing only. If evaluating PE, continue its workup. COMPANION NOTE · EVIDENCE AND ALTERNATIVE (NOT A STEP IN YEARS) Artemis: 3-mo VTE after rule-out 0.21%; CTPA avoided in 39% (65% 1st trimester, 32% 3rd). Alternative pathway — use instead of YEARS (CT-PE-Pregnancy): revised Geneva low (0–3) or intermediate (4–10) + D-dimer < 500 → excluded; otherwise (high ≥ 11 included) bilateral leg CUS → CTPA. 0% 3-mo VTE (95% CI 0–1.0%). HISTORY PTS CURRENT FINDINGS PTS Age > 65 1 Hemoptysis 2 Prior DVT or PE 3 Unilateral leg pain 3 Surgery or leg fracture ≤ 1 mo 2 Leg vein tenderness + unilateral edema 4 Active cancer 2 HR 75–94 HR ≥ 95 3 5 04 Chest imaging ASH 2018 rec 30 · 2026 AHA/ACC (2a) · ACOG PB 196 · CO 723 Leg symptoms → CUS first → panel 03. Otherwise chest x-ray first: CXR NORMAL V/Q or low-dose CTPA CXR ABNORMAL CTPA CXR normal — choosing: V/Q (perfusion-only first) — ASH 2018 suggests over CTPA; or low-dose CTPA — reasonable over low-dose perfusion scan (AHA/ACC 2026). Use the faster test locally. Nondiagnostic V/Q or CTPA → the other test, or CUS if not done. Negative CUS does not exclude PE. Fetal dose from either test is far below 50 mGy, the level linked to anomalies or loss (CO 723). Don’t withhold imaging. Iodinated contrast is acceptable in pregnancy; breastfeeding continues (CO 723). 05 Treat ACOG PB 196 tables · ASH 2018 recs 2, 4, 5, 9 · ACCP 2012 · Lovenox label Delivery or neuraxial procedure? Check timing and anesthesia review first → panel 06 20 · 02 LMWH (first line) Enoxaparin 1 mg/kg SUBQ q12h (actual weight). Alt: dalteparin 200 units/kg daily or 100 units/kg q12h. Low risk → outpatient OK: normal vitals; no severe pain, extensive clot, late gestation or comorbidity; teaching + follow-up arranged. UFH When delivery, neuraxial, surgery or lysis may be imminent, or CrCl < 30: IV per nomogram, or SUBQ ≥ 10,000 units q12h to aPTT 1.5–2.5 × control 6 h after dose. Renal CrCl < 30: enoxaparin 1 mg/kg SUBQ q24h or UFH — pharmacy. Anti-Xa Not routine (ASH rec 5). Check for weight extremes, renal impairment, recurrence on treatment. For q12h dosing, check the peak 4 h after a dose; target 0.6–1.0 units/mL. Duration Continue until both are met: ≥ 3 mo total treatment AND ≥ 6 wk postpartum. STOP In pregnancy: no warfarin, no DOACs (2026 AHA/ACC Class 3: Harm). IV UFH VTE nomogram: ____ · enoxaparin dose rounding to syringe size: ____ · anticoagulation pharmacy / hematology: ____ 06 Delivery & neuraxial ASH 2018 rec 10 · ACOG PB 196 · SOAP 2018 Plan a scheduled delivery with anticoagulation stopped beforehand (ASH rec 10); antenatal anesthesia consult; MFM and hematology share the plan. Optional: switch to UFH in the last month, or sooner if preterm birth is likely (PB 196). DRUG STOP BEFORE INDUCTION, CESAREAN OR NEURAXIAL RESTART — AFTER HEMOSTASIS AND ANESTHESIA REVIEW Therapeutic LMWH ≥ 24 h Meet both: ≥ 24 h after neuraxial puncture and ≥ 4 h after catheter removal After high-bleeding-risk surgery: also wait 48–72 h IV UFH 4–6 h + normal aPTT Meet both: ≥ 1 h after puncture and ≥ 1 h after catheter removal Individualize with anesthesia/hematology 6 · E 20 · 02 Acute VTE close to term: IV UFH (stop 4–6 h before birth), hematology; IVC filter only if anticoagulation is impossible. 07 Postpartum & breastfeeding ASH 2018 recs 12–13 · LactMed (NLM, 2026) · ACCP 2012 Compatible: LMWH, UFH, fondaparin","panels":[["01","Unstable? No D-dimer/scores"],["02","Stable, pregnant: YEARS"],["03","Leg: compression ultrasound"],["04","Chest imaging"],["05","Treat"],["06","Delivery & neuraxial"],["07","Postpartum & breastfeeding"],["08","Not PE? Think of"]]},{"f":"17-syphilis-newborn.html","n":"17-syphilis-newborn","sid":"17","g":"reference","t":"Maternal syphilis → newborn","text":"NURSERY · L&D · DESK CARD 17 · FRONT 17 FRONT Maternal syphilis → newborn Start: delivery titers, infant exam, maternal treatment history 17 · 01, then the scenario. Mother reactive in pregnancy and at delivery; neonates < 30 d. Maternal staging 8 · B SEE ALSO 8 Infections 5 Newborn 18 Nursery card 01 START HERESend at birth CDC STI Guidelines 2021 · Congenital syphilis · collect these before choosing a scenario in 02 MOTHER Quantitative RPR or VDRL at delivery — same test as the infant’s, ideally same lab. No mother or baby leaves without maternal serology documented in pregnancy. INFANT Quantitative nontreponemal test on infant serum. Not cord blood: maternal blood can give a false positive; Wharton’s jelly, a false negative. No treponemal test on the infant (maternal IgG persists > 15 mo) · no IgM tests. HIV test for every at-risk neonate. EXAM · PATHOLOGY Exam: hydrops · direct hyperbilirubinemia (direct > 2 mg/dL or > 20% of total) or cholestasis · hepatosplenomegaly · rhinitis · rash · pseudoparalysis of a limb. Placenta / cord to pathology: silver stain or T. pallidum PCR (CLIA-validated). Lesion or nasal discharge: darkfield or PCR. Stillbirth: skeletal survey. 02 Four scenarios CDC 2021 Scenarios 1–4 · infant RPR/VDRL titer vs mother’s at delivery, same test · fourfold = 2 dilutions; 1 dilution is test variability; infant titer < 4× mother’s: congenital syphilis is still possible 1 Proven or highly probable maternal treatment doesn’t matter 2 Possible mother not adequately treated 3 Less likely adequate treatment in pregnancy 4 Unlikely adequate treatment before pregnancy Infant Any one: exam consistent with congenital syphilis · infant titer ≥ 4× mother’s (1:2 → ≥ 1:8; 1:8 → ≥ 1:32) · positive darkfield or PCR of placenta, cord, lesion or fluid, or positive silver stain Normal exam and infant titer < 4× mother’s (e.g., mother 1:8 → infant ≤ 1:16) — then classify by the mother ↓ Exception · don’t wait: maternal rapid treponemal + at delivery, late or no prenatal care → send maternal lab RPR + treponemal test, but evaluate and treat 10 d as Scenario 1; specialist consult. Other maternal discordant patterns 17b · 01 Mother Treat the infant regardless of maternal treatment history Any one: No treatment, inadequate treatment, or treatment not documented Erythromycin or any non-penicillin G regimen (= untreated) Correct regimen started < 30 d before delivery Both: Treated in pregnancy, regimen right for stage, started ≥ 30 d before delivery No evidence of reinfection or relapse Both: Adequately treated before pregnancy Titer low and stable (serofast) before, during and at delivery: VDRL ≤ 1:2 or RPR ≤ 1:4 Evaluate CSF VDRL, cells, protein · CBC, diff, platelets · long-bone films · as indicated: CXR, LFTs, neuroimaging, eye exam, ABR CSF VDRL, cells, protein · CBC, diff, platelets · long-bone films. Evaluation optional with 10-d treatment; LP still useful. CSF needs a clean tap; neonatal reference values 17b · 03 No evaluation Treat 10 d aqueous penicillin G IV or 10 d procaine penicillin G IM 17 · 03 10 d IV or IM 17 · 03 OR Benzathine × 1 only if CSF, CBC and films all normal and follow-up certain 10 d if: any part of the evaluation abnormal or not done · bloody CSF · follow-up uncertain Infant RPR/VDRL nonreactive and maternal risk of untreated syphilis low → benzathine × 1 without evaluation may be considered. Untreated early maternal syphilis at delivery → consider 10 d even if all normal. Benzathine penicillin G 50,000 units/kg IM × 1 OR No treatment only if BOTH apply: 1 Follow-up certain: infant titers q2–3 mo × 6 mo AND 2 Maternal titer either fell ≥ 4× after early-syphilis treatment OR stayed low (VDRL < 1:2, RPR < 1:4) in latent syphilis None required Follow titers to nonreactive. Benzathine × 1 may be considered if the infant’s RPR/VDRL is reactive and follow-up uncertain. 03 Penicillin G regimens CDC 2021 · per kg, < 30 d · allergy, shortage, peds ID 17b · 04 Aqueous crystalline penicillin G preferred · 10 d 50,000 units/kg IV q12h through day 7 of life, then q8h to complete 10 d (interval follows age, not day of therapy) Procaine penicillin G alternative · 10 d 50,000 units/kg IM once daily × 10 d Benzathine penicillin G Bicillin L‑A, never C‑R 50,000 units/kg IM × 1 Scenarios 3–4; Scenario 2 only if its single-dose criteria are met Weight (kg) 2.5 3 3.5 4 Units / dose 125,000 150,000 175,000 200,000 > 1 day of therapy missed → restart the whole course. Ampicillin given for sepsis doesn’t count. 04 Follow-up titers CDC 2021 · every titer here is RPR / VDRL, same test Infant reactive q2–3 mo: exam + titer until nonreactive Not treated (S3, S4) Falling by 3 mo, nonreactive by 6 mo = passive antibody. Still reactive at 6 mo → likely infected: treat Treated 6–12 mo: still reactive → CSF evaluation, expert consult; may need a 2nd 10-d course Abnormal first CSF 6–12 mo: titers persist after penicillin G → repeat LP. Nonpenicillin regimen: repeat CSF (peds ID). Infant nonreactive, mother reactive 3 mo: repeat infant RPR/VDRL (incubating infection) Never follow with treponemal tests. Hand-off: scenario, treatment, titer dates. Sources: Workowski KA et al. CDC Sexually Transmitted Infections Treatment Guidelines, 2021, MMWR Recomm Rep 2021;70(RR-4) — Congenital Syphilis (Evaluation and Treatment of Neonates, Scenarios 1–4, reverse-sequence situations, Follow-Up, Special Considerations; footnotes on direct hyperbilirubinemia, fourfold change, CSF values, non-penicillin regimens) and Syphilis During Pregnancy (adequacy, ≥ 30 d rule); CDC page current Nov 2026 (no newer neonatal guidance). Maternal regimens and missed-dose rule: sheet 8 · B. Items tagged LOCAL are program policy. LOCAL program workflow / policy UPDATED new or changed guidance STOP do not 2 · B sheet · section Turn over ↻ 17b back · maternal discordant results · maternal serology · CSF values · allergy · shortage · peds ID QR: open this sheet in the online kit","panels":[["01","Start hereSend at birth"],["02","Four scenarios"],["03","Penicillin G regimens"],["04","Follow-up titers"]]},{"f":"17b-syphilis-back.html","n":"17b-syphilis-back","sid":"17b","g":"reference","t":"Syphilis serology patterns","text":"NURSERY · L&D · DESK CARD 17 · BACK 17b BACK Syphilis serology patterns Maternal reverse-sequence (treponemal-first) and discordant results at delivery, titer and CSF pitfalls, penicillin allergy and shortage. Send at birth and four scenarios on the front 17 · 01 17 · 02. Maternal staging and treatment 8 · B SEE ALSO 8 Infections 5 Newborn 18 Nursery card 01 Maternal discordant results → newborn action CDC 2021 · reverse-sequence screening situations · results below are the mother’s MOTHER Rapid treponemal + at delivery late or no prenatal care Don’t wait: evaluate and treat the infant 10 d as Scenario 1 17 · 02 Send maternal lab RPR and treponemal test; specialist consult. MOTHER Treponemal +, RPR − after documented adequate maternal treatment Maternal RPR still nonreactive at delivery, infant exam normal and infant RPR nonreactive → manage the infant as Scenario 4: no further congenital-syphilis evaluation or treatment. Benzathine × 1 if exposure possible within 1 mo of delivery and follow-up uncertain. MOTHER Isolated treponemal + e.g., EIA +, RPR −, TP-PA − Usually false positive. Normal infant, low maternal risk → no evaluation, no treatment. Exposure possible → repeat maternal serology within 4 wk. Treponemal tests on the infant are uninterpretable (maternal IgG crosses the placenta). Infant decisions use quantitative RPR/VDRL on infant serum, never cord blood. 04 Penicillin allergy · shortage · peds ID CDC 2021 congenital syphilis · special considerations Penicillin allergy Desensitize, then penicillin G. No neonatal skin testing. Shortage Scenario 1 Check penicillin G supplies; notify CDC/FDA. Aqueous penicillin G unavailable → use procaine penicillin G. Neither available → peds ID: ceftriaxone 50–75 mg/kg IV q24h over 60 min. Contraindicated with hyperbilirubinemia, prematurity through 41 wk postmenstrual age, or IV calcium in an infant ≤ 28 d old. Shortage Scenarios 2–3 Procaine × 10 d or benzathine × 1: apply the scenario’s single-dose criteria 17 · 02 (procaine if evaluation abnormal or incomplete). Single-dose ceftriaxone is inadequate. Call peds ID Any non-penicillin agent · maternal rapid treponemal + at delivery · persistent titers or abnormal CSF at 6–12 mo · desensitization. Peds ID: ____ Health-department report: ____ Procaine / benzathine penicillin G in pharmacy: ____ Our lab screens: traditional / reverse sequence ____ 2nd treponemal test: ____ RPR titer turnaround: ____ 02 Reading maternal results CDC 2021 · syphilis serologic testing MOTHER’S TESTS RPR / VDRL TREPONEMAL 2ND TREPONEMAL USUAL MEANING → ACTION + + Current or past syphilis. Stage, check treatment history and titer trend 8 · B Newborn: send at birth 17 · 01, then scenario 17 · 02 − + + Past treated syphilis, or untreated latent. Treatment undocumented → determine the maternal stage. Stage unknown → treat the mother as late latent. − + − Likely false-positive screen. Low risk, asymptomatic, uninfected partner and reliable follow-up → consider repeat serology within 4 wk; RPR and TP-PA stay negative → no treatment. Follow-up unlikely and no documented prior treatment → treat by stage. + − Biologic false-positive nontreponemal (pregnancy, autoimmune disease, HIV, injection drug use). Repeat treponemal if exposure recent. 03 Titer and CSF pitfalls CDC 2021 TWO SEPARATE EXAMPLES · EACH INFANT TITER COMPARED WITH THE SAME MATERNAL TITER Mother 1:8 at delivery · the baseline Infant 1:16 example A 1 dilution · 2× · test variability Infant 1:32 example B 2 dilutions · 4× · meets the Scenario 1 titer criterion Fourfold = 2 dilutions (1:4 → 1:16), same test. One dilution is test variability. RPR and VDRL titers aren’t interchangeable: compare mother and infant on the same test, ideally same lab. Neonatal CSF needs a clean tap; 95% of healthy neonates have ≤ 16–19 WBC/mm³ or protein ≤ 115–118 mg/dL. Treponemal tests stay positive for life in most treated adults; never use them to judge response. Very high titers (secondary syphilis) can read falsely negative (prozone): ask the lab to dilute when suspicion is high. Sources: Workowski KA et al. CDC Sexually Transmitted Infections Treatment Guidelines, 2021, MMWR Recomm Rep 2021;70(RR-4) — Syphilis (Diagnostic Considerations), Syphilis During Pregnancy, Congenital Syphilis (reverse-sequence screening situations; CSF values; Special Considerations — penicillin allergy, shortages); Papp JR et al. CDC laboratory recommendations for syphilis testing, United States, 2024, MMWR Recomm Rep 2024;73(RR-1). Back of card 17. LOCAL program workflow / policy 2 · B sheet · section Turn over ↻ 17 front · send at birth · four scenarios · regimens · follow-up titers QR: open this sheet in the online kit","panels":[["01","Maternal discordant results → newborn action"],["04","Penicillin allergy · shortage · peds ID"],["02","Reading maternal results"],["03","Titer and CSF pitfalls"]]},{"f":"18-nursery.html","n":"18-nursery","sid":"18","g":"reference","t":"Nursery card","text":"WELL-BABY NURSERY · DESK CARD 18 18Nursery card Term well newborn: birth medications, hepatitis B by maternal status and weight, normal vitals, IV glucose and D10W pump rates, screens, circumcision, newborn discharge. Resuscitation and thresholds 5 · A 5 · B SEE ALSO 5 Newborn 15 Sick newborn 22 Hearing · cCMV 25 Dyad → home 01 Birth medications AAP vitamin K 2022 · CDC STI Guidelines 2021 · USPSTF 2019 Vitamin K (phytonadione) > 1,500 g: 1 mg IM within 6 h (0.5 mL of 1 mg/0.5 mL) ≤ 1,500 g: 0.3–0.5 mg/kg IM once. Not IV for prophylaxis. Eye prophylaxis Erythromycin 0.5% ointment, both eyes, once, as soon as possible after birth (vaginal or cesarean); ≤ 24 h. Does not prevent chlamydial conjunctivitis. RSV antibody Dose and maternal-vaccine rule 5 · E Vitamin K refused: document; oral regimens protect less against late vitamin K deficiency bleeding (VKDB). Any bleeding < 6 mo → think VKDB. 02 Hepatitis B at birth ACIP 2018 Table 3 · AAP 2017 birth-dose statement · matches 5 · E Positive includes other evidence of maternal HBV. HBIG: hepatitis B immune globulin. MOTHER HBsAg ≥ 2,000 g < 2,000 g Positive Vaccine + HBIG ≤ 12 h Separate limbs Vaccine + HBIG ≤ 12 h Birth dose doesn’t count: 3 more doses (4 total) from 1 mo Unknown test mother now Vaccine ≤ 12 h HBIG by discharge or age 7 d (whichever first) if mother positive or still unknown Vaccine + HBIG ≤ 12 h Unless mother confirmed negative ≤ 12 h. Birth dose doesn’t count Negative Vaccine ≤ 24 h Medically stable 1st dose at 1 mo or discharge Whichever first Doses: single-antigen vaccine 0.5 mL IM · HBIG 0.5 mL IM. Maternal HBsAg positive or still unknown → test the infant for anti-HBs and HBsAg at 9–12 mo. Breastfeeding is fine. Guidance status · verify at print ACIP Dec 2025 change stayed by federal court 16 Mar 2026; appeal pending. Current CDC guidance and AAP: universal birth dose. 03 Normal vitals, term AAP COFN, Hospital stay for healthy term newborns (2015) · WHO 1997 HEART RATE · AWAKE 100–190 /min Asleep down to 70 if perfused and responds to activity. Sustained near or above 190 → evaluate. RESPIRATORY RATE < 60 /min No grunting, flaring or retractions. AXILLARY TEMP 36.5–37.4 °C 97.7–99.3 °F, open crib, dressed. WHO: 36.0–36.4 = cold stress. Stable for 12 h before discharge. Exam red flags / sick after transition 15 · A · breathing 15 · B · call NICU 23 · A Weight loss and NEWT 10 · 02 · voids and stools by day 10 · 03 06 Circumcision AAP technical report 2012 (expired 2017, not replaced) · AAP 2015 Defer Unstable or ill · significantly preterm · hypospadias, chordee, buried penis, penoscrotal webbing · blood dyscrasia or family history of bleeding disorder. Confirm vitamin K given. DPNB Dorsal penile nerve block: 1% lidocaine, no epinephrine, 0.4 mL each side at the base (10 and 2 o’clock) = 0.8 mL (8 mg, ≈ 2.7 mg/kg at 3 kg) Ring block 1% lidocaine, no epinephrine, 0.8 mL around the base or midshaft — the most effective option Adjuncts Sucrose pacifier, swaddle, positioning — never the only analgesia. Topical 4% lidocaine is an option; in low-birth-weight infants use a penile nerve block instead (topical anesthetic can irritate the skin). After No excessive bleeding for ≥ 2 h before discharge. Unit lidocaine maximum (mg/kg): ____ · sucrose dose: ____ · device / consent: ____ 04 IV glucose · D10W pump rates AAP 2011 (expired, under review) · thresholds, gel 5 · B Lab Send lab plasma glucose; treat without waiting for it IV bolus D10W 2 mL/kg (200 mg/kg) IV IV infusion and/or D10W at 80–100 mL/kg/day = glucose infusion rate (GIR) 5–8 mg/kg/min Target: AAP 2011 40–50 mg/dL if symptomatic; PES > 60 mg/dL on IV dextrose (> 70 if a persistent disorder is suspected); unit protocol. GIR (mg/kg/min) = % dextrose × mL/kg/day ÷ 144 = % × mL/kg/h ÷ 6 · D10 at 80 mL/kg/day: 10 × 80 ÷ 144 = 5.6 D10W rate → GIR (mg/kg/min) mL/kg/day 60 80 100 120 mL/kg/h 2.5 3.3 4.2 5 GIR 4.2 5.6 6.9 8.3 D10W by weight · infusion at 80 or 100 mL/kg/day Weight (kg) Bolus (mL) Infusion (mL/h) at 80 at 100 2.5 5 8.3 10.4 3 6 10 12.5 3.5 7 11.7 14.6 4 8 13.3 16.7 Can’t keep > 45 mg/dL after 24 h at this GIR → hyperinsulinism workup (insulin with a glucose < 40), endocrinology. Before discharge: normal glucose through ≥ 3 feed-fast cycles. Bolus push time: ____ recheck after bolus: ____ min max peripheral dextrose: ____% call NICU when: ____ 23 · B 40% gel protocol and repeat limit: ____ 05 Screens & labs before discharge AAP 2015 · ACHDNC timeliness · JCIH 2019 Maternal labs Syphilis 17 · 01 · HBsAg · HIV reviewed; infant blood type and DAT if indicated CCHD Pulse oximetry at ≈ 24 h 5 · D Metabolic Blood spot at 24–48 h of age; before any transfusion. Collected < 24 h or before 24 h of milk feeds → repeat per state program Bilirubin TcB or TSB at 24–48 h or before discharge 5 · C Hearing Screen by 1 mo · diagnosis by 3 mo · intervention by 6 mo · refer in either ear 22 · A State repeat-screen rule (early discharge, NICU, transfusion): ____ 07 Newborn discharge checklist AAP COFN 2015 · term 37w0d–41w6d, uncomplicated CLINICAL READINESS complete dyad discharge 25 · A Exam and course need no further stay Vitals normal and stable for 12 h → 03 Vitals Voiding regularly · ≥ 1 spontaneous stool ≥ 2 successful feeds; a breastfeed observed and documented Circumcision: no excessive bleeding ≥ 2 h → 06 REVIEW AND SCREENS hearing + pending CMV owner 22 · H Jaundice assessed with a plan 5 · C EOS risk assessed per guideline 4 · EOS Maternal syphilis, HBsAg, HIV reviewed → 05 Hepatitis B vaccine per risk → 02 Hepatitis B Metabolic, hearing, pulse-ox screens done → 05 Screens HOME PLAN appointments / pending results 25 · H Car safety seat; caregiver education (feeding, jaundice, safe sleep) Medical home; social risks assessed Substance exposure: observe, family plan 24 · F 24 · J Discharged at < 48 h of age → seen ≤ 48 h after discharge Sources: Hand I et al., AAP Vitamin K and the Newborn Infant, Pediatrics 2022;149:e2021056036; CDC ST WH. On prophylactic LMWH: consider switching to UFH 5,000 units SUBQ BID at 36 wk, sooner if early or urgent delivery likely. Therapeutic anticoagulation: individualized delivery plan that keeps treatment intensity. Teach: skip the dose and call with contractions, ROM or bleeding. 02 Timing: hold · catheter · restart HIGH ALERT SOAP 2018 Table 3 · ASRA 2025 · Lovenox label 2025 · restart clocks match 6 · E Applies to: subcutaneous dosing unless noted; normal renal function, > 40 kg. CrCl < 30: use the enoxaparin row below. Neuraxial puncture ① After puncture Restart only when BOTH clocks have run, at the later time — and only with hemostasis and no PPH Catheter still in? Follow the row’s “Indwelling catheter” rule. Catheter removal ② After removal Drug · regimen Hold before: last dose → puncture or catheter removal Indwelling catheter ① After puncture ② After removal UNFRACTIONATED HEPARIN (UFH) 5,000 units BID or TIDlow dose ≥ 4–6 h OR normal aPTT / anti-Xa OK (5,000 units BID); remove ≥ 4–6 h after a dose ≥ 1 h ≥ 1 h 7,500 or 10,000 units BID; ≤ 20,000 units/dayintermediate ≥ 12 h AND normal coagulation Safety not established — anesthesia decides ≥ 1 h ≥ 1 h > 10,000 units/dose or > 20,000 units/dayhigh ≥ 24 h AND normal aPTT OR undetectable anti-Xa ≥ 1 h ≥ 1 h IV infusion Stop 4–6 h AND normal aPTT Not with the infusion running ≥ 1 h no PPH Anesthesia ENOXAPARIN / DALTEPARIN · LMWH Bloody or traumatic tap → ASRA: delay LMWH 24 h Enoxaparin ≤ 40 mg daily · dalteparin 5,000 units dailylow dose · daily ≥ 12 h May stay — first LMWH dose ≥ 12 h after placement; remove ≥ 12 h after a dose ≥ 12 h ≥ 4 h Enoxaparin 30 mg q12hlow dose · q12h ≥ 12 h Remove the catheter before the first LMWH dose after neuraxial placement ≥ 12 h ≥ 4 h Enoxaparin > 40 mg and < 1.5 mg/kg daily, or > 30 mg and < 1 mg/kg q12hintermediate 12–24 h no data for one interval — anesthesia ≥ 24 h ≥ 4 h Enoxaparin 1 mg/kg q12h or 1.5 mg/kg daily Dalteparin 120 units/kg q12h or 200 units/kg daily high (therapeutic) ≥ 24 h after the last dose; on q12h, skip the 2nd daily dose ≥ 24 h ≥ 4 h Also ≥ 24 h after surgery (48–72 h if high bleeding risk) Enoxaparin, CrCl < 30 Double the hold interval Hold ≥ 24 h after 30 mg daily · ≥ 48 h after 1 mg/kg/day. Label: elimination prolonged; anti-Xa can help — ask anesthesia and pharmacy. ANTIPLATELET DRUGS Low-dose aspirin · NSAIDs alone No hold On thromboprophylaxis with a catheter in: consider holding NSAIDs and aspirin, not acetaminophen, until it is out. Aspirin + low platelets: no evidence → anesthesia. Bridge: SOAP lets low-dose UFH bridge when LMWH must wait (restart 1 h vs 4 h). Anti-Xa (ASRA): inside the hold window, ≤ 0.1 IU/mL may support proceeding. SOAP vs ASRA: ASRA restarts low-dose UFH right after removal; this card: SOAP’s ≥ 1 h. 04 Spinal-epidural hematoma ASA 2023 · SOAP 2018 · Lovenox boxed warning ! New numbness or weakness, back pain, bowel or bladder dysfunction — especially after the block had worn off. NOW · IN PARALLEL Call Anesthesia and neurosurgery now LOCALpager ____ · neurosurgery ____ Image Urgent MRI — don’t delay imaging; CT first if MRI not immediate LOCALMRI pathway ____ Hand off Symptom onset time ____ · decompression ideally within 8–12 h of onset. Back pain may be transient; weakness can progress. Consider Fever + back pain + deficit → epidural abscess. After response: report cases — quality, ASA AIRS, MedWatch. LOCALNeuraxial-anticoagulation protocol ____ 05 Urgent delivery, hold not met SOAP 2018 Figures 3–4 · ASRA 2025 Low- or intermediate-dose UFH, any timing Neuraxial may still be right: in an urgent case the risk of general anesthesia can exceed the hematoma risk — placing without delay may be appropriate. High-dose UFH < 24 h or abnormal aPTT · low-dose LMWH < 12 h · higher-dose LMWH < 24 h Insufficient data — consider general anesthesia. Anesthesia weighs airway and comorbidity against hematoma risk. Protamine only when UFH must be reversed urgently. Every unit keeps a written hold-and-restart protocol shared with nursing (SOAP). Higher-level care 27 · E 27 · F 06 Neuro checks ASA 2023 statement Any time Call anesthesia now for increasing or dense motor block After delivery Assess motor block hourly until it resolves 4 h Call anesthesia if motor block persists 4 h after the last local anesthetic dose or infusion stop Catheter Removal by anesthesia or per local protocol, only after the hold interval in 02 Sources: Leffert L, Butwick A, Carvalho B, et al. The Society for Obstetric Anesthesia and Perinatology Consensus Statement on the Anesthetic Management of Pregnant and Postpartum Women Receiving Thromboprophylaxis or Higher ","panels":[["01","Before the needle"],["03","Platelets"],["02","Timing: hold · catheter · restart High alert"],["04","Spinal-epidural hematoma"],["05","Urgent delivery, hold not met"],["06","Neuro checks"]]},{"f":"21-before-discharge.html","n":"21-before-discharge","sid":"21","g":"workflow","t":"Before discharge","text":"L&D TRIAGE · PREGNANT ≥ 20 WK · TRIAGE → HOME 21Before discharge Evaluate A → check the complaint B → plan C–F → teach-back G → document H. Doses, algorithms and trauma observation thresholds → linked sheets. After birth: maternal care 6 · mother-baby discharge 25 SEE ALSO 1 Triage 3 Labor & EFM 6 Postpartum 26 Induction · labor 27 OB/GYN consult A Home only when all are met The MFTI prioritizes evaluation; it does not replace the complete maternal / fetal evaluation. ACOG CO 667 (2016) · AWHONN MFTI FAQ (2022) Unresolved concern, worsening symptoms or discordant findings → pause discharge; reassess / escalate 27 Severe BP, significant bleeding or maternal / fetal compromise 1 2 Evaluation complete: complaint, GA / best EDD, relevant risks and differential reviewed; no unresolved indication for admission, delivery, transfer or further evaluation. Maternal reassessment: repeat vital signs + symptoms reviewed after observation / treatment; abnormalities addressed; symptoms manageable with home plan. Oral fluids / medicines tolerated when relevant. Fetal assessment appropriate to GA + indication; findings interpreted and reviewed; no unresolved fetal concern 3 · A Complaint criteria: every applicable row in B satisfied; identify any unresolved finding before recommending home. Plan achievable: medicines obtainable; follow-up arranged; pending results assigned; language, safety and transportation needs addressed (C, F). Patient understands: written instructions + teach-back completed; knows when, where and how to return (D, G). Disposition clinician ____ 27 · F · required attending review ____ · discharge order / workflow ____ B Complaint check — before home ACOG CO 766 · PB 171 · PB 217 · CO 828 · PB 222 · SMFM Consult 44 · CO 723 · PB 189 · CC 4 (2023) · treatment regimens stay on the linked sheets COMPLAINT REQUIRED BEFORE HOME CRITERIA UNMET OR UNCERTAIN → continue the linked evaluation pathway Labor rule-out Term / latent: maternal + fetal status reassuring; coping at home; shared self-care and reassessment plan. Preterm: indicated evaluation complete; no progressive cervical change or unresolved PTL concern. Pain / fatigue may warrant admission. 1 · 05 1 · 06 3 · B 26 · F LOCAL observation / repeat exam ____ · reassessment ____ ROM rule-out Clinical evaluation supports intact membranes; discordant findings resolved; no infection, bleeding, labor or fetal concern. A negative adjunct test or normal fluid volume alone does not establish intact membranes. Persistent leakage / uncertain diagnosis → reassess. Confirmed ROM → separate disposition pathway 1 · 04 LOCAL equivocal-test pathway / recheck ____ Decreased fetal movement GA-appropriate assessment reassuring; concern resolved; no other indication for surveillance / delivery. Single resolved episode + reassuring evaluation + no other indication → no automatic repeat surveillance. Persistent concern or abnormal testing → disposition-clinician review (A) 1 · 07 3 · A Recurrent decrease → prompt reassessment. Hypertension / preeclampsia evaluation BP trend, symptoms, indicated labs and fetal assessment reviewed; no severe features; diagnosis / GA permits outpatient care; monitoring feasible. LOCAL next BP / review ____ · reviewer ____ Any severe-range episode → disposition-clinician review (A) 2 · B Gestational HTN / preeclampsia at ≥ 37w0d → delivery pathway 1 · 03 Vaginal bleeding Individualized disposition (clinician in A) LOCAL Maternal status stable; fetal assessment reassuring; no active pathologic bleeding or unresolved labor / abruption concern; cause + placental location assessed. Rh / indicated RhIG addressed 1 · 01 1 · 14 Normal US does not exclude abruption. Previa / vasa previa, recurrent or unexplained bleeding → explicit specialist plan. LOCAL observation ____ · follow-up ____ Trauma / MVA Required maternal / fetal observation complete; no criterion for extended observation; injuries addressed; obstetric + trauma disposition agreed. Indicated FMH testing / RhIG addressed 1 · 02 1 · 14 Counsel about delayed pain, uterine tenderness, contractions, bleeding, leaking and decreased movement. LOCAL follow-up ____ Criterion for extended observation met → continue observation. LOCAL observation pathway ____ Abdominal pain Reassessment + indicated tests complete; no unresolved obstetric / surgical concern; symptoms manageable with home plan. Persistent focal, severe, worsening or unexplained pain → further evaluation 1 · 09 If uncertainty remains, explain it and specify reassessment. LOCAL time / location ____ Vomiting New after 20 wk → evaluate another cause 1 · 11 Cause assessed; hydration restored; concerning metabolic findings addressed; oral fluids / planned medicines retained. Persistent dehydration, severe pain, neurologic symptoms or concerning maternal / fetal findings → continue evaluation / admit. LOCAL oral challenge ____ · symptom / lab recheck ____ UTI / cystitis No upper-tract / systemic findings; oral treatment tolerated and obtainable; urine culture sent; susceptibility review assigned. LOCAL culture reviewer ____ · review deadline ____ · symptom recheck ____ Regimen + follow-up policy 8 · A Upper-tract or systemic findings → manage as suspected pyelonephritis (next row). Suspected pyelo­nephritis Initially inpatient 8 · A Fever, flank / CVA pain, systemic illness or vomiting requires reassessment; do not clear as uncomplicated cystitis. Discharge after inpatient pyelonephritis treatment belongs in the infection pathway. C Next encounter + every pending result ACOG PB 222 (2020) · ACOG/SMFM CO 828 (2021) · ACOG CO 517 (2012) · owner / deadline fields are LOCAL Before departure: specify next visit, BP check, lab review and fetal test as indicated. Purpose ____ · date / time ____ · location ____ · receiving clinician ____ · scheduling confirmed ____ Established outpatient gestational HTN / preeclampsia, no severe features: Serial BP / symptom assessment; at least weekly in-person review + weekly labs; fetal surveillanc","panels":[["A","Home only when all are met"],["B","Complaint check — before home"],["C","Next encounter + every pending result"],["D","Get help now — do not wait for the next visit"],["E","Labor + fetal movement"],["F","Make the home plan workable"],["G","Teach-back before departure"],["H","Document the disposition"]]},{"f":"22-hearing-cmv.html","n":"22-hearing-cmv","sid":"22","g":"newborn","t":"Failed hearing screen · cCMV","text":"NURSERY · NICU · NEWBORN CLINIC 22Failed hearing screen · cCMV Refer in either ear → hearing follow-up + cCMV testing decision today. Ill baby → escalate now 15 · A · routine screens 5 · E 18 · 05 SEE ALSO 18 Nursery card 25 Dyad → home 5 Newborn A Read the hearing result ASHA Practice Portal, Newborn Hearing Screening (accessed 2026) · JCIH Newborn Hearing Screening FAQs (2024) pp. 1–2 Method OAE = cochlear response · AABR = auditory nerve / brainstem. OAE can miss auditory neuropathy. Well nursery: OAE or AABR per the validated protocol. NICU: AABR. PASS Both ears pass in the same session. Passes from separate sessions do not combine. Readmitted in month 1 Exchange-transfusion hyperbilirubinemia, culture-positive sepsis, meningitis, newly recognized congenital infection, ventilation / ECMO → AABR rescreen before discharge despite PASS. REFER / did not pass Either ear → rescreen both ears 22 · B Assess cCMV testing indication 22 · C No screen / incomplete Arrange completion 22 · B Review CMV indications 22 · C Ear-canal atresia Including unilateral → pediatric audiology for diagnostic ABR; routine screening cannot clear the affected ear. REFER in either ear · no screen / incomplete → start both tracks now; neither waits for the other HEARING TRACK 22 · B Rescreen both ears → still refers → pediatric audiology (diagnostic ABR). Birth 1 mo 3 mo 6 mo screen diagnosis intervention CCMV TRACK · SAME DAY 22 · C Indication met → collect indicated specimen now; do not await rescreen 22 · D Birth 7 d 14 d 21 d specimen collection window collect by Separate scales: months for hearing, days for cCMV. B Rescreen → diagnose → intervene JCIH Year 2019 Position Statement, Interpretive Criteria · Outpatient Rescreening · JCIH Audiology FAQs (2024) pp. 1–3 · CDC Screening for Hearing Loss (2024) WELL NURSERY Initial inpatient screen. If needed, 1 inpatient rescreen, several hours later. Persistent refer → 1 valid outpatient rescreen of both ears, ASAP and before 1 month. Either ear still refers → pediatric audiology referral now (diagnostic ABR capability). NICU AABR refer Pediatric audiologist for rescreen + diagnostic assessment. OAE alone does not clear this pathway. Prolonged stay → coordinate diagnostic assessment before discharge. Repeated screens and middle-ear fluid must not delay diagnosis. CMV collection proceeds in parallel 22 · C–D Complete by: screening 1 month · audiologic diagnosis 3 months · early intervention for confirmed hearing loss 6 months. Programs meeting 1–3–6 should strive for 1–2–3 (diagnosis 2 months · intervention 3 months ase Routine treatment unsupported; individual decision with pediatric ID. No disease; normal hearing No antiviral outside research. ≤ 12w6dof age When selected: start ASAP, at the latest through age 12 weeks 6 days. Specialist owns dosing and toxicity monitoring. Pediatric ID contact ____ · referral route / after-hours ____ C Who needs cCMV testing? AAP Clinical Report, Care of the Infant With Congenital CMV Infection (2026), Key Action Statements 2 and 4 AAP: hearing-targeted + expanded testing. Test if any: Initial newborn hearing-screen nonpass. Maternal HIV, or maternal CMV infection during pregnancy. Unexplained petechiae, thrombocytopenia, hepatomegaly or splenomegaly, elevated transaminases / direct bilirubin. Compatible CNS findings or intra-abdominal calcifications. Birth weight or head circumference < 10th percentile for gestational age. Preterm Hearing screening delayed beyond 21 days → consider cCMV testing before 21 days. Universal cCMV screening adopted? ____ · Screening specimen / order ____ · confirmation pathway ____ Universal-screen result still pending near the diagnostic deadline → responsible clinician / laboratory plan ____ E Result returns · confirm and evaluate MDH CMV Screening Follow-up, Step 1 Confirmatory Testing · Step 2 Evaluations (accessed 2026) · MDH Provider FAQ Saliva positive; urine pending Obtain timely urine confirmation. Assign a result owner 22 · H Urine po","panels":[["A","Read the hearing result"],["B","Rescreen → diagnose → intervene"],["D","Collect the right specimen"],["F","Valganciclovir · who needs urgent referral?"],["C","Who needs cCMV testing?"],["E","Result returns · confirm and evaluate"],["G","Passed screen? Risk follow-up still matters"],["H","Family · document · report · close the loop"]]},{"f":"23-nicu-transfer.html","n":"23-nicu-transfer","sid":"23","g":"emergency","t":"NICU transferstabilize until transport","text":"L&D · NURSERY · MOTHER-BABY 23NICU transfer stabilize until transport Call early · stabilize in parallel · prepare neonatal transport. Acute actions and doses 15 · A · delivery-room resuscitation 5 · A SEE ALSO 15 Sick newborn 5 Newborn 18 Nursery card Any clinical red flag → FM attending + neonatal consultant now. Start bedside care 15 · A · apnea / gasping or HR < 100/min despite initial steps → assisted ventilation now 5 · A A Call NICU now AHA/AAP 2025 Part 5 · KP EOS calculator (2024), clinical illness · PES 2015 · CDC CCHD 2026 · AAP bilirubin 2022 · BAPM 2024 Arrange transfer when the baby needs assessment, monitoring or treatment beyond this unit’s capability. Respiratory Apnea / gasping; recurrent apnea or desaturation; grunting / retractions or worsening respiratory distress; increasing oxygen or respiratory-support requirement 15 · B Cardiovascular Central cyanosis; poor perfusion, gray / mottled appearance; weak or absent femoral pulses; suspected shock or duct-dependent heart disease 15 · C Neurologic Suspected seizure; encephalopathy; persistent depressed consciousness or abnormal tone; concern for HIE 15 · F Infection Ill appearance or unexplained deterioration with concern for infection. Poor feeding / lethargy, respiratory or perfusion changes may be presenting signs. Temperature may be normal 15 · D Glucose Symptomatic hypoglycemia; recurrent / persistent low glucose despite the adopted pathway; increasing IV glucose requirement 15 · A 5 · B Temperature Unable to maintain 36.5–37.5 °C despite appropriate support, or temperature abnormality with clinical illness. Directed therapeutic hypothermia is an exception. After resuscitation Prolonged ventilation, intubation, chest compressions or epinephrine → monitored postresuscitation care; discuss location with NICU 5 · A Bilious emesis Any green / bilious emesis → prompt neonatal assessment 15 · E + abdominal tenderness / distension or lactic acidosis → time-critical surgical review / transfer; agree destination with neonatology. Normal abdominal x-ray does not exclude malrotation. Bilirubin At ≥ 35 wk: TSB ≥ exchange threshold − 2 mg/dL (age-, GA-, risk-specific) or signs of acute bilirubin encephalopathy → emergency escalation: intensive phototherapy, IV hydration, urgent transfer to an exchange-capable NICU 5 · C Continue in transit when feasible; TSB at least q2h. Failed CCHD screen → evaluate hypoxemia now 5 · D A passed CCHD screen or low EOS risk does not clear a clinically ill baby. B Activate transport · confirm destination AAP Levels of Neonatal Care 2023, Std V–VI · Tennessee DOH Transportation Manual 2025 (model) START TOGETHER — CALL WHILE STABILIZATION STARTS Escalation indicated Call NICU · activate transport SBAR E: immediate threat, current support, why higher-level care is needed. Stabilize S.T.A.B.L.E. C · reassess until handoff D Agree with NICU on destination and required capabilities: respiratory support, cooling, cardiology / echo, pediatric surgery or exchange transfusion. Accepting clinician Transport team, mode, ETA THIS UNIT’S LIMITS · RETENTION / TREATMENT CAPABILITY — VERIFIED Minimum GA ____ wk ____ d Minimum birth weight ____ g Oxygen Maximum FiO₂ ____ · flow ____ · duration ____ CPAP Available outside NICU? ____ · maximum pressure ____ cm H₂O · duration ____ IV glucose Max dextrose ____% · maximum GIR manageable on this unit ____ mg/kg/min Service scope Approved nursery service scope ____ · qualified staff and monitoring currently available ____ · monitoring / thermal support ____ Below an agreed GA / weight limit, or support beyond capability → neonatal consultation and appropriate higher-level care. Do not wait for a limit to be reached if the baby is deteriorating. Transport center / phone ____ · accepting NICU / clinician ____ · bedside medical lead until handoff ____ · alternate destination / escalation if delayed ____ C Stabilize while waiting — S.T.A.B.L.E. S.T.A.B.L.E. 7th ed. 2024 · AHA/AAP 2025 · AAP HIE 2026 · Prostin VR label 2026 · AAP EOS 2018 · Tennessee DOH 2025 · doses on 15 / 5 / 18 DOMAIN START NOW — ASSIGN TASKS IN PARALLEL · RESUSCITATION TAKES PRIORITY TARGET · DOSES · LOCAL S Sugar Bedside glucose now. Symptomatic or persistent hypoglycemia → treatment pathway; IV D10W when indicated. Send laboratory confirmation of low bedside glucose without delaying urgent treatment. Unsafe to feed → NPO and dextrose-containing maintenance infusion per neonatal plan. LOCAL adopted pathway ____ · target by age and clinical condition ____ · post-treatment recheck ____ min · escalation plan ____ Doses 15 · A 5 · B · pumps 18 · 04 T Temperature Radiant warmer; reduce heat loss; monitor temperature. Maintain normothermia unless the cooling center directs a monitored cooling protocol. Avoid hyperthermia. 36.5–37.5 °C A Airway Position airway; suction if obstructed. Apnea / gasping, or HR < 100/min despite initial steps → assisted ventilation now 5 · A Reassess HR response. Titrate oxygen to the agreed SpO₂ target. For a spontaneously breathing infant, CPAP when indicated by the neonatal team, with trained staff and appropriate monitoring 15 · B Recurrent apnea or worsening support needs → reassess airway and transport urgency. LOCAL SpO₂ target ____% · respiratory settings ____ B Blood pressure Assess HR, pulses, capillary refill, BP and urine output; gas / lactate when indicated. Treat the cause with NICU: blood loss, sepsis, cardiac disease or obstruction. Fluids / vasoactive therapy per neonatal plan; reassess response 15 · C 5 · A Suspected duct-dependent lesion → discuss PGE₁ now 15 · C If PGE₁ starts: monitor respiratory status throughout, with ventilatory assistance immediately available; monitor BP and perfusion. PGE₁ dose 15 · C L Lab work Blood culture promptly before antibiotics when obtainable without delaying treatment. Suspected infection → start antibiotics 15 · D Glucose; gas / lactate, CBC and electrolytes as indicated. Do not delay urgent treatment or transport for LP, dif","panels":[["A","Call NICU now"],["B","Activate transport · confirm destination"],["C","Stabilize while waiting — S.T.A.B.L.E."],["D","Reassess until handoff"],["E","Call script · SBAR · packet travels with baby"]]},{"f":"24-substance-dyad.html","n":"24-substance-dyad","sid":"24","g":"newborn","t":"Opioid- or THC-exposed dyad","text":"L&D · POSTPARTUM · NURSERY · PRENATAL OPIOID OR CANNABIS EXPOSURE 24Opioid- or THC-exposed dyad Screen → test only to answer a question → keep treatment → feed by substance → observe → discharge + Plan of Safe Care. Routine care 5 6 18 SEE ALSO 10 Feeding 6 Postpartum 25 Dyad → home 15 Sick newborn A Stabilize first ACOG/ASAM CO 711 (2017) · naloxone 4 mg nasal spray Drug Facts (2026) · infant algorithms stay on 05 / 15 Mother unresponsive or breathing slowly → emergency response + ventilation support + naloxone Now 4 mgnasal Take-home product: 1 spray into 1 nostril → call 911. Persistent or recurrent respiratory depression → repeat with a new device every 2–3 min; stay with the person until EMS arrives. Pregnancy is not a reason to withhold naloxone. Inpatient rescue dosing ____ monitoring ____ Infant ill or unstable → 15 · A Depression at birth → 5 · A Do not attribute an ill infant’s presentation to withdrawal without evaluating other causes. Suspected withdrawal after stabilization → I. B Ask everyone · get the history ACOG/ASAM CO 711 (2017) · ACOG CC 10 (2025) · AAP report (2026) Rec 7 Screen Validated verbal screening at the first prenatal visit; update history at delivery and postpartum. Interview privately; explain confidentiality limits. Ask Substance / formulation · prescribed vs nonprescribed · route · frequency · last use · other sedatives · treatment team. Cannabis Interview / self-report / validated tool. Do not use biologic testing as routine cannabis screening. Maternal toxicology Identify the clinical question → explain limitations and possible reporting consequences → obtain informed consent. A positive result does not establish OUD, current impairment or inability to parent. Document: person with OUD · infant with prenatal opioid exposure · positive / negative result. Avoid “addict,” “drug baby,” “clean / dirty.” Screening tool ____ · documentation ____ · maternal consent pathway ____ C Infant tox: will it change care? AAP report (2026) Table 2, Recs 6–7 · ARUP Consult (2025) Universal newborn toxicology is not recommended. Unexpected withdrawal or unclear exposure history → interview the parent first. Test when results will inform assessment, treatment or feeding decisions. Known MOUD or maternal THC positivity alone does not create an automatic clinical indication. Seek parental permission; explain purpose and use of results. Necessary testing for acute clinical concerns may proceed without permission. Testing declined + unresolved clinical concern → neonatal review, clinical observation plan and safety assessment LOCAL ____. SPECIMEN WINDOW · LIMITS Infant urine promptly Short window; recent exposure. Negative does not exclude prenatal exposure. Meconium first stools, per lab Longer window, mainly later pregnancy. Collection may be incomplete; can contain intrapartum and newborn medications. Cord tissue at birth Longer window, mainly later pregnancy. Can contain intrapartum medications; unaffected by medication first given to the infant after collection. Interpret before acting: presumptive immunoassay positive → definitive confirmation. Review medication records — epidural fentanyl can explain positive infant results. Routine “opiates” assays may omit fentanyl, methadone or buprenorphine. Cord / meconium results do not establish timing, dose, impairment or withdrawal severity; do not use them to determine milk clearance. Urgent care proceeds while results are pending. Consent / escalation pathway ____ · indication ____ · specimen / analytes ____ · confirmation ____ · turnaround ____ · result owner ____ D Mother: keep MOUD · treat pain SOAP/SMFM/ASRA consensus (2025) Table 1 · ACOG/ASAM CO 711 Continue prescribed methadone or buprenorphine through labor, cesarean and postpartum. Verify formulation, total daily dose, last dose and prescriber / opioid treatment program (OTP). Newly identified or untreated OUD / opioid withdrawal → prompt addiction-capable assessment and MOUD initiation plan. Avoid abrupt cessation or withdrawal-only treatment. Naltrexone use → anesthesia / addiction plan ____; opioid analgesia may be blocked. Medication for OUD (MOUD) does not provide complete labor or postoperative analgesia. Anesthesia plan early; offer neuraxial analgesia. Multimodal pain care 6 · E maximums 19 · 04 Additional opioid analgesia may be necessary; individualize with anesthesia / addiction team. With the prescribing team, divide the existing total daily dose every 6–8 h when appropriate for analgesia. Splitting does not replace other pain treatment. STOP While taking MOUD: avoid nalbuphine or butorphanol for pain or neuraxial itch. Avoid naloxone for neuraxial itch. These may precipitate withdrawal. FHR effects 29 · D Naloxone remains indicated for significant respiratory depression or overdose (A). No automatic postpartum dose reduction. Reassess sedation, breathing, withdrawal and cravings; individualize with prescriber. Review additional sedating medicines. OTP / prescriber verification ____ · addiction contact ____ · missed-dose / initiation / transition pathway ____ E Human milk: decide by substance ABM #21 (2023) · ACOG CC 10 (2025) · AAP (reaff. 2026) · LactMed EXPOSURE FEEDING DECISION Methadone · sublingual buprenorphine ENCOURAGE Breastfeeding when otherwise appropriate, regardless of maintenance dose. Extra attention during methadone titration. Injectable buprenorphine INDIVIDUALIZE With addiction / lactation team. Preserve effective OUD treatment while reviewing formulation-specific evidence. Ongoing nonprescribed opioids AVOID DURING USE During use: no direct breastfeeding or expressed milk. Support expression to protect supply; alternative milk 10 · 06 After clearance: resume after multidisciplinary reassessment; set a recurrence plan. Use stopped by / during the delivery stay: support initiation after sufficient clearance and multidisciplinary assessment. Earlier use or a positive delivery test alone is not permanent exclusion. Cannabis · THC COUNSEL A","panels":[["A","Stabilize first"],["B","Ask everyone · get the history"],["C","Infant tox: will it change care?"],["D","Mother: keep MOUD · treat pain"],["E","Human milk: decide by substance"],["F","Observe by actual exposure"],["G","Comfort first · stay together"],["H","Eat, Sleep, Console"],["I","Persistent impairment → escalate"],["J","Discharge both patients · complete the family plan"]]},{"f":"25-dyad-discharge.html","n":"25-dyad-discharge","sid":"25","g":"workflow","t":"Mother-baby discharge","text":"AFTER DELIVERY · MOTHER + NEWBORN → HOME 25Mother-baby discharge Mother B–C + newborn E–G → both D → appointments H → warning signs I → teach-back J. Still pregnant, leaving triage 21 SEE ALSO 6 Postpartum 18 Nursery card 10 Feeding 22 Hearing · cCMV A Two patients — two discharge decisions WHO Positive Postnatal Experience (2022) Rec 46 · ABM #2 (rev. 2022) Rec 8 · management stays on 6 · A and 18 · 07 Separate assessment: mother and newborn assessed separately; each has a discharge clinician and order. Clinically ready: examination, course and required observation support home care; unresolved findings addressed. Plan agreed: family agrees with the plan; home support and follow-up are achievable. Both ready → coordinated discharge. One still needs hospital care → separate disposition plans; preserve rooming-in / milk access where feasible. Maternal clinician ____ · newborn clinician ____ · required attending review ____ · boarding / separation pathway ____ Routine term-newborn criteria (E–G): 37w0d–41w6d. Preterm / NICU course or active complications → condition-specific clearance. B MOTHER Recovery + blood pressure WHO (2022) · CMQCC · ACC (2026) · SMFM HDP checklist (2020, reaff. 2025) · drugs / cuff on 6, 11 Vitals / ergency assessment 6 · D Outstanding prevention ____ · responsible clinician ____ · completion date ____ D BOTH Home plan works for both AAP safe sleep (2022) · car seats (2018 / 2009, reaff. 2025) · AHRQ RED Tool 3 (2013) Feeding supplies, medicines, equipment, phone and transport available; barriers have a named solution. Capable support identified; language / accessibility needs addressed. Safe sleep: supine for every sleep; separate firm, flat sleep surface; fitted sheet only. No loose bedding / soft objects or bed sharing. Room-share at least 6 mo. Appropriate rear-facing car seat present; caregiver demonstrates positioning / use. Born < 37 wk: car-seat observation 90–120 min or expected travel duration, whichever is longer. Support ____ · interpreter / accessible instructions ____ · car-seat test pass / fail criteria ____ · transport / retest plan ____ E NEWBORN Stability + feeding AAP COFN (2015) Rec 1–8 · ABM #1 (2021), #2 (2022), #10 (2016) · AAP NOWS (2020) · details on 18, 10 Exam / course require no further hospital care; EOS assessment / observation complete 4 · EOS Indicated glucose screening complete; glucose stable on the planned home feeding regimen 5 · B 18 · 04 Required exposure-related observation complete 24 Normal vitals stable ≥ 12 h 18 · 03 · voiding regularly; ≥ 1 spontaneous stool. ≥ 2 successful feeds; breastfeed observed / documented, or effective bottle-feeding coordination assessed. If circumcised: no excessive bleeding for ≥ 2 h 18 · 06 Feeding assessment > 10% weight loss, > 75th NEWT percentile, or fewer than 1 void OR fewer than 1 stool per day of life → careful feeding assessment. These findings require assessment; supplementation depends on the findings. Weight ____ g change from birth ____% NEWT ____ percentile Written feeding plan, supplies and support arranged 10 · 01–06 Late preterm / early term → additional feeding safeguards 10 · 07 F NEWBORN Bilirubin sets the next deadline AAP Hyperbilirubinemia CPG (2022) KAS 5, 6, 8, 16,
