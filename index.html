8 °F Persistent headache or visual symptoms No response → emergency care. Also get care right away (HEAR HER): dizziness / fainting, fast heartbeat, severe belly pain or vomiting, extreme face / hand swelling, unusual vaginal discharge, overwhelming tiredness — up to a year after birth. Tell responders when the birth occurred. Maternal 24-h number ____ · return site ____ NEWBORN Call 911 Blue / gray lips, tongue or face Severe breathing difficulty Unresponsiveness Emergency assessment Green vomit Rectal temperature ≥ 38 °C / 100.4 °F Floppy, hard to wake, much less movement or weak suck Urgent assessment Rectal temperature still < 36 °C / 96.8 °F after warming Baby’s clinician now New poor feeding Unusual sleepiness Increasing jaundice Output below the feeding plan Newborn number ____ · return site ____ J Teach-back + document departure AHRQ RED Toolkit Tool 3 (2013) Ask patient / caregiver to explain or demonstrate. Gaps → explain again → repeat teach-back → resolve before departure. “Show how medicines, BP checks and feeding will work at home.” “Which changes need 911? Which need immediate assessment?” “When and where is each patient’s next visit or test?” “Who will contact you about results that are still pending?” “What would you do if something felt seriously wrong, even if it is not on this list?” Both charts document readiness, outstanding issues, discharge plans and receiving clinicians. Written instructions supplied in the preferred language / accessible format. Maternal sign-off ____ · newborn sign-off ____ · interpreter ID ____ · handoff accepted ____ Sources: WHO Positive Postnatal Experience (2022) Rec 46; ABM Protocols #1 Hypoglycemia (2021), #2 Discharge (rev. 2022), #10 Late Preterm (2016); CMQCC Postpartum Discharge: All Patients; ACC Postpartum ECDP Clinician Takeaways (2026); SMFM HDP discharge checklist (2020, reaff. 2025); ACOG PB 181 Rh D Alloimmunization (2017); CDC Timing and Spacing of Immunobiologics (2024); ACOG Maternal Immunization Sched ction & stages of labor Maternal / fetal deterioration, Category III or high-risk II, bleeding, instability → act now; do not wait for a labor clock 3 · A 2 · A Term, live singleton, cephalic; ripening assumes intact membranes. PROM / PPROM 1 · 04 TOLAC needs its own approved plan 3 · B SEE ALSO 3 Labor & EFM 27 OB/GYN consult 7 Prenatal 20 Neuraxial A Induce today? SMFM ARRIVE statement (2019, reaff. 2024) · ARRIVE (NICHD MFMU 2018) · ACOG/SMFM CO 831 (2021) · ACOG FAQ154 Medical indication Hypertension, diabetes, growth restriction, oligohydramnios, infection, ROM or prolonged pregnancy. Condition-specific timing 7 · 08 Do not defer an earlier indication to 39 wk only to reach an elective threshold. ≥ 39w0d Elective Reasonable for a well-dated, low-risk nulliparous patient after shared decision-making. ARRIVE (scheduled IOL 39w0d–39w4d): cesarean 18.6% vs 22.2% expectant; primary adverse neonatal composite not significantly reduced. Discuss ripening, L&D time, monitoring, alternatives, preference; ensure staffing + delivery resources. Fetal death Not these doses: method + dose by GA and uterine history. evaluation → FM attending LOCAL pathway ____ STOPNot the routine IOL pathway: any contraindication to vaginal birth (previa, vasa previa); transverse lie; cord prolapse; active genital HSV lesions / prodrome; prior classical incision, rupture or other scar requiring cesarean; compromise requiring immediate delivery → call FM attending; involve OB/GYN. Before starting Indication + dating Presentation Placental location Uterine operative history Maternal status + vitals Membrane status Baseline fetal assessment Contractions + cervical exam GBS plan Consent Order set ____ · FM attending notification / OB/GYN backup ____ B Assess readiness ACOG CPG 9 (2025) Table 1 · NICHD/SMFM/ACOG workshop (2012) · NICE NG207 (2021) §1.3 BISHOP 0 1 2 3 Dilation, cm Closed 1–2 3–4 5–6 Effacement, % 0–30 40–50 60–70 ≥ 80 Station −3 −2 −1, 0 +1, +2 Consistency Firm Medium Soft — Position Posterior Mid Anterior — Add all five factors; total 0–13. Higher = more favorable. > 8 favorable (traditional teaching) 7–8 no universal cutoff (CPG 9): weigh parity + exam ≤ 6 often unfavorable Unfavorable → ripen (C). Favorable → amniotomy / oxytocin (D). A low score never cancels an indicated delivery. Ripening threshold ____ Membrane sweep from 39w0d: consent; placental location known; separate membranes digitally through the cervix. May bring on labor and reduce formal induction; discomfort, spotting, ROM possible. C Ripen when needed ACOG CPG 9 (2025) Box 1, Pharmacologic / Mechanical / Outpatient, pp.151–156 · Cervidil PI (Ferring, 2020) §§2, 4, 5, 7.1 · Prepidil PI (Pfizer, 2025) · Cytotec label (Pfizer, 2026) STOPPrior cesarean or uterine surgery affecting wall integrity: no miSOPROStol / dinoprostone, and no miSOPROStol combination. Confirm labor eligibility; balloon ± oxytocin may be options 3 · B Method miSOPROStol PO miSOPROStol PV Dinoprostone insert (Cervidil) Dinoprostone gel (Prepidil, endocervical) Balloon / Foley Dose / use term, live fetus 25 mcg q2h selected starting regimen 25 mcg q3–6h 10 mg PV once; ≤ 12 h; hospital use 0.5 mg below internal os; repeat q6h if needed; max 1.5 mg/24 h; hospital use Single or double balloon; studied fills 30–80 mL Key limits PO: preparation / max doses LOCAL ____ · PV: schedule / maximum doses LOCAL ____ Not removable after administration. Grand multiparity: Cytotec label advises against use — confirm method with FM attending. Remove at labor onset, tachysystole / hypertonus, concerning FHR, ROM; before amniotomy; by 12 h. Contraindicated: ≥ 6 previous term pregnancies; unexplained bleeding this pregnancy. Not recommended: ≥ 6 previous term pregnancies; previa or unexplained bleeding this pregnancy. Follow device limits. LOCAL device ____ · fill ____ mL · dwell ____ h · removal ____ → Oxytocin Never coadminister. Oxytocin ≥ 4 h after last miSOPROStol (label-based; not set by CPG 9) with acceptable FHR / uterine activity. LOCAL longer unit interval ____ ≥ 30 min after removal 6–12 h after administration Balloon + oxytocin or balloon + miSOPROStol may shorten induction in appropriate candidates. All Monitor fetal status + uterine activity during pharmacologic ripening; reassess before repeat dosing. Tachysystole or concerning FHR → hold further prostaglandin (E). Choose the method by clinical findings, history, preference and setting. Monitoring schedule ____ · reassessment ____ Outpatient ripening: selected low-risk patients without an indication for ongoing monitoring; only on the approved program pathway (below). Cervidil + Prepidil require hospital use; Cytotec labeling specifies hospital use for obstetric administration. Return for ROM, bleeding, reduced movement, painful regular contractions, severe pain or concern 21 Eligibility / method ____ · fetal assessment / observation ____ · return time / contact / access ____ D Amniotomy + oxytocin ACOG CPG 8 (2024) pp.152–154, Table 3 · AHRQ Labor Dystocia (2020) Table 67 · NICE NG207 §1.7.5 · CRICO OB Guideline 15 (2026) · AHRQ Safe Oxytocin tool (2023) Amniotomy shortens induced / augmented labor. Confirm presentation, a stable, well-applied presenting part and placental site. High / mobile head → cord prolapse risk: FM attending assesses first. FHR before and immediately after; sudden fall → examine for cord 29 · A Document ROM time + fluid. On oxytocin, also assess maternal vital signs, fluid intake / output, resting tone, pain and bleeding; escalate signs of uterine rupture or water intoxication. Intervals LOCAL OXYTOCIN HIGH ALERT · IV PUMP milliunits/min START INCREASE INTERVAL Low-dose 0.5–2 1–2 15–40 min High-dose ≥ 4 3–6 15–40 min Published regimen categories; use one approved unit order. Either is reasonable; high-dose is not an individualized starting order. Monitor FHR + uterine activity continuously; validate the signals 28 · A 28 · D. Titrate to clinical response. Bag concentration ____ · start / increment / ≥ 12–18 h before failed induction > 18 h: individualize ≥ 6 cm + ROM · clock = no cervical change 0 1 2 3 4 5 6 h 4 h adequate activity 6 h inadequate activity + oxytocin arrest record complete time + pushing start Nulliparous > 3 h Multiparous > 2 h with or without epidural: prolonged → individualized review 0 1 2 3 4 h hours of pushing Earlier arrest no rotation / descent despite adequate contractions, effort and time → FM attending + OB/GYN early → assess operative vaginal birth before cesarean uterotonic per birth orders QBL · tone No PPH, placenta pending 15 min reassess · empty bladder · assist (trained controlled cord traction) 30 min prepare manual removal: FM attending + anesthesia ± OB/GYN 0 15 30 min minutes after birth Bleeding / instability → immediate response (2 · A) No placental time cutoff; removal timing individualized. Phase by dilation Descriptive duration — no decision Decision criterion Alternative condition Action Clock starts — record the time Historical Timing criteria, not a dilation trajectory. Population curves describe patterns; they do not prescribe an individual cesarean deadline. Manual removal: antibiotic prophylaxis recommended (WHO). No extra uterotonic solely for retained placenta without PPH. No separation plane → suspect PAS: stop forceful removal; surgeon, anesthesia, blood bank 27 · B LOCAL agent / dose / allergy alternative ____ · retained-placenta pathway ____ Support throughout: continuous support person; explain progress + next assessment; mobility / position changes as feasible; clear fluids when appropriate; hydration, bladder, coping. Offer pain relief; neuraxial may be offered at any dilation 20 Home coping 21 G Slow progress, arrest or failed induction? ACOG CPG 8 (2024) Protraction / Arrest pp.149–150 · Induced Labor pp.151–152 · Second Stage pp.150–151, 155–158 INDUCED · NOT YET ACTIVE Failed induction? Reassuring status → allow oxytocin ≥ 12–18 h after ROM before declaring failure; beyond 18 h individualize. Ripening time excluded. Latent phase > 16 h is not latent arrest. Criteria not met → continue; reassess ACTIVE · ≥ 6 CM Protraction < 1 cm / 2 h → assess; optimize amniotomy / oxytocin; ROM + protraction or unclear contractions → IUPC 28 · E Arrest: ≥ 6 cm + ROM, no change despite 4 h adequate or 6 h inadequate + oxytocin Adequacy convention > 200 MVU / 10 min by IUPC 28 · F; interpret clinically. FM attending confirms arrest → OB/GYN for cesarean 27 · B SECOND STAGE Push from complete. Decelerations with pushing 29 · C Prolonged pushing Nulliparous: > 3 h · Multiparous: > 2 h with or without epidural → individualized review; no automatic extra epidural hour. Earlier arrest: absent rotation / descent despite adequate contractions, effort and time. Persistent OP / OT → confirm position; consider manual rotation (trained operator). FM attending + OB/GYN early 27 · B → assess operative vaginal birth before cesarean 3 · B First confirm maternal / fetal status, contractions, position, bladder and support. Document ROM time, oxytocin start, interruptions and each cervical change; record complete time and pushing start. FM attending → OB/GYN consult trigger ____ · contact / backup ____ Sources: SMFM Statement on Elective IOL in Low-Risk Nulliparous Women at Term — ARRIVE (2019, reaff. 2024); Grobman et al., NICHD MFMU ARRIVE, NEJM 2018; ACOG/SMFM CO 831 Medically Indicated Late-Preterm and Early-Term Deliveries (2021); ACOG FAQ154 Labor Induction (2022, rev. 2025); ACOG CPG 9 Cervical Ripening in Pregnancy (2025); NICHD/SMFM/ACOG Workshop, Preventing the First Cesarean (2012); NICE NG207 Inducing Labour (2021); Cervidil PI (Ferring, rev. 2020); Prepidil PI (Pfizer, rev. 2025); Cytotec labeling (Pfizer, 2026); ACOG CPG 8 First and Second Stage Labor Management (2024; correction 2025); AHRQ Labor Dystocia (2020); AHRQ Safe Medication Administration: Oxytocin (reviewed 2023); CRICO OB Guideline 15 (2026); ACOG CPG 10 Intrapartum FHR Monitoring (2025); Zhang et al., Consortium on Safe Labor, Obstet Gynecol 2010; ACOG CO 766 Limiting Intervention During Labor (2019); WHO/FIGO/ICM Consolidated PPH Guidelines (2025). Items tagged LOCAL are program policy. LOCAL program workflow / policy UPDATED new or changed guidance STOP do not 2 · B sheet · section Open on phone QR: open this sheet in the online kit","panels":[["A","Induce today?"],["B","Assess readiness"],["C","Ripen when needed"],["D","Amniotomy + oxytocin"],["E","Too many contractions?"],["F","Stages of labor — name the stage, use the right clock"],["G","Slow progress, arrest or failed induction?"]]},{"f":"27-ob-consult.html","n":"27-ob-consult","sid":"27","g":"workflow","t":"When to call OB/GYN","text":"FM MATERNITY CARE · OB/GYN BACKUP · L&D · POSTPARTUM 27When to call OB/GYN Say what you need — phone advice, bedside review, co-management or transfer of care — and who owns care afterward. Competence, privileges, resources and explicit acceptance decide the route. No national diagnosis list exists: response assignments are LOCAL. SEE ALSO 1 Triage 2 Emergencies 26 Induction · labor 4 Workflow A Emergency? Call OB/GYN to the bedside now CMQCC OBH Toolkit v3.0 (2022) App. C · ACOG PB 203 Boxes 4–6 · SMFM Consult 67 (2023) · ACOG CPG 10 (2025) · AHA (2025) · AAFP Birth Equity (2026) · AAFP–ACOG joint statement §§A–B · ownership is LOCAL Activate the emergency response. Call FM attending + OB/GYN to the bedside; notify the bedside RN. Start treatment while help comes. 2 · A 2 · B 2 · C 2 · D 29 · A Now Severe-range BP without seizure: treat + tell FM attending now; OB/GYN to the bedside if refractory or ≥ 180/120 B No answer by the backup time (right), still worsening or unsafe? Call the backup, then the chain of command. Say: I am concerned about ____. I need you at the bedside now. Immediate danger → emergency activation. FM attending ____ OB/GYN first call ____ OB/GYN backup ____ Emergency activation ____ MFM / transfer center ____ Escalate: backup after ____ min Emergencies: OB/GYN assumes maternal primary when ____ · escalation leader ____ · interim responsible attending ____ · chain of command ____ Scope: FM procedural privileges / supervision ____ · scope agreement ____ · OB/GYN-primary criteria ____ · co-management criteria ____ · return-to-FM criteria ____ · postoperative / readmission service ____ B Situation → response CMQCC · PB 203 · ACOG HTN algorithm (2023) · SMFM 67 · CPG 10 · OCC 9 Table 3 · OCC 7 · SMFM 37 · PB 205 · 219 · 222 · CO 745 · AAFP (2022) · AFP (2021) · LOCAL cells are program policy CONSULTATION — HOW RESPONSIBILITY — WHO WHERE Separate choices, not one ladder: choose the consultation (how); separately agree who is responsible and where care happens. Situation · defining condition · reference FM manages FM stays primary Phone consult stable · focused question Bedside consult presence needed Co-manage named primary + OB tasks OB assumes care accepted · scope · time Transfer to higher level exceeds capability Emergency · any phase Nowactivate the emergency response · start treatment while help comes Hemorrhage — stage 2 2 · AOB/GYN to the bedside already at stage 2. Call earlier for deterioration or need beyond resources. Start Rx — Stage 2 Stage 3 · major or worsening bleeding 2 · ASuspected uterine rupture / inversion / major abruption; shock; bleeding persisting despite initial measures or needing operative control → add surgery, anesthesia, critical care; name procedural lead + maternal primary. Start Rx — Now Eclampsia 2 · BSeizure → magnesium + airway; FM attending, OB/GYN, anesthesia to bedside now — even without severe BP. Start Rx — Now Severe-range BP · ante- or postpartum 2 · BSBP ≥ 160 or DBP ≥ 110 → recheck ≤ 15 min (sooner OK) · still severe → treat within 30–60 min · tell FM attending now. 2nd agent → emergent MFM / critical-care consult. Still severe after the rescue dose, or ≥ 180/120 → OB/GYN to the bedside. LOCAL other triggers ____ Start Rx — Refractory · ≥ 180/120 Shoulder dystocia 2 · CCall extra hands, OB/GYN, newborn team. McRoberts + suprapubic pressure now; no fundal pressure. Maneuvers — Now Maternal arrest 2 · DCPR + defibrillation as usual; code + obstetric surgical response. Fundus ≥ umbilicus → manual left uterine displacement; prepare delivery from recognition; no ROSC → deliver at the bedside, aim by 5 min. CPR — Now Category III · cord prolapse · urgent birth 3 · A 29 · AIntrauterine resuscitation as indicated; cord prolapse → relieve cord compression. Category III unresolved after initial measures → expedite delivery. Resuscitate — Now Suspected sepsis 13 · 02 13 · 04Activate the multidisciplinary emergency response; begin treatment immediately. Emergency source control when indicated; uterine source → prompt delivery / evacuation. Start Rx — Now Antepartumstable findings: formal consult early enough to plan surveillance, delivery site, operator, escalation · record the plan where the admitting team finds it Placenta / vasa previa · suspected PAS 1 · 01Site + hemorrhage plan; MFM / PAS team for suspected PAS or previa + prior uterine surgery. Vasa previa: neonatal transfusion on site; known + ROM / labor at viable GA → prompt cesarean; don’t await bleeding. OB/GYN review + MFM / PAS team PAS: level III / IV Prior uterine surgery · planned TOLAC 3 · BReview operative report; candidacy per PB 205. Prior classical / T incision, prior rupture or extensive transfundal surgery generally precludes planned TOLAC. Delivery plan Labor, ROM, bleeding, pain → urgent bedside Preeclampsia with severe features 2 · BTell FM attending now; severe BP → emergency row above. Urgent inpatient assessment. ≥ 34w0d: deliver after stabilization; do not delay for late-preterm steroids. < 34w0d: expectant care only if selected, stable, appropriate resources E; deterioration → deliver after stabilization. Urgent assessment + MFM if complex Expectant remote from term: level III Twins / higher-order · persistent malpresentationChorionicity + amnionicity; monochorionic → MFM surveillance E. Timing, operator, neonatal resources; name who owns the plan. ECV: contraindications, consent, cesarean readily available. Formal consult + plan Major maternal disease · fetal complication · threatened early birth / PPROM 1 · 04 / 06 7 · 07 7 · 08Define specialist involvement + place of care. Formal consult + MFM if complex Exceeds capability Intrapartumcall before the needed intervention Possible operative vaginal birth or cesarean · unsuccessful vacuum / forceps 3 · B 26 · GRequest bedside assessment as the need develops; agree indication, urgency, operator, backup + maternal primary. Failed attempt → bedside reassessment now. As need develops TOLAC · twins · malpresentation in laborOutside the documented plan → bedside review + revised ownership. Per plan Outside plan 3rd- / 4th-degree laceration (OASIS) 3 · CClinician experienced + credentialed in sphincter repair; adequate anesthesia, exposure, assistance. Consider OR. If credentialed Postpartumnew instability, major bleeding, seizure, severe BP, acute cardiopulmonary / neurologic concern → emergency rows Persistent hemorrhage · retained placenta · expanding hematoma 2 · A 3 · CPossible uterine / surgical intervention → credentialed proceduralist; agree primary service. No separation plane → suspect PAS; stop forceful removal; blood bank + anesthesia. Assess Headache red flags · suspected PE 14 · 01 16 · 01Emergency pathway + specialist support. Severe BP → emergency row, same answer. Ongoing BP 6 · B 11 Start Rx Stable postpartum complicationFormal consult when advice, intervention or monitoring exceeds team scope. Within scope Beyond scope → formal consult Expected response Conditional / interim — condition in cell — not this response LOCAL — program assigns before posting Emergency rows: red label + red dot C Make the call — SBAR AHRQ TeamSTEPPS 3.0 (2023) SBAR · OB fields are LOCAL adaptation · generic call 4 S SITUATION“FM resident ____ with attending Dr ____. Patient ____, G__P__, __w__d / postpartum day __, room __. Concern ____; stable / deteriorating. I need ____ now / by ____.” B BACKGROUND“Relevant risks ____; uterine surgery / placenta ____; labor / delivery course ____; allergies ____; treatment given, doses + times ____.” A ASSESSMENT“Maternal vitals / trend ____; bleeding ____; fetal status if pregnant ____ 29 · F; exam / results ____; treatment response ____; uncertainty ____.” R REQUESTChoose: phone advice · bedside review · co-management · assumption of primary maternal care. “I need ____. Proposed next step ____. Please confirm the plan, urgency and responsible clinician.” Repeat back: immediate actions ____ · consultant arrival / next contact ____ · worsening trigger ____ · responsible attending ____. D Agree explicitly — who owns care AAFP Consultations, Referrals & Transfers of Care (2025) · AAFP–ACOG joint statement §§A–B · workflow is LOCAL Phone Question, recommendations, reassessment, conditions that require bedside review. FM remains primary. Bedside Who is coming, urgency / arrival plan, care while awaiting arrival. Confirm ongoing ownership. Co-manage Explicitly agreed shared care: named maternal primary; OB/GYN responsibilities; order-writing roles; pending-result owner; escalation triggers. OB assumes care Accepting attending, scope, effective time; FM’s continuing role; criteria for return to FM. Curbside General discussion. If patient-specific advice will drive management → formal consultation, documented. Beyond FM privileges → credentialed clinician; agree: procedure, one problem or whole episode. Procedure lead and maternal primary may differ — document both. A page or consult order alone does not establish acceptance; the sending clinician stays responsible until the receiver accepts. E Need MFM or a higher level of care? ACOG/SMFM OCC 9 (2019, reaff. 2025) Table 3 · OCC 7 (2018) · SMFM Maternal Transport Checklist (2020, reaff. 2025) MFM consult Complex maternal / fetal disease, suspected PAS, remote-from-term severe preeclampsia. Agree: advice, shared care or transfer. Higher-level facility Care exceeds surgical, anesthesia, transfusion, critical-care or neonatal capability → contact the receiving team. Suspected PAS: experienced level III / IV center. Severe preeclampsia < 34w0d, selected expectant care: appropriate maternal + neonatal resources (OCC 9: level III example). While arranging Stabilize; continue indicated emergency treatment / delivery. Sending + receiving clinicians agree urgency, transport suitability, interim treatment; confirm acceptance, destination, bed / capability, transport team, equipment, records F. Separate decisions Maternal and NICU levels are separate assessments. MFM advice, OB/GYN primary care and interhospital transfer are separate decisions. Maternal level ____ · neonatal capability ____ · transfer criteria ____ · receiving center ____ · transport pathway ____ F Close the loop — document + hand off AHRQ Handoff (2023) · AAFP transfer definition (2025) · SMFM briefing form (2020) · fields LOCAL Reason + urgency Call / response times Consultant Assessment / recommendations Actions taken Maternal primary · procedure lead Order-writing roles Pending results + owner Reassessment / escalation plan OB/GYN assumes care: Dr ____ accepts primary maternal care for ____ effective ____. Care while awaiting arrival / transport: clinician ____, plan ____. FM continuing role ____. Interfacility transfer: hospital / unit + accepting clinician / time ____ · departure maternal / fetal status ____ · transport team + monitoring / medicines en route ____ · MD-to-MD + RN-to-RN handoff ____ · consent + records sent ____. Return to FM: accepting FM attending ____ · effective time ____ · remaining problems / pending-result owners ____. Tell the patient and bedside RN; update both teams and the EHR. Allow questions and confirmation. Before discharge: primary service, follow-up, pending-result owner — triage 21 · C / H after birth 25 · H / J Sources: AAFP–ACOG Joint Statement (AAFP policy action 2025), §§A–B; AAFP Consultations, Referrals & Transfers of Care (2025); AAFP Pregnancy, Perinatal & Newborn Care (2023); AAFP Cesarean Delivery in Family Medicine (2022); AAFP Birth Equity (2026); CMQCC Obstetric Hemorrhage Toolkit v3.0 (2022), App. C; ACOG PB 203 Boxes 4–6; ACOG Acute Hypertension in Pregnancy & Postpartum Algorithm (2023); SMFM Consult 67 (2023, reaff. 2025); ACOG CPG 10 (2025); AHA CPR/ECC Guidelines (2025), Part 10; RCOG GTG 50 (2014, reviewed 2024); ACOG/SMFM OCC 9 (2019, reaff. 2025), Table 3 (examples, not mandatory assignments); OCC 7 PAS (2018); SMFM Consult 37 (2015, reaff. 2024); SMFM Monochorionic Twin Checklists (2026); ACOG CO 745 (2018, reaff. 2026); PB 205 VBAC (2019, reaff. 2024); PB 222 (2020, reaff. 2026); PB 219 (2020); PB 183 Postpartum Hemorrhage (2017); AAFP/AFP Obstetric Lacerations (2021); SMFM Maternal Transport Checklist (2020, reaff. 2025); AHRQ TeamSTEPPS 3.0 SBAR and Handoff (2023). No national diagnosis-based FM → OB/GYN transfer list exists; specialty assignments, attendance rules, response intervals, privileges and transfer thresholds are program policy. Items tagged LOCAL are program policy. LOCAL program workflow / policy UPDATED new or changed guidance STOP do not 2 · B sheet · section Open on phone QR: open this sheet in the online kit","panels":[["A","Emergency? Call OB/GYN to the bedside now"],["B","Situation → response"],["C","Make the call — SBAR"],["D","Agree explicitly — who owns care"],["E","Need MFM or a higher level of care?"],["F","Close the loop — document + hand off"]]},{"f":"28-fm-signal.html","n":"28-fm-signal","sid":"28","g":"intrapartum","t":"Fetal monitoring: signal","text":"L&D · INTRAPARTUM · EFM EQUIPMENT 28Fetal monitoring: signal Lost signal, uncertain source or apparent bradycardia = fetal status unknown → assess the patient, call FM attending, confirm by ultrasound. Equipment checks never delay indicated delivery 3 · A 29 · A Confirm fetal rate · troubleshoot sensors · measure contractions. Definitions, Categories, resuscitation 3 · A · oxytocin 26 · D · tachysystole 26 · E SEE ALSO 3 Labor & EFM 29 FHR · response 26 Induction · labor 20 Neuraxial A Confirm the fetal signal ACOG CPG 10 (2025) pp.591–592 · NICE NG229 §§1.4.5–9 · AWHONN (2024) · HRS (2023) · NICE NG137 §1.11 Maternal capture. Pushes look like accelerations because the trace is the mother’s pulse; no fetal information while captured. Synthetic; values illustrative. IS THAT REALLY THE FETUS? Patient + channel: right patient, monitor, transducer, channel. Mother: palpate pulse; display maternal SpO₂ HR beside the tracing. Fetus: listen; compare audible, displayed and maternal rates at the same time. Signal: contact, position, connections. Good signal quality ≠ fetal origin. Still uncertain → bedside ultrasound for fetal cardiac activity + rate; FM attending / OB/GYN now; consider FSE C CAPTURE CLUES · suggest, do not prove Displayed rate = maternal pulse; “accelerations” with each push (key sign); abrupt baseline shift; unexpected “recovery” after poor signal. Can occur without a visible break. Second stage: maternal HR rises into the fetal range as the fetus descends: keep it visible. Push-timed accels on 12% of external vs 4% of FSE tracings — ≈ 8% may be maternal. Fast / irregular maternal pulse: BP, symptoms, 12-lead ECG; confirm fetal rate independently. Source confirmed → classify and act 3 · A Twins: confirm two hearts. Ultrasound-map each heart; label channel ↔ twin; maternal pulse too. Matching detail on both channels → one fetus recorded twice: ultrasound, reposition. A display offset does not prove two sources. Keep monitoring twin B after the first birth. Twin channel labels ____ · FM attending ____ · OB/GYN ____ B Sudden half or double rate? Philips Avalon IFU ch.12 · FIGO CTG (2015) §§3.2–3.3 · GE 250cx manual Exact ×2 / ÷2 jumps while independent checks (◇) stay put: suspect counting artefact. Synthetic. LOOK Abrupt switch to ≈ ½ or 2× the prior rate, often with gaps. WHY Autocorrelation locks onto the wrong interval: missed cycles (halving) or extra counted signals (doubling). DO Verify immediately: assess apparent brady- / tachycardia now; compare maternal pulse; listen; reposition. Uncertain → ultrasound. Ongoing difficulty → FSE when eligible C STOPNever multiply or divide the displayed rate and call it fetal. Assess the true rate + prior record 3 · A Gap = missing data: never read depth, recovery or variability across it. Irregular beats? External Doppler may misrepresent an arrhythmia → FSE when eligible C rhythm 29 · D READ THE SCALE US paper, 3 cm/min: 1 small division = 10 s; 6 = 1 min. FHR 30 bpm/cm; minor line = 10 bpm (as in these strips). Check speed + scale on paper and screen: zoom or 1 cm/min (UK) changes shape, not duration. Monitor model / IFU ____ · recorder speed / scale ____ C FSE: better acquisition, verify the source ACOG CPG 10 (2025) Box 2 · NIH Perinatal HIV (2025) · Philips Avalon IFU ch.16 · FSE IFUs FSE rate = maternal HR: unresolved until ultrasound shows fetal cardiac activity. After fetal death an FSE can record maternal ECG. Synthetic. CONSIDER · BEFORE PLACING Use when external FHR stays inadequate despite adjustment, or maternal vs fetal rate remains unclear. Not routine: small ↑ scalp injury + cephalohematoma. Check: consent · ROM · cervical access · identified vertex scalp · infection + bleeding risk · IFU + minimum GA. STOPACOG absolute: malpresentation / unknown presenting part · HIV viral load > 1,000 copies/mL · active genital HSV lesions · placenta or vasa previa · suspected fetal hematologic disorder (fetal hemophilia, NAIT, maternal ITP). HIV (NIH): RNA ≥ 50 copies/mL or unknown → do not use FSE; suppressed → avoid; expert review. Hepatitis B / C: relative; individualize. VERIFY · TROUBLESHOOT A readable FSE trace does not prove a fetal heartbeat. Keep maternal HR displayed; compare after application, any abrupt change or unexplained “recovery”. Rates coincide / origin uncertain → urgent bedside ultrasound + FM attending; keep treating apparent compromise meanwhile. Matching rates alone neither prove capture nor diagnose death. Apply / remove per the stocked IFU: avoid fontanelles, sutures, face, genitalia; never over-rotate; unscrew counterclockwise, never pull; check the spiral is intact; tell the newborn team the site. Leads off / erratic: compatible cable, dry connector, reference-electrode contact, lead tension — before any re-application. No blind extra turns or traction. Suspected arrhythmia on FSE: artifact suppression also hides it — switch suppression off per IFU (Avalon: ArtifactSuppress Off); rhythm 29 · D Electrode / IFU revision ____ · minimum GA ____ · authorized operator ____ D External toco: time it, palpate it AWHONN (2020, 2024) · FIGO CTG (2015) §3.4 · ACOG CPG 10 Table 1 Flat toco while contractions are felt: move it over the fundus, secure it. Synthetic. ASSESS EXTERNAL TOCO PALPATION Frequency Detects when acquisition is adequate Palpate if missed / ambiguous Duration Approximate onset → end Time onset → end Intensity Height is relative: not strength, not mmHg Mild / moderate / strong Resting tone Baseline is relative: not resting pressure Soft / firm between contractions Flat / small trace: palpate the fundus while watching; reposition over palpable activity; restore contact; secure belt. Reset the external reference between contractions per IFU. Spikes with breathing, cough, turning or pushing → compare with what you see; count only confirmed contractions. Obesity can reduce detection: a quiet trace does not exclude contractions. Do not titrate oxytocin from an unreliable trace; MVU only from a valid IUPC F Tachysystole > 5 / 10 min, averaged over 30 min 26 · E Contraction ≥ 2 min → assess promptly. Timing still unclear → IUPC when indicated E E IUPC: validate the pressure trace ACOG CPG 8 (2024) p.156 · INTRAN Plus IFU (2020) · Koala QRG (2024) · Rinehart 2000 Flat IUPC despite palpable contractions = invalid until checked. Do not base augmentation on an invalid pressure. Synthetic. USE WHEN THE NUMBER CHANGES CARE ROM + protracted active labor needing quantified adequacy, contractions not assessable externally, or amnioinfusion 29 · C Not routine: no outcome benefit over external. Check cervical access, presenting part, placental location, consent. STOPNo insertion: known / suspected placenta previa or unexplained uterine bleeding · vasa previa · intact membranes or inadequate access. Guard the introducer with fingers at the cervix, never beyond fingertips; never force resistance. Resistance, frank blood, new pain / bleeding or FHR change → stop; assess now: FM attending + OB/GYN. A normal pressure trace does not exclude rupture. Amnioinfusion via the IUPC port only after intra-amniotic placement is confirmed: fluid flashback, crisp waveforms, good baseline; a reading alone is not proof. NS or LR; label tubing. Pause for sustained pressure rise / firmness, no fluid return, new pain / bleeding, worsening FHR. Study regimen (Rinehart 2000): 500 mL NS over 30 min, repeat if variables recur; or bolus then 3 mL/min. Indication + unit order 29 · C TRACE WRONG? patient → placement → system Flat, contractions felt UA input / mode, cable, zero control back to monitor, displacement, failure Damped / small Placement; fluid-filled: kinks, air, level. Unreliable → replace High / negative, no fluid return Possible extra-ovular catheter — still gives readings. Do not advance or infuse to “prove” it Resting pressure rising Palpate + check FHR first; position, migration, retained fluid. Never zero away sustained tone Spikes: cough / push Annotate; not extra contractions, not amplitude Zero per the stocked system (tip-sensor, air-coupled, fluid-filled differ). Atmospheric zero ≠ resting pressure. IUPC model / IFU ____ · authorized operator / supervision ____ F Calculate MVU over 10 minutes ACOG CPG 8 (2024) pp.149, 156 · Rosen & Yogev 2023 · INTRAN Plus (2021) · AWHONN (2020) Measure each peak from the resting line, not from zero. Synthetic. FORMULA MVU = Σ (peak − resting) in 10 min EXAMPLE 50 + 55 + 45 + 60 = 210 MVU NOT ✗ raw peaks 65 + 70 + 60 + 75 = 270 > 200 / 10 min Adequacy convention for arrest assessment; interpret clinically — 200 is not a validated boundary 26 · G Valid IUPC only E never external toco. Also assess duration, relaxation, FHR; MVU alone does not diagnose arrest. Resting pressure: INTRAN Plus describes a typical 5–25 mmHg; > 25 mmHg → assess patient + setup with palpation and FHR. Do not raise oxytocin solely to reach a number when relaxation or FHR is concerning 26 · D Excess activity 26 · E Sources: ACOG CPG 10 Intrapartum FHR Monitoring (2025), Table 1, Box 2, pp.589–592; ACOG CPG 8 First and Second Stage Labor Management (2024), pp.149, 156; NICHD/ACOG/SMFM EFM Workshop (Macones 2008); NICE NG229 Fetal Monitoring in Labour (2022, updated 2026); NICE NG137 Twin and Triplet Pregnancy (2019); FIGO Consensus Guidelines: Cardiotocography (2015); AWHONN Back to Basics: EFM (2020); AWHONN Fetal Heart Rate Auscultation, 4th ed. (2024); AWHONN / Simpson, Cervical Ripening and Labor Induction and Augmentation (2020); HRS Expert Consensus, Arrhythmias During Pregnancy (2023); NIH Perinatal HIV Clinical Guidelines, Intrapartum Care (2025); Philips Avalon FM20–FM50 Instructions for Use (rel. L.3); GE Corometrics 250cx Operator’s Manual (2007); Rocket Medical Copeland FSE IFU (2025); Vital Signs Fetal Spiral Electrode IFU (2019); Utah Medical INTRAN Plus IFU (2020) and User Guidelines (2021); Laborie Koala IUPC Quick Reference Guide (2024); Kawakita et al., 2016; Rodriguez et al., 1989; Rinehart et al., Obstet Gynecol 2000; Rosen & Yogev, AJOG 2023. Strip vignettes are synthetic teaching examples. Device steps follow the stocked product’s IFU. Items tagged LOCAL are program policy. LOCAL program workflow / policy STOP do not 2 · B sheet · section C this sheet Open on phone Maternal capture strip: during pushing the displayed FHR switches to the maternal pulse, so pushes look like accelerations; after repositioning, ultrasound confirms the fetal rate of 145 bpm Counting artefact strips: displayed rate doubles from 100 to 200 bpm and back, and halves from 190 to 95 bpm and back, while independent ultrasound checks stay at 100 and 190 bpm FSE strip: rate recorded through the scalp electrode, about 105 bpm, matches the dashed maternal heart rate; source unresolved until ultrasound confirms fetal cardiac activity External toco strip: nearly flat for 4 minutes while contractions are felt by palpation at 1 and 3 minutes; after the toco is moved over the fundus and secured, clear waves appear at 5 and 7 minutes IUPC strip: pressure trace flat at 15 mmHg despite contractions felt at 1 and 2.5 minutes; after system and catheter position are checked, resting pressure 15 mmHg and contractions peaking at 65 and 70 mmHg Montevideo units worked example: 10-minute IUPC strip, resting pressure 15 mmHg, four contractions peaking at 65, 70, 60 and 75 mmHg, measured above rest as 50, 55, 45 and 60 mmHg, total 210 MVU QR: open this sheet in the online kit","panels":[["A","Confirm the fetal signal"],["B","Sudden half or double rate?"],["C","FSE: better acquisition, verify the source"],["D","External toco: time it, palpate it"],["E","IUPC: validate the pressure trace"],["F","Calculate MVU over 10 minutes"]]},{"f":"29-fm-response.html","n":"29-fm-response","sid":"29","g":"intrapartum","t":"Fetal monitoring: response","text":"L&D · INTRAPARTUM · FETAL HEART RATE 29Fetal monitoring: response Verified trace → bedside cause → targeted action → reassess. Definitions · Categories · resuscitation bundle 3 · A · signal, sensors, IUPC 28 SEE ALSO 3 Labor & EFM 28 FHR · signal 27 OB/GYN consult 2 Emergencies A Sudden sustained fall: act and find the cause ACOG CPG 10 (2025) Table 2, pp.593–594 · RCOG GTG 50 (2014) · GTG 63 (2011) · FIGO VBAC (2025) §§7.2–7.3 · RCOG GTG 55 (2024) · Ambia 2022 New sustained fall in FHR → bedside now. Call FM attending + OB/GYN to the bedside; notify the bedside RN. Category III, cord prolapse, suspected abruption or rupture → activate the emergency response; prepare for urgent birth while finding the cause. 3 · A 27 · A Now Resuscitate: lateral · oxytocin off · IV bolus 3 · A O₂ only for maternal hypoxemia. Record onset; compare the prior tracing. Fetal, not maternal, rate? 28 · A Mother: BP, pulse, SpO₂, pain, bleeding, tone between contractions. Vaginal exam: cord, dilation, station; bleeding → placental site known first. Prepare birth: OB/GYN, anesthesia, neonatal team, room. Do not wait for a duration label: 2 min and 10 min are definitions, not waiting periods. Category III unresolved after initial measures → expedited delivery, vaginal, operative vaginal or cesarean. No reliable FHR? Bedside ultrasound now. Lost trace ≠ demise; Doppler, CTG, FSE cannot confirm or exclude it (FSE can record maternal ECG 28 · C). No cardiac activity → experienced confirmation + second opinion; assess bleeding, abruption, sepsis. LOCAL ____ Emergency activation ____ · OB/GYN first call ____ · neonatal team ____ CONTEXT · CLUE THINK ACT NOW After ROM / amniotomy; high presenting part Cord prolapse Examine now. Cord felt → elevate the presenting part; do not replace the cord; fastest safe birth 3 · A Pain; tender or firm uterus ± bleeding Abruption Maternal resuscitation; labs, blood bank 1 · 01 Bleeding may be concealed; normal ultrasound does not exclude it. TOLAC or other uterine scar Uterine rupture Abnormal FHR is often the first sign; loss of station, pain, scar tenderness, bleeding, shock may be absent. Suspected → emergency operative delivery. Minutes after neuraxial dose / CSE Low BP · hypertonus Check BP and uterine relaxation together → B Excess or sustained contraction Tachysystole · hypertonus Oxytocin off; remove dinoprostone; uterine relaxant 26 · E Never delays emergent birth. Rapid descent, pushing Head / cord compression Station, position; fastest safe birth; modify pushing → C. Near birth ≠ benign. Seizure, hypoxemia, collapse Maternal cause Stabilize the mother first 2 · B 2 · D FHR often recovers after an eclamptic seizure; persistent → abruption? delivery? B After neuraxial: check BP and uterine activity ASA Neuraxial Statement (2021) V · ASA/SOAP (2016) · CPG 10 (2025) Table 2 · Abrão 2009 · PB 116 (2010) Before dosing BP, pulse, SpO₂; FHR by a qualified individual; IV access. Mark dose and top-up times. After first dose Direct observation ≥ 20 min; continuous maternal HR + SpO₂; BP at least q5 min, q2 min for the first 10 min when feasible. Significant provider bolus → same. FHR falls → anesthesia + FM attending at onset; sustained fall → also OB/GYN to the bedside now (A). Check together: BP vs pre-dose · pulse · SpO₂ · uterine relaxation by palpation · fetal vs maternal rate. Lateral · oxytocin off · vaginal exam when indicated 3 · A BP below pre-dose → restore placental perfusion Sympathectomy → hypotension → less placental perfusion. IV crystalloid bolus (less with preeclampsia / pulmonary-edema risk) + prompt IV vasopressor, agent chosen by anesthesia: phenylephrine or ephedrine; no maternal bradycardia → consider phenylephrine (better fetal acid–base; mainly cesarean data). Recurrent → lower basal epidural rate. BP held · uterus not relaxing → relax the uterus Rapid analgesia, especially CSE / intrathecal opioid, can bring uterine hypertonus and prolonged slowing without hypotension. Stop stimulation; palpate (toco height is not pressure 28 · D 28 · E). Rapid-acting uterine relaxant per approved order, e.g. terbutaline 0.25 mg SUBQ; expect maternal tachycardia. Can matter without > 5 contractions / 10 min. Severe decel persists → prepare birth while treating. Category III not responding → expedited delivery; do not wait for a drug to wear off. Maternal respiratory or neurologic deterioration → anesthesia emergency. Later fever → D. Eligibility, anticoagulation 20 Strips: schematic, US paper scale; recovery not guaranteed. Anesthesia ____ · fluid bolus ____ · pressor dose / repeat / max ____ · relaxant repeat limits ____ C Recurrent decelerations: target the cause ACOG CPG 10 (2025) Table 2, Box 3 · CPG 8 (2024) p.156 · Hofmeyr, Cochrane 2012 · Lemos, Cochrane 2017 Recurrent late THINK Less uteroplacental O₂ transfer: hypotension, excess contractions, low placental reserve (preeclampsia, growth restriction); abruption (A). ACT BP, contractions, bleeding. Lateral; reduce / stop oxytocin; IV bolus tailored to the mother. ESCALATE Persistent, falling variability, worse recovery → FM attending + OB/GYN bedside, delivery assessment 27 · B Absent variability + recurrent lates = Category III. Recurrent variable THINK Cord compression. Sudden severe or prolonged fall after ROM → examine for prolapse (A). ACT Reposition. Persistent → consider transcervical amnioinfusion (FM attending + unit protocol); watch tone, volume in / out 28 · E ESCALATE Longer events, slow recovery, rising baseline, falling variability → FM attending + OB/GYN bedside; never delay birth. Absent variability + recurrent variables = Category III. With pushing · second stage CHECK Fetal source: pushing can record maternal “accelerations” 28 · A Recovery, variability, descent. ACT Change position; push every other contraction; brief pause if recovery is poor. Open-glottis pushing is not a proven rescue. ESCALATE Poor recovery or worsening → operative vaginal birth now? 3 · B 27 · B A brief pause ≠ planned delayed pushing; fetal status overrides labor clocks. Amnioinfusion: eligibility, fluid, bolus / rate / maximum, stop criteria ____ D Changed baseline or variability: assess the context CPG 10 Tables 1–2, Box 3 · ACOG IAI update (2024), CO 712 · ISUOG (2022) · ASE (2023) · FIGO (2015) §4.1 · ATA (2026) · labels, trials in footer > 160 bpm Tachycardia: mother first THINK Fever / IAI, dehydration, hyperthyroidism, DKA 12 · 07 β-agonist; fetal anemia, evolving hypoxia (F), arrhythmia. Graves, even treated → fetal hyperthyroidism? ACT Temperature, pulse, BP, hydration; treat the cause. Fever → evaluate for IAI 3 · B sepsis 13 · 02 Time since epidural does not make fever noninfectious. IAI → antibiotics, antipyretic; tell neonatal team. ESCALATE New unexplained tachycardia = high-risk Category II → FM attending. Tachycardia or IAI alone does not mandate cesarean. Abrupt on / off, fixed rate often > 200 → tachyarrhythmia? Verify; fetal echo; FM attending → urgent MFM + fetal cardiology. Fixed slow rate from the start, often 50–80 → heart block? Fetal echo. A new acute fall still follows A. Minimal / absent variability: do not assume sleep THINK Sleep, drugs, prematurity, maternal dehydration / acidemia, fetal hypoxia / acidemia, prior injury. Sleep usually leaves low-normal variability; < 5 bpm is uncommon even in deep sleep. ACT Verify signal; mother, contractions; IV bolus. Scalp or vibroacoustic stimulation: an acceleration supports well-being; none does not prove acidemia. ESCALATE No sleep-cycle wait: FM attending sets review time + trigger. Absent = high-risk II; + recurrent lates / variables or bradycardia = III. DRUG: RECORD DOSE + TIME MAY SEE ASSESS · ACT (Category unchanged) Systemic opioid ↓ variability, ↓ accels Maternal breathing, sedation, SpO₂; other causes. Nalbuphine, butorphanol Sinusoidal-like; nalbuphine: severe, prolonged bradycardia New slowing or odd waveform → urgent review (A, E). Magnesium Small ↓ baseline, variability, accels Does not explain Category III or recurrent decels 2 · B Betamethasone Transient ↓ variability, accels; often days 2–3 Note timing; new decels need their own work-up. Cocaine, methamphetamine No diagnostic pattern BP, bleeding, uterine pain / tone → abruption? E Smooth cycling: sinusoidal or a mimic? NICHD (2008) · CPG 10 Table 1, p.594 · FIGO (2015) §4.1 · SMFM CG 8, Consult 75 · Oyelese 2023 Suspected true sinusoidal → FM attending + OB/GYN to the bedside; assess bleeding, anemia; prepare delivery; alert neonatal team 27 · A Now True · Category III Smooth, regular, 3–5 cycles/min, ≥ 20 min; no normal variability or accels. Think fetal anemia: fetomaternal hemorrhage, alloimmunization, ruptured vasa previa; also severe hypoxia. ACOG: > 30 min → no resuscitative benefit → expeditious operative delivery. Neither time is a wait. Pseudo · possible Jagged, irregular, usually transient; normal before and after; opioids, fetal sucking. Drug, jaggedness or brevity alone does not reassure; unsure → urgent review. ROM + bleeding + bradycardia or sinusoidal → ruptured vasa previa: immediate cesarean, neonatal transfusion ready 1 · 01 Suspected FMH → maternal Kleihauer–Betke / flow cytometry, any Rh type (RhIG 1 · 14). Results never delay birth. FMH test + turnaround ____ · emergency neonatal blood ____ F Reassess response; agree who owns care ACOG CPG 10 (2025) pp.592–594, Box 3, Fig. 1 · Descourvieres 2022 · AHRQ EFM tool (2023) · AWHONN (2024) Dashed: first baseline. One possible course; order and timing vary, decels often come first. At every review compare with the earlier tracing: baseline vs this fetus’s own level, accels, decel length / frequency, variability, recovery. Category II: name the findings and their direction: protective (moderate variability, accels) + high-risk features + trend + response. Moderate variability does not cancel recurrent lates. No ACOG time limit for Category II: individualize by features, progress, nearness to birth. S room, urgency, Category, what changed, when · B GA, parity, cervix / station, risks, ROM, oxytocin, neuraxial timing, vitals · A B-V-A-D-T, signal confidence, trend, actions + response · R bedside review / delivery assessment; who comes, next review, trigger, owner; read back. Record: time · verified source · B-V-A-D-T + Category · comparison · cause · actions + times · response · who was called · next review + trigger · birth decision, urgency, route. Handoff 27 · F Review frequency ____ · chain of command ____ · FM attending ____ · backup after ____ min Sources: ACOG CPG 10 Intrapartum FHR Monitoring (2025); NICHD Workshop, Macones 2008; ACOG CPG 8 Labor Management (2024); ACOG PB 116 (2010; terbutaline dose); RCOG Green-top 50 Cord Prolapse (2014), 63 Antepartum Haemorrhage (2011), 55 Late IUFD (2024); FIGO VBAC (2025); FIGO CTG consensus (2015); ASA Neuraxial Statement (2021); ASA/SOAP Obstetric Anesthesia Guidelines (2016); Abrão, Obstet Gynecol 2009; Ambia, AJOG 2022; Cochrane (Hofmeyr 2012, Lemos 2017, Murphy 2023); ACOG IAI update (2024), CO 712; ISUOG VISUOG Fetal Tachycardia (2022); ASE Fetal Echo (2023); ATA Thyroid in Pregnancy (2026); NUBAIN label (2025); butorphanol label (2026); terbutaline PI (2022); Hallak 1999, Nensi 2014; Subtil 2003, Rotmensch 1999; Chazotte 1991, Hayer 2024; Rogers, Anesthesiology 2025; SMFM CG 8 (2015, reaff. 2025); SMFM Consult 75 (2026); Oyelese, Obstet Gynecol 2023; Descourvieres, AOGS 2022; AHRQ EFM (2023); AWHONN (2024). Strips: synthetic, US paper scale; values illustrative. LOCAL = program policy. LOCAL program workflow / policy 2 · B sheet · section Open on phone Ten-minute strip: neuraxial dose at 2 minutes, maternal BP falls from 120/75 to 80/45, FHR falls from 140 to about 80 bpm for about 3 minutes and recovers as BP is restored; contractions normal with relaxation between Ten-minute strip: combined spinal-epidural dose at 2 minutes, maternal BP stays near 120/75, IUPC shows a sustained contraction at about 60 mmHg from 2.25 to 4.75 minutes, and FHR falls to about 80 bpm for about 3 minutes, recovering as the uterus relaxes Two 3-minute strips. Left: true sinusoidal, a smooth regular sine wave around 140 bpm at 4 cycles per minute without irregular variability. Right: possible pseudo-sinusoidal, jagged irregular cycles with normal variability before and after Three 3-minute excerpts from one labor at 0, 25 and 55 minutes: baseline rises from 135 to 150 to 165 bpm, an acceleration and moderate variability give way to recurrent late decelerations and then minimal variability with longer lates; a dashed line marks the first baseline QR: open this sheet in the online kit","panels":[["A","Sudden sustained fall: act and find the cause"],["B","After neuraxial: check BP and uterine activity"],["C","Recurrent decelerations: target the cause"],["D","Changed baseline or variability: assess the context"],["E","Smooth cycling: sinusoidal or a mimic?"],["F","Reassess response; agree who owns care"]]}];const g=document.getElementById('g'),q=document.getElementById('q');
