mes, renal impairment, recurrence on treatment. For q12h dosing, check the peak 4 h after a dose; target 0.6–1.0 units/mL. Duration Continue until both are met: ≥ 3 mo total treatment AND ≥ 6 wk postpartum. STOP In pregnancy: no warfarin, no DOACs (AHA/ACC 2026: Harm). IV UFH nomogram: ____ · enoxaparin syringe rounding: ____ · anticoag pharmacy / hematology: ____ 06 Delivery & neuraxial ASH 2018 rec 10 · ACOG PB 196 · SOAP 2018 Schedule delivery, anticoagulant held first; antenatal anesthesia consult; MFM + hematology. Labor, ROM or bleeding → hold the next dose; note last dose time; call FM attending + anesthesia (SOAP). Optional (protocol): UFH before delivery, timed to likely labor; or stop and induce within 24 h (PB 196). DRUG STOP BEFORE INDUCTION, CESAREAN OR NEURAXIAL RESTART — AFTER HEMOSTASIS AND ANESTHESIA REVIEW Therapeutic LMWH ≥ 24 h CrCl < 30 (q24h dosing): ≥ 48 h Meet all: ≥ 24 h after neuraxial puncture and ≥ 4 h after catheter removal and ≥ 24 h after surgery (48–72 h if high bleeding risk) IV UFH 4–6 h + normal aPTT Meet both: ≥ 1 h after puncture and ≥ 1 h after catheter removal Individualize with anesthesia/hematology 6 · E 20 · 02 Acute VTE near term: IV UFH (stop 4–6 h before birth) + hematology; IVC filter only if anticoagulation impossible. 07 Postpartum & breastfeeding ASH 2018 recs 12–13 · LactMed (NLM, 2026) · ACCP 2012 Compatible: LMWH, UFH, fondaparinux, warfarin (INR 2–3; overlap parenteral ≥ 5 d + INR ≥ 2 for 24 h). DOACs: avoid while breastfeeding (ASH strong rec). LactMed: apixaban milk levels high; rivaroxaban, dabigatran low, data limited. Not breastfeeding → DOAC OK. Contraception: progestin-only or nonhormonal; CHC is MEC 3 on therapeutic anticoagulation for acute VTE (MEC 4 early postpartum) 6 · C 08 Not PE? Think of SMFM AFE checklist 2026 · ESC HFA PPCM 2010 · AHA SCAD statement 2018 PPCM Late pregnancy to months postpartum; orthopnea, edema; BNP, echo: LVEF < 45%. ACS / SCAD Chest pain: ECG, troponin; SCAD is the leading cause of pregnancy-associated MI, mostly postpartum. AFE Sudden hypoxia + hypotension or arrest, ± DIC, in labor or ≤ 30 min after placenta → code 2 · D Workup ECG, troponin, BNP or NT-proBNP, CXR, SpO₂ / ABG, echo if hypoxic, hypotensive or RV strain suspected. Others Pneumonia or aspiration, pulmonary edema of preeclampsia 2 · B, sepsis 13 · 01, asthma, anemia. Sources: Creager MA et al., 2026 AHA/ACC/ACCP/ACEP/CHEST/SCAI/SHM/SIR/SVM/SVN Guideline for the Evaluation and Management of Acute Pulmonary Embolism in Adults, Circulation 2026;153(12):e977–e1051 (doi 10.1161/CIR.0000000000001415; JACC doi 10.1016/j.jacc.2025.11.005); van der Pol LM et al., Pregnancy-adapted YEARS algorithm (Artemis), N Engl J Med 2019;380:1139–49; Righini M et al., Diagnosis of PE during pregnancy (CT-PE-Pregnancy), Ann Intern Med 2018;169:766–73; Le Gal G et al., revised Geneva score, Ann Intern Med 2006; Bates SM et al., ASH 2018 guidelines: VTE in the context of pregnancy, Blood Adv 2018;2(22):3317–59; ACOG Practice Bulletin 196, Thromboembolism in Pregnancy (2018, reaff. 2025); ACOG CO 723, Imaging during pregnancy and lactation; RCOG GTG 37b (2015) §6.1; Douketis JD et al., ACCP perioperative, Chest 2012 (rec 4.4); Bates SM et al., ACCP 9th ed., Chest 2012;141(2 Suppl):e691S–736S; Chan WS et al., CMAJ 2013;185:E194–200; Le Gal G et al., BMJ 2012;344:e2635; Leffert L et al., SOAP consensus on neuraxial procedures in obstetric patients on anticoagulants, Anesth Analg 2018; SMFM Consult #9, Amniotic fluid embolism (2016); Martinez-King LC et al., SMFM checklist for initial management of amniotic fluid embolism, updated 2026, Pregnancy 2026;2(5):e70364; Sliwa K et al., ESC HFA PPCM position statement, Eur J Heart Fail 2010; Hayes SN et al., AHA SCAD scientific statement, Circulation 2018; FDA labels (Lovenox, Activase); NLM LactMed 2026 (apixaban, rivaroxaban, dabigatran, warfarin, enoxaparin, heparin). Items tagged LOCAL are program policy. LOCAL program workflow / policy UPDATED new or changed guidance STOP do not 2 · B sheet · section Open on phone QR: open this sheet in the online kit","panels":[["01","Unstable? No D-dimer/scores"],["02","Stable, pregnant: YEARS"],["03","Leg: compression ultrasound"],["04","Chest imaging"],["05","Treat"],["06","Delivery & neuraxial"],["07","Postpartum & breastfeeding"],["08","Not PE? Think of"]]},{"f":"17-syphilis-newborn.html","n":"17-syphilis-newborn","sid":"17","g":"reference","t":"Maternal syphilis → newborn","text":"NURSERY · L&D · DESK CARD 17 · FRONT 17 FRONT Maternal syphilis → newborn Start: delivery titers, infant exam, maternal treatment history 17 · 01, then the scenario. Mother reactive in pregnancy and at delivery; neonates < 30 d. Maternal staging 8 · B SEE ALSO 8 Infections 5 Newborn 18 Nursery card 01 START HERESend at birth CDC STI Guidelines 2021 · Congenital syphilis · collect these before choosing a scenario in 02 MOTHER Quantitative RPR or VDRL at delivery — same test as the infant’s, ideally same lab. No mother or baby leaves without maternal serology documented in pregnancy. INFANT Quantitative nontreponemal test on infant serum. Not cord blood: maternal blood can give a false positive; Wharton’s jelly, a false negative. No treponemal test on the infant (maternal IgG persists > 15 mo) · no IgM tests. HIV test for every at-risk neonate. EXAM · PATHOLOGY Exam: hydrops · direct hyperbilirubinemia (direct > 2 mg/dL or > 20% of total) or cholestasis · hepatosplenomegaly · rhinitis · rash · pseudoparalysis of a limb. Placenta / cord to pathology: T. pallidum IHC (not silver stain) or CLIA-validated PCR. Lesion or nasal discharge: darkfield or PCR. Stillbirth: skeletal survey. 02 Four scenarios CDC 2021 Scenarios 1–4 · infant RPR/VDRL titer vs mother’s at delivery, same test · fourfold = 2 dilutions; 1 dilution is test variability; infant titer < 4× mother’s: congenital syphilis is still possible 1 Proven or highly probable maternal treatment doesn’t matter 2 Possible mother not adequately treated 3 Less likely adequate treatment in pregnancy 4 Unlikely adequate treatment before pregnancy Infant Any one: exam consistent with congenital syphilis · infant titer ≥ 4× mother’s (1:2 → ≥ 1:8; 1:8 → ≥ 1:32) · positive lesion / nasal darkfield, tissue IHC or CLIA‑validated PCR Normal exam and infant titer < 4× mother’s (e.g., mother 1:8 → infant ≤ 1:16) — then classify by the mother ↓ Exception · don’t wait: maternal rapid treponemal + at delivery, late or no prenatal care → send maternal lab RPR + treponemal test, but evaluate and treat 10 d as Scenario 1; specialist consult. Other maternal discordant patterns 17b · 01 Mother Treat the infant regardless of maternal treatment history Any one: No, inadequate or undocumented treatment Erythromycin or any non-penicillin G regimen (= untreated) Correct regimen started < 30 d before delivery Reinfection / relapse concern (maternal titer ≥ 4× rise) or partner recently diagnosed Both: Treated in pregnancy, regimen right for stage, started ≥ 30 d before delivery No evidence of reinfection or relapse Both: Adequately treated before pregnancy Titer low and stable (serofast) before, during and at delivery: VDRL ≤ 1:2 or RPR ≤ 1:4 Evaluate CSF VDRL, cells, protein · CBC, diff, platelets · long-bone films · as indicated: CXR, LFTs, neuroimaging, eye exam, ABR CSF VDRL, cells, protein · CBC, diff, platelets · long-bone films. Evaluation optional with 10-d treatment; LP still useful. CSF needs a clean tap; neonatal reference values 17b · 04 No evaluation Treat 10 d aqueous penicillin G IV or procaine IM if obtainable 17 · 03 10 d IV or IM 17 · 03 OR Benzathine × 1 only if CSF, CBC and films all normal and follow-up certain 10 d if: any part of the evaluation abnormal or not done · bloody CSF · follow-up uncertain Infant RPR/VDRL nonreactive and maternal risk of untreated syphilis low → benzathine × 1 without evaluation may be considered. Untreated early maternal syphilis → consider 10 d even if all normal. Benzathine penicillin G 50,000 units/kg IM × 1 OR No treatment only if BOTH apply: 1 Follow-up certain: infant titers q2–3 mo × 6 mo AND 2 Maternal titer either fell ≥ 4× after early-syphilis treatment OR stayed low (VDRL < 1:2, RPR < 1:4) in latent syphilis None required Follow titers to nonreactive. Benzathine × 1 may be considered if the infant’s RPR/VDRL is reactive and follow-up uncertain. 03 Penicillin G regimens CDC 2021 · per kg, < 30 d · allergy, shortage, peds ID 17b · 03 Aqueous crystalline penicillin G preferred · 10 d 50,000 units/kg IV q12h through day 7 of life, then q8h to complete 10 d — interval by age, not day of therapy Procaine penicillin G discontinued in US 50,000 units/kg IM once daily × 10 d Benzathine penicillin G Bicillin L‑A · never C‑R 50,000 units/kg IM × 1 IM only — never IV Weight (kg) 2.5 3 3.5 4 Units / dose 125,000 150,000 175,000 200,000 1‑mL Bicillin L‑A syringe = 600,000 units = 4× a 3‑kg dose — pharmacy prepares the weight‑based dose. ≥ 24 h of therapy missed → restart the course. Ampicillin for sepsis doesn’t count. 04 Follow-up titers CDC 2021 · every titer here is RPR / VDRL, same test Infant reactive q2–3 mo: exam + titer until nonreactive Not treated (S3, S4) Falling by 3 mo, nonreactive by 6 mo = passive antibody. Still reactive at 6 mo → likely infected: treat Treated 6–12 mo: still reactive → CSF evaluation, expert consult; may need a 2nd 10-d course Abnormal first CSF 6–12 mo: titers persist after penicillin G → repeat LP. Nonpenicillin regimen: repeat CSF (peds ID). Infant nonreactive, mother reactive 3 mo: repeat infant RPR/VDRL (incubating infection) Never follow with treponemal tests. Hand-off: scenario, treatment, titer dates. Sources: Workowski KA et al. CDC STI Treatment Guidelines 2021, MMWR Recomm Rep 2021;70(RR-4) — Congenital Syphilis (scenarios, reverse-sequence situations, follow-up, special considerations) and Syphilis During Pregnancy; AAP Congenital Syphilis Evaluation and Treatment Guide (2025; ≥ 24 h rule) and Red Book 2024 Fig 3.18 (reinfection / partner); Papp JR et al. MMWR Recomm Rep 2024;73(RR-1) (placenta / cord IHC); Bicillin L-A label (DailyMed 2026); MedlinePlus, penicillin G procaine (2026). Maternal regimens: 8 · B. LOCAL = program policy. LOCAL program workflow / policy UPDATED new or changed guidance STOP do not 2 · B sheet · section Turn over ↻ 17b back · maternal discordant results · maternal serology · allergy · shortage · peds ID · titer and CSF values QR: open this sheet in the online kit","panels":[["01","Start hereSend at birth"],["02","Four scenarios"],["03","Penicillin G regimens"],["04","Follow-up titers"]]},{"f":"17b-syphilis-back.html","n":"17b-syphilis-back","sid":"17b","g":"reference","t":"Syphilis serology patterns","text":"NURSERY · L&D · DESK CARD 17 · BACK 17b BACK Syphilis serology patterns Maternal reverse-sequence (treponemal-first) and discordant results at delivery, titer and CSF pitfalls, penicillin allergy and shortage. Send at birth and four scenarios on the front 17 · 01 17 · 02. Maternal staging and treatment 8 · B SEE ALSO 8 Infections 5 Newborn 18 Nursery card 01 Maternal discordant results → newborn action CDC 2021 · reverse-sequence screening situations · results below are the mother’s Rapid treponemal + at delivery late or no prenatal care Don’t wait: evaluate and treat the infant 10 d as Scenario 1 17 · 02 Send maternal lab RPR and treponemal test; specialist consult. Treponemal +, RPR − after documented adequate treatment, and no reinfection / relapse Maternal RPR still nonreactive at delivery, infant exam normal and infant RPR nonreactive → manage the infant as Scenario 4: no evaluation or treatment. Benzathine × 1 if exposure possible within 1 mo of delivery and follow-up uncertain. Isolated treponemal + e.g., EIA +, RPR −, TP-PA − Usually false positive. Normal infant, low maternal risk → no evaluation, no treatment. Exposure possible → repeat maternal serology within 4 wk. Treponemal tests on the infant are uninterpretable (maternal IgG crosses the placenta). Infant decisions use quantitative RPR/VDRL on infant serum, never cord blood. 03 Penicillin allergy · shortage · peds ID CDC 2021 congenital syphilis · special considerations Penicillin allergy Desensitize, then penicillin G. No neonatal skin testing. Shortage Scenario 1 Check penicillin G supplies; notify CDC/FDA. IV penicillin G short → pharmacy + peds ID now; procaine only if obtainable (discontinued in US). Neither → ceftriaxone 50–75 mg/kg IV q24h over 60 min; expert sets duration and close follow-up. Contraindicated: hyperbilirubinemia · prematurity through 41 wk postmenstrual age · ≤ 28 d old and needing, or expected to need, IV calcium (incl. parenteral nutrition). Shortage Scenarios 2–3 Procaine × 10 d or benzathine × 1: apply the scenario’s single-dose criteria 17 · 02 (abnormal or incomplete evaluation → 10 d: procaine if obtainable, else as Scenario 1). Single-dose ceftriaxone is inadequate. Call peds ID Any non-penicillin agent · maternal rapid treponemal + at delivery · persistent titers or abnormal CSF at 6–12 mo · desensitization. Peds ID: ____ Health-department report: ____ Procaine / benzathine penicillin G in pharmacy: ____ Our lab screens: traditional / reverse sequence ____ 2nd treponemal test: ____ RPR titer turnaround: ____ 02 Reading maternal results CDC 2021 · syphilis serologic testing MOTHER’S TESTS RPR / VDRL TREPONEMAL 2ND TREPONEMAL USUAL MEANING → ACTION + + Current or past syphilis. Stage, check treatment history and titer trend 8 · B Newborn: send at birth 17 · 01, then scenario 17 · 02 − + + Past treated syphilis, or untreated latent. Treatment undocumented → determine the maternal stage. Stage unknown → treat the mother as late latent. − + − Likely false-positive screen. Low risk, asymptomatic, uninfected partner and reliable follow-up → consider repeat serology within 4 wk; RPR and TP-PA stay negative → no treatment. Follow-up unlikely and no documented prior treatment → treat by stage. + − Biologic false-positive nontreponemal (pregnancy, autoimmune disease, HIV, injection drug use). Repeat treponemal if exposure recent. 04 Titer and CSF pitfalls CDC 2021 TWO SEPARATE EXAMPLES · EACH INFANT TITER COMPARED WITH THE SAME MATERNAL TITER Mother 1:8 at delivery · the baseline Infant 1:16 example A 1 dilution · 2× · test variability Infant 1:32 example B 2 dilutions · 4× · meets the Scenario 1 titer criterion Fourfold = 2 dilutions (1:4 → 1:16), same test. One dilution is test variability. RPR and VDRL titers aren’t interchangeable: compare mother and infant on the same test, ideally same lab. Neonatal CSF needs a clean tap; values vary with gestational age (higher if preterm). 95% of healthy neonates: WBC ≤ 16–19/mm³; protein ≤ 115–118 mg/dL. Scenario 2 single dose needs CSF VDRL, cells and protein all normal. Treponemal tests stay positive for life in most treated adults; never use them to judge response. Very high titers (secondary syphilis) can read falsely negative (prozone): ask the lab to dilute. Sources: Workowski KA et al. CDC Sexually Transmitted Infections Treatment Guidelines, 2021, MMWR Recomm Rep 2021;70(RR-4) — Syphilis (Diagnostic Considerations), Syphilis During Pregnancy, Congenital Syphilis (reverse-sequence screening situations; CSF values; Special Considerations — penicillin allergy, shortages); Papp JR et al. CDC laboratory recommendations for syphilis testing, United States, 2024, MMWR Recomm Rep 2024;73(RR-1); ceftriaxone prescribing information (DailyMed 2026: neonatal contraindications, 60‑min infusion); MedlinePlus, penicillin G procaine (2026: discontinued in US). Back of card 17. LOCAL program workflow / policy 2 · B sheet · section Turn over ↻ 17 front · send at birth · four scenarios · regimens · follow-up titers QR: open this sheet in the online kit","panels":[["01","Maternal discordant results → newborn action"],["03","Penicillin allergy · shortage · peds ID"],["02","Reading maternal results"],["04","Titer and CSF pitfalls"]]},{"f":"18-nursery.html","n":"18-nursery","sid":"18","g":"reference","t":"Nursery card","text":"WELL-BABY NURSERY · DESK CARD 18 18Nursery card Term well newborn: birth medications, hepatitis B by maternal status and weight, normal vitals, IV glucose and D10W pump rates, screens, circumcision, newborn discharge. Resuscitation and thresholds 5 · A 5 · B SEE ALSO 5 Newborn 15 Sick newborn 22 Hearing · cCMV 25 Dyad → home 01 Birth medications AAP vitamin K 2022 · CDC STI Guidelines 2021 · USPSTF 2019 Vitamin K (phytonadione) > 1,500 g: 1 mg IM within 6 h (0.5 mL of 1 mg/0.5 mL) ≤ 1,500 g: 0.3–0.5 mg/kg IM once. Not IV for prophylaxis. Read the label: methylergonovine look-alike. Eye prophylaxis Erythromycin 0.5% ointment, both eyes, once, as soon as possible after birth (vaginal or cesarean); ≤ 24 h. Does not prevent chlamydial conjunctivitis. RSV antibody Dose and maternal-vaccine rule 5 · E Vitamin K refused: document; oral regimens protect less against late vitamin K deficiency bleeding (VKDB). Any bleeding < 6 mo → think VKDB. 02 Hepatitis B at birth ACIP 2018 Table 3 · AAP 2017 birth-dose statement · matches 5 · E Positive includes other evidence of maternal HBV. HBIG: hepatitis B immune globulin. MOTHER HBsAg ≥ 2,000 g < 2,000 g Positive Vaccine + HBIG ≤ 12 h Separate limbs Vaccine + HBIG ≤ 12 h Birth dose doesn’t count: 3 more doses (4 total) from 1 mo Unknown test mother now Vaccine ≤ 12 h HBIG by discharge or age 7 d (whichever first) if mother positive or still unknown Vaccine + HBIG ≤ 12 h Unless mother confirmed negative ≤ 12 h. Birth dose doesn’t count Negative Vaccine ≤ 24 h Medically stable 1st dose at 1 mo or discharge Whichever first Doses: single-antigen vaccine 0.5 mL IM · HBIG 0.5 mL IM. Maternal HBsAg positive or still unknown → infant anti-HBs + HBsAg at 9–12 mo (delayed series: 1–2 mo after the last dose). Breastfeeding is fine. Guidance status · verify at print ACIP Dec 2025 change stayed by federal court 16 Mar 2026; appeal pending. Current CDC guidance and AAP: universal birth dose. 03 Normal vitals, term AAP COFN, Hospital stay for healthy term newborns (2015) · WHO 1997 HEART RATE · AWAKE 100–190 /min Asleep down to 70 if perfused, rouses with activity. Sustained near / above 190 → evaluate. RESPIRATORY RATE < 60 /min No grunting, flaring or retractions. AXILLARY TEMP 36.5–37.4 °C 97.7–99.3 °F, open crib, dressed. WHO: 36.0–36.4 = cold stress. Stable for 12 h before discharge. Exam red flags / sick after transition 15 · A · breathing 15 · B · call NICU 23 · A Weight loss and NEWT 10 · 02 · voids and stools by day 10 · 03 06 Circumcision AAP technical report 2012 (expired 2017, not replaced) · AAP 2015 Defer Unstable or ill · significantly preterm · hypospadias, chordee, buried penis, penoscrotal webbing · blood dyscrasia or family history of bleeding disorder. Confirm vitamin K given. DPNB Dorsal penile nerve block: 1% (10 mg/mL) lidocaine, no epinephrine, 0.4 mL each side at the base (10 and 2 o’clock) = 8 mg total (2.7 mg/kg at 3 kg; 3.2 at 2.5 kg) → check the unit max Ring block 1% lidocaine, no epinephrine, 0.8 mL at the base or midshaft; may be most effective (AAP). Instead of DPNB, not added Adjuncts Sucrose pacifier, swaddle, positioning — never the only analgesia. Topical 4% lidocaine is an option, not in low-birth-weight infants (skin irritation). After No excessive bleeding for ≥ 2 h before discharge. Unit lidocaine max (mg/kg): ____ · sucrose dose: ____ · device / consent: ____ 04 IV glucose · D10W pump rates AAP 2011 (expired, under review) · thresholds, gel 5 · B Lab Send lab plasma glucose; treat without waiting for it IV bolus D10W 2 mL/kg (200 mg/kg) IV IV infusion then D10W at 80–100 mL/kg/day = glucose infusion rate (GIR) 5.6–6.9 mg/kg/min IV target: > 60 mg/dL; persistent disorder > 70 (PES) GIR (mg/kg/min) = % dextrose × mL/kg/day ÷ 144 = % × mL/kg/h ÷ 6 · D10 at 80 mL/kg/day: 10 × 80 ÷ 144 = 5.6 D10W rate → GIR (mg/kg/min) mL/kg/day 60 80 100 120 mL/kg/h 2.5 3.3 4.2 5 GIR 4.2 5.6 6.9 8.3 D10W by weight · infusion at 80 or 100 mL/kg/day Weight (kg) Bolus (mL) Infusion (mL/h) at 80 at 100 2.5 5 8.3 10.4 3 6 10 12.5 3.5 7 11.7 14.6 4 8 13.3 16.7 Can’t keep > 45 mg/dL after 24 h at this GIR → suspect a persistent disorder: endocrinology / NICU; critical sample while lab glucose < 50 (glucose, β-hydroxybutyrate, free fatty acids, insulin) without delaying rescue. Discharge: off IV, normal glucose through ≥ 3 feed–fast cycles on routine feeds; after symptomatic or IV-treated lows, exclude a persistent disorder (consider a 6–8 h safety fast). Bolus push time: ____ recheck after bolus: ____ min max peripheral dextrose: ____% call NICU when: ____ 23 · B 40% gel protocol and repeat limit: ____ 05 Screens & labs before discharge AAP 2015 · ACHDNC timeliness · JCIH 2019 Maternal labs Syphilis 17 · 01 · HBsAg · HIV reviewed; infant blood type and DAT if indicated CCHD ≥ 24 h · early discharge: as late as possible 5 · D Metabolic Blood spot 24–48 h, before transfusion; drawn < 24 h of age or milk feeds → state repeat rule ____ Bilirubin TcB / TSB at 24–48 h or before discharge 5 · C Hearing Refer either ear → rescreen both + cCMV test today 22 · A 07 Newborn discharge checklist AAP COFN 2015 · term 37w0d–41w6d, uncomplicated CLINICAL READINESS complete dyad discharge 25 · A Exam and course need no further stay Vitals normal and stable for 12 h → 03 Vitals Voiding regularly · ≥ 1 spontaneous stool ≥ 2 successful feeds; a breastfeed observed and documented Circumcision: no excessive bleeding ≥ 2 h → 06 REVIEW AND SCREENS hearing + pending CMV owner 22 · H Jaundice assessed with a plan 5 · C EOS risk assessed per guideline 4 · EOS Maternal syphilis, HBsAg, HIV reviewed → 05 Hepatitis B vaccine per risk → 02 Hepatitis B Metabolic, hearing, pulse-ox screens done → 05 Screens HOME PLAN appointments / pending results 25 · H Car seat; caregiver education: feeding, jaundice, safe sleep Medical home; social risks assessed Substance exposure: observe, family plan 24 · F 24 · J Discharged at < 48 h of age → seen ≤ 48 h after discharge Sources: Hand I et al., AAP Vitamin K and the Newborn Infant, Pediatrics 2022;149:e2021056036; CDC STI Treatment Guidelines 2021, MMWR 70(RR-4), ophthalmia neonatorum prophylaxis; USPSTF ocular prophylaxis 2019; Schillie S et al., ACIP Prevention of Hepatitis B Virus Infection in the United States, MMWR Recomm Rep 2018;67(RR-1), Table 3; AAP COID/COFN, Elimination of Perinatal Hepatitis B, Pediatrics 2017;140:e20171870; Benitz WE, AAP COFN, Hospital Stay for Healthy Term Newborn Infants, Pediatrics 2015;135:948–53; WHO Thermal Protection of the Newborn (1997); Adamkin DH, AAP COFN, Postnatal Glucose Homeostasis, Pediatrics 2011;127:575; Thornton PS et al., PES, J Pediatr 2015;167:238; CDC PVST guidance; AAP cCMV report 2026 (KAS 2); ACHDNC newborn-screening timeliness goals and CLSI NBS01; JCIH Year 2019 Position Statement; AAP Task Force on Circumcision, Male Circumcision technical report, Pediatrics 2012;130:e756. GIR rows are arithmetic. Items tagged LOCAL are program policy. LOCAL program workflow / policy UPDATED new or changed guidance STOP do not 2 · B sheet · section QR: open this sheet in the online kit","panels":[["01","Birth medications"],["02","Hepatitis B at birth"],["03","Normal vitals, term"],["06","Circumcision"],["04","IV glucose · D10W pump rates"],["05","Screens & labs before discharge"],["07","Newborn discharge checklist"]]},{"f":"19-med-card.html","n":"19-med-card","sid":"19","g":"reference","t":"Medication companion","text":"BY THE COMPUTERS · ADULT DOSES 19Medication companion Where each L&D antibiotic dose lives, and its interval · renal adjustments · lactation exceptions · analgesic maximums · oral iron. SEE ALSO 8 Infections 13 Sepsis 6 Postpartum 12 Diabetes 01 L&D antimicrobial index As on the sheet named · CO 712 · PB 199 · ASHP Dose by the indication row: ampicillin, cefazolin and gentamicin have different intervals. Gentamicin: one schedule (q24h or q8h), never both; dose as on its row. Levels, renal dosing: pharmacy. INDICATION DRUG (IV unless noted) DOSE INTERVAL GO TO Sepsis give ≤ 1 h Piperacillin-tazobactam 4.5 g q6h 13 · 03 or meropenem 1 g q8h + vancomycin load 25–30 mg/kg (actual weight; max 3 g) → pharmacy GBS IAP Penicillin G 5 million units, then 2.5–3 million units q4h 1 · 08 or ampicillin 2 g, then 1 g q4h GBS, PCN allergy Low risk: cefazolin 2 g, then 1 g q8h 1 · 08 High risk: clindamycin 900 mg (if susceptible) q8h or vancomycin 20 mg/kg (max 2 g) q8h Intraamniotic infection Diagnosed on IAP → switch to this regimen; don’t run both Ampicillin 2 g q6h 3 · B Mild allergy: cefazolin 2 g q8h Severe allergy: clindamycin 900 mg q8h or vancomycin 1 g q12h GBS+ with clindamycin resistance or unknown susceptibility → vancomycin + Gentamicin, every option 5 mg/kg q24h or gentamicin 2 mg/kg, then 1.5 mg/kg q8h After cesarean: +1 regimen dose, and add clindamycin 900 mg or metroNIDAZOLE 500 mg for ≥ 1 dose Cesarean prophylaxis Redose timed from the first dose Cefazolin 2 g ≤ 60 min before incision Redose 4 h or QBL > 1.5 L Here Labor or ROM: + azithromycin 500 mg over 1 h Once Severe PCN allergy: clindamycin + gentamicin 900 mg + 5 mg/kg gentamicin: once only Clinda 6 h or QBL > 1.5 L Endometritis Clindamycin 900 mg q8h 8 · E + gentamicin 5 mg/kg q24h or gentamicin 1.5 mg/kg q8h + ampicillin if no response 48–72 h Pyelonephritis 14 d total Ceftriaxone 1 g q24h 8 · A or cefepime 1 g q12h or ampicillin + gentamicin 2 g + 5 mg/kg q6h + q24h or aztreonam; consult ID 1 g q8–12h Syphilis Benzathine penicillin G 2.4 million units IM Early: once 8 · B Late or unknown duration: weekly × 3, 7 d apart; > 9 d between doses → restart Influenza Oseltamivir · pregnant or ≤ 2 wk postpartum 75 mg PO BID × 5 d 8 · F Mastitis, bacterial Dicloxacillin or cephalexin 500 mg PO QID × 10–14 d 6 · F Cesarean cefazolin for ≥ 120 kg (2 g vs 3 g): ____ · gentamicin dosing weight: ____ · pharmacy: ____ 02 Renal dose adjustments FDA labels · FDA metformin DSC 2016 · CDC 2026 CrCl (Cockcroft-Gault, female) = (140 − age) × kg ÷ (72 × Cr) × 0.85. Labels use CrCl, metFORMIN eGFR; both unreliable in pregnancy, AKI, preeclampsia. DRUG THRESHOLD ADJUST Enalapril postpartum only CrCl ≤ 30 Start 2.5 mg daily 11 · 03 Dialysis 2.5 mg on dialysis days; other days by BP Enoxaparin CrCl < 30 Neuraxial: double the hold interval 20 · 02 Treatment 1 mg/kg SUBQ q24h Prophylaxis 30 mg SUBQ daily Gentamicin · vancomycin Any Pharmacy dosing (also cefepime, acyclovir) Ketorolac Renal impair. 15 mg IV q6h, max 60 mg/day; advanced disease or hypovolemia → avoid Magnesium Cr · UOP Renal rules 2 · B metFORMIN (eGFR) eGFR < 30 Contraindicated — stop eGFR 30–45 Don’t start; on it → reassess. Iodinated contrast Hold if eGFR 30–60, liver disease, alcoholism, heart failure, or intra-arterial contrast. eGFR at 48 h → restart if stable 12 · 05 Nitrofurantoin CrCl < 60 Contraindicated (label) Oseltamivir CrCl 31–60 Treatment 30 mg BID × 5 d Prophylaxis 30 mg daily CrCl 11–30 Treatment 30 mg daily × 5 d Prophylaxis 30 mg every other day HD treatment 30 mg now, then after each session (≤ 5 d) HD prophylaxis 30 mg now, then after every 2nd session 03 Lactation exceptions NLM LactMed · FDA DSC 2017 · ACR 2024 Codeine · traMADol Avoid — FDA recommends against use while breastfeeding Nitrofurantoin Another drug if infant < 8 d (label: < 1 mo) or G6PD-deficient TMP-SMX Avoid if infant jaundiced, ill, stressed, preterm or G6PD-deficient; healthy term infant > 1 mo: OK Doxycycline Short courses OK; avoid > 21 d or repeat courses metroNIDAZOLE Usual doses OK. Single 2 g dose: some advise a 12–24 h pause — ask lactation / pharmacy Sertraline First‑line SSRI, as is escitalopram 6 · D MOUD · THC Feeding decision by substance 24 · E Contrast Iodinated, gadolinium: no interruption needed 04 Postpartum analgesic maximums FDA labels · ACOG CC 1 (2021) · LactMed Acetaminophen Max 4 g/day from all products 1 g PO/IV q6h. IV, < 50 kg: 15 mg/kg, max 75 mg/kg/day Ibuprofen Max 3,200 mg/day 600 mg q6h or 800 mg q8h. Preferred in lactation. Ketorolac Max 120 mg/day IV, 40 mg/day PO · ≤ 5 d total 30 mg IV q6h after hemostasis; no other NSAID ≥ 65 y, < 50 kg or renal impairment: 15 mg IV q6h, max 60 mg/day Breastfeeding: another NSAID after 24–72 h oxyCODONE or HYDROcodone Max 30 mg/day IR × 2–3 d in lactation Infant sleepy or limp → assess now · MOUD: individualize 24 · D 05 Oral iron Product labels (DailyMed) · NATA 2018 · Stoffel 2017 Order by elemental mg; “325 mg” is the salt. SALT TABLET (MG) ELEMENTAL IRON (MG) % Ferrous sulfate 325 65 20% Ferrous gluconate 324 ≈ 38 12% Ferrous fumarate 325 106 33% Postpartum Hb 9–11 g/dL: oral iron 80–100 mg elemental daily (alternate-day is better absorbed) × 3 mo 6 · E ≥ 2 h apart from calcium and antacids; ≥ 4 h from levothyroxine. Sources: Panel 01 doses as on the sheet named (ACOG CO 797, CO 712 + CPU 2024, CC 4; SMFM #67; CDC STI 2021; ABM #36); ACOG PB 199 Prophylactic Antibiotics in Labor and Delivery (2018); ASHP/IDSA/SIS/SHEA surgical prophylaxis (2013) Table 1. FDA labels: Lovenox (05/2025) §2.3, §5.1; Tamiflu (08/2019) Table 2; Vasotec; Macrobid; ketorolac injection; Motrin; acetaminophen injection. FDA DSC: metformin and kidney function (2016); codeine, tramadol and breastfeeding (2017). CDC Influenza Antivirals: Summary for Clinicians (2026). NLM LactMed 2024–2026 (nitrofurantoin, sulfamethoxazole-trimethoprim, doxycycline, metronidazole, sertraline, escitalopram, oxycodone, hydrocodone, ibuprofen, acetaminophen, ketorolac, iohexol, gadobutrol). ACR Manual on Contrast Media (2024). Muñoz M et al., NATA, Transfus Med 2018; Stoffel NU et al., Lancet Haematol 2017;4:e524–33. ACOG CC 1 (2021). LOCAL program workflow / policy STOP do not 2 · B sheet · section QR: open this sheet in the online kit","panels":[["01","L&D antimicrobial index"],["02","Renal dose adjustments"],["03","Lactation exceptions"],["04","Postpartum analgesic maximums"],["05","Oral iron"]]},{"f":"20-neuraxial.html","n":"20-neuraxial","sid":"20","g":"reference","t":"Neuraxial & anticoagulation","text":"L&D · OR · POSTPARTUM · WITH ANESTHESIA 20Neuraxial & anticoagulation FHR fall after placement or bolus 29 · B · uncertain FHR source 28 · A ANES Anesthesia makes the final neuraxial decision. Primary L&D team: confirm drug, dose, last-dose time and platelets; enter the hold order. SEE ALSO 16 PE / DVT 14 PP headache 27 OB/GYN consult 01 Before the needle SOAP 2018 · ASRA 2025 Drug Agent, dose, last-dose time (MAR) Labs Platelets (trend) 20 · 03; UFH or LMWH > 4 d → platelet count (HIT); Cr Other Antiplatelet + anticoagulant together, DOAC, warfarin, fondaparinux → anesthesia Bleeding History, DIC signs, ongoing PPH Removal Pulling the catheter = a neuraxial procedure. Same holds, same platelet rules. Order Write the hold and the earliest restart. 03 Platelets SOAP Thrombocytopenia Consensus 2021 At any platelet count: bleeding history or DIC → avoid neuraxial procedures or consult hematology. ≥ 70,000 Low risk — reasonable to proceed (GT, ITP, HDP; no bleeding, no DIC) 50,000–69,999 Competing risks may justify it — anesthesia decides < 50,000 Likely ↑ hematoma risk — reasonable to avoid Thrombocytopenia of unknown cause and platelets < 70,000 → consider hematology workup before proceeding. HELLP: platelets within 6 h of placement or removal. Before delivery · plan at 36 wk Prenatal team → anesthesia handoff for every patient on UFH or LMWH. On prophylactic LMWH: consider switching to UFH 5,000 units SUBQ BID at 36 wk, sooner if early or urgent delivery likely. Therapeutic anticoagulation: individualized delivery plan that keeps treatment intensity. Teach: skip the dose and call with contractions, ROM or bleeding. 02 Timing: hold · catheter · restart HIGH ALERT SOAP 2018 Table 3 · ASRA 2025 · Lovenox label 2025 · restart clocks match 6 · E Applies to: subcutaneous dosing unless noted; normal renal function, > 40 kg. CrCl < 30: use the enoxaparin row below. Neuraxial puncture ① After puncture Restart only when BOTH clocks have run, at the later time — and only with hemostasis and no PPH Catheter still in? Follow the row’s “Indwelling catheter” rule. Catheter removal ② After removal Drug · regimen Hold before: last dose → puncture or catheter removal Indwelling catheter ① After puncture ② After removal UNFRACTIONATED HEPARIN (UFH) 5,000 units BID or TIDlow dose ≥ 4–6 h OR normal aPTT / anti-Xa OK (5,000 units BID); remove ≥ 4–6 h after a dose ≥ 1 h ≥ 1 h 7,500 or 10,000 units BID; ≤ 20,000 units/dayintermediate ≥ 12 h AND normal coagulation Safety not established — anesthesia decides ≥ 1 h ≥ 1 h > 10,000 units/dose or > 20,000 units/dayhigh ≥ 24 h AND (normal aPTT OR undetectable anti-Xa) ≥ 1 h ≥ 1 h IV infusion Stop 4–6 h AND normal aPTT Not with the infusion running ≥ 1 h no PPH Anesthesia LMWH · ENOXAPARIN, DALTEPARIN Bloody tap → ASRA: LMWH ≥ 24 h after surgery Enoxaparin ≤ 40 mg daily · dalteparin 5,000 units dailylow dose · daily ≥ 12 h dalteparin 5,000: ≥ 15 h (US label) May stay — first LMWH dose ≥ 12 h after placement; remove once the hold has run ≥ 12 h ≥ 4 h Enoxaparin 30 mg q12hlow dose · q12h ≥ 12 h Remove the catheter before the first LMWH dose after neuraxial placement ≥ 12 h ≥ 4 h Enoxaparin > 40 mg and < 1.5 mg/kg daily, or > 30 mg and < 1 mg/kg q12hintermediate 12–24 h anesthesia; 0.75 mg/kg q12h ≥ 24 h (label) ≥ 24 h ≥ 4 h Enoxaparin 1 mg/kg q12h or 1.5 mg/kg daily Dalteparin 100–120 units/kg q12h or 200 units/kg daily high (therapeutic) ≥ 24 h after the last dose; on q12h, skip the 2nd daily dose ≥ 24 h ≥ 4 h Also ≥ 24 h after surgery (48–72 h if high bleeding risk) Enoxaparin, CrCl < 30 Double the hold interval Hold ≥ 24 h after 30 mg daily · ≥ 48 h after 1 mg/kg/day. Label: elimination prolonged; anti-Xa can help — ask anesthesia and pharmacy. ANTIPLATELET DRUGS Low-dose aspirin · NSAIDs alone No hold Catheter in + LMWH: no NSAID or aspirin (ASRA); + UFH: consider holding them (SOAP). Acetaminophen OK. Aspirin + low platelets → anesthesia. Bridge: SOAP lets low-dose UFH bridge when LMWH must wait (restart 1 h vs 4 h). LMWH anti-Xa (ASRA): inside the hold, ≤ 0.1 units/mL may support proceeding. SOAP vs ASRA: ASRA restarts low-dose UFH right after removal; card: SOAP ≥ 1 h. 04 Spinal-epidural hematoma ASA 2023 · SOAP 2018 · Lovenox boxed warning ! New numbness or weakness, back pain, bowel or bladder dysfunction — especially after the block had worn off. NOW · IN PARALLEL · TELL FM ATTENDING Call Anesthesia and neurosurgery now LOCALpager ____ · neurosurgery ____ Image Urgent MRI — don’t delay imaging; CT first if MRI not immediate LOCALMRI pathway ____ Hand off Symptom onset time ____ · decompression ideally within 8–12 h of onset. Back pain may be transient; weakness can progress. Consider Fever + back pain + deficit → epidural abscess. After response: report cases — quality, ASA AIRS, MedWatch. LOCALNeuraxial-anticoagulation protocol ____ 05 Urgent delivery, hold not met SOAP 2018 Figures 3–4 · ASRA 2025 Low- or intermediate-dose UFH, any timing Neuraxial may still be right: in an urgent case the risk of general anesthesia can exceed the hematoma risk — placing without delay may be appropriate. High-dose UFH < 24 h or abnormal aPTT · low-dose LMWH < 12 h · higher-dose LMWH < 24 h Insufficient data — consider general anesthesia. Anesthesia weighs airway and comorbidity against hematoma risk. Protamine only when UFH must be reversed urgently. Every unit keeps a written hold-and-restart protocol shared with nursing (SOAP). Higher-level care 27 · E 27 · F 06 Neuro checks ASA 2023 statement Any time Call anesthesia now: dense or rising block After delivery Check motor block hourly (straight-leg raise or Bromage) until it resolves At 4 h Block persists 4 h after the last dose or infusion stop → call anesthesia Catheter Removal by anesthesia or per local protocol, only after the hold interval in 02 Sources: Leffert L, Butwick A, Carvalho B, et al. SOAP Consensus Statement on the Anesthetic Management of Pregnant and Postpartum Women Receiving Thromboprophylaxis or Higher Dose Anticoagulants. Anesth Analg 2018;126:928–44 (Table 3, Figures 3–4); Bauer ME, Arendt K, Beilin Y, et al. SOAP Interdisciplinary Consensus Statement on Neuraxial Procedures in Obstetric Patients with Thrombocytopenia. Anesth Analg 2021;132:1531–44; Kopp SL, Vandermeulen E, McBane RD, et al. Regional anesthesia in the patient receiving antithrombotic or thrombolytic therapy: ASRA Pain Medicine Evidence-Based Guidelines (5th ed.). Reg Anesth Pain Med 2025 (doi 10.1136/rapm-2024-105766); ASA Statement on Neurologic Complications of Neuraxial Analgesia/Anesthesia in Obstetrics (Oct 2023); Lovenox prescribing information (05/2025) §5.1 and boxed warning; Fragmin US PI §5.1, EU SmPC §4.4. Restart times for LMWH are identical to sheet 6 · E. LOCAL program workflow / policy STOP do not 2 · B sheet · section QR: open this sheet in the online kit","panels":[["01","Before the needle"],["03","Platelets"],["02","Timing: hold · catheter · restart High alert"],["04","Spinal-epidural hematoma"],["05","Urgent delivery, hold not met"],["06","Neuro checks"]]},{"f":"21-before-discharge.html","n":"21-before-discharge","sid":"21","g":"workflow","t":"Before discharge","text":"L&D TRIAGE · PREGNANT ≥ 20 WK · TRIAGE → HOME 21Before discharge Evaluate A → check the complaint B → plan C–F → teach-back G → document H. Doses, algorithms and trauma observation thresholds → linked sheets. After birth: maternal care 6 · mother-baby discharge 25 SEE ALSO 1 Triage 3 Labor & EFM 6 Postpartum 26 Induction · labor 27 OB/GYN consult A Home only when all are met The MFTI prioritizes evaluation; it does not replace the complete maternal / fetal evaluation. ACOG CO 667 (2016) · AWHONN MFTI FAQ (2022) Unresolved concern, worsening symptoms or discordant findings → pause discharge; reassess + tell the FM attending 27 Severe BP, significant bleeding or maternal / fetal compromise 1 2 Diagnosis named: a working diagnosis — or the remaining uncertainty stated in one line. Complaint, GA / best EDD and risks reviewed. Repeat vitals + symptoms after observation / treatment: normal, or each abnormal finding explained and met by its row in B. Symptoms controlled on the home plan; oral fluids / medicines tolerated when relevant. Fetal assessment fits GA + indication; interpreted and reassuring 3 · A Every applicable row in B met; name any unmet criterion. Plan in hand: follow-up booked and each pending result owned (C); medicines, language, safety and transport solved (F). Teach-back done: patient states return signs, where to go and how (D, G). FM attending agrees with the disposition before the patient leaves 4 Disposition clinician ____ 27 · F · attending-review exceptions ____ · discharge order / workflow ____ B Complaint check — before home ACOG CO 766 · PB 171 · PB 217 · CO 828 · PB 222 · SMFM Consult 44 · CO 723 · PB 189 · CC 4 (2023) · treatment regimens stay on the linked sheets COMPLAINT REQUIRED BEFORE HOME CRITERIA UNMET OR UNCERTAIN → continue the linked evaluation pathway Labor rule-out Term / latent: maternal + fetal status reassuring; coping at home; shared self-care and reassessment plan. Preterm: indicated evaluation complete; no progressive cervical change or unresolved PTL concern. Pain / fatigue may warrant admission. 1 · 05 1 · 06 3 · B 26 · F LOCAL observation / repeat exam ____ · reassessment ____ ROM rule-out Clinical evaluation supports intact membranes; discordant findings resolved; no infection, bleeding, labor or fetal concern. A negative adjunct test or normal fluid volume alone does not establish intact membranes. Persistent leakage / uncertain diagnosis → reassess. Confirmed ROM → separate disposition pathway 1 · 04 LOCAL equivocal-test pathway / recheck ____ Decreased fetal movement GA-appropriate assessment reassuring; concern resolved; no other indication for surveillance / delivery. Single resolved episode + reassuring evaluation + no other indication → no automatic repeat surveillance. Persistent concern or abnormal testing → FM attending review (A) 1 · 07 3 · A Recurrent decrease → prompt reassessment. Hypertension / preeclampsia evaluation BP trend, symptoms, indicated labs and fetal assessment reviewed; no severe features; diagnosis / GA permits outpatient care; monitoring feasible. LOCAL next BP / review ____ · reviewer ____ SBP ≥ 160 or DBP ≥ 110 → recheck ≤ 15 min (sooner OK) · still severe → treat within 30–60 min · tell FM attending now 2 · B Gestational HTN / preeclampsia ≥ 37w0d → delivery 1 · 03 Vaginal bleeding Individualized disposition: FM attending (A) LOCAL Maternal status stable; fetal assessment reassuring; no active pathologic bleeding or unresolved labor / abruption concern; cause + placental location assessed. Rh / indicated RhIG addressed 1 · 01 1 · 14 Normal US does not exclude abruption. Previa / vasa previa, recurrent or unexplained bleeding → explicit specialist plan. LOCAL observation ____ · follow-up ____ Trauma / MVA Required maternal / fetal observation complete; no criterion for extended observation; injuries addressed; obstetric + trauma disposition agreed. Indicated FMH testing / RhIG addressed 1 · 02 1 · 14 Counsel about delayed pain, uterine tenderness, contractions, bleeding, leaking and decreased movement. LOCAL follow-up ____ Criterion for extended observation met → continue observation. LOCAL observation pathway ____ Abdominal pain Reassessment + indicated tests complete; no unresolved obstetric / surgical concern; symptoms manageable with home plan. Persistent focal, severe, worsening or unexplained pain → further evaluation 1 · 09 If uncertainty remains, explain it and specify reassessment. LOCAL time / location ____ Vomiting New after 20 wk → evaluate another cause 1 · 11 Cause assessed; hydration restored; concerning metabolic findings addressed; oral fluids / planned medicines retained. Persistent dehydration, severe pain, neurologic symptoms or concerning maternal / fetal findings → renatal care Confirm best dating / available records; review missing prenatal evaluation; obtain indicated HIV, HBV, HCV and syphilis testing. Identify receiving prenatal clinician; assign pending results. Language · access Ask preferred spoken / written language and communication needs. Qualified medical interpreter; understandable translated instructions / accommodations. Safety · IPV Intimate partner violence (IPV): speak with patient alone; professional interpreter. Explain confidentiality limits before screening. Assess safe destination / contact; offer advocacy + patient-directed safety plan. Transport · resources Confirm ride home + return route, pharmacy / medicine access, housing, food, telephone. Barriers that defeat necessary outpatient monitoring → escalate for an achievable disposition. Substance use Nonjudgmental verbal screen; assess intoxication / withdrawal + immediate safety. Continue prescribed treatment; offer linkage. Toxicology testing requires informed consent + explanation of implications. Prenatal appt ____ · interim contact ____ · interpreter access ____ · advocate / SW ____ · resources ____ · addiction service ____ G Teach-back before departure ACOG CO 676 (2016) Ask the patient to explain in their own words: “What did today’s evaluation show — and what remains uncertain?” “Which symptoms mean return now? Where will you go?” “How will you take medicines / check BP or movement if prescribed?” “When is follow-up? Who will contact you about pending results?” Plain words + interpreter as needed. Gaps → re-explain → repeat teach-back. Give matching written instructions and a working contact number. Instruction set ____ documentation field ____ H Document the disposition ACOG CO 517 (2012) · CS 23 (2025) Table 2 · checklist fields are LOCAL Complaint + GA / dating Relevant risks Working diagnosis / uncertainty Repeat maternal vitals / symptoms Fetal assessment / interpretation Indicated exams / results Treatment response Why home is appropriate e now 15 · A · routine screens 5 · E 18 · 05 SEE ALSO 18 Nursery card 25 Dyad → home 5 Newborn A Read the hearing result ASHA Practice Portal, Newborn Hearing Screening (accessed 2026) · JCIH Newborn Hearing Screening FAQs (2024) pp. 1–2 Method OAE = cochlear response · AABR = auditory nerve / brainstem. OAE can miss auditory neuropathy. Well nursery: OAE or AABR per the validated protocol. NICU: AABR. PASS Both ears pass in the same session. Passes from separate sessions do not combine. Readmitted in month 1 Exchange-transfusion hyperbilirubinemia, culture-positive sepsis, meningitis, newly recognized congenital infection, ventilation / ECMO → AABR rescreen before discharge despite PASS. REFER / did not pass Either ear → rescreen both ears B Assess cCMV testing indication C No screen / incomplete Arrange completion B Review CMV indications C Ear-canal atresia Including unilateral → pediatric audiology for diagnostic ABR; routine screening cannot clear the affected ear. REFER in either ear · no screen / incomplete → start both tracks now; neither waits for the other HEARING TRACK B Rescreen both ears → still refers → pediatric audiology (diagnostic ABR). Birth 1 mo 3 mo 6 mo screen diagnosis intervention CCMV TRACK · SAME DAY C Indication met → collect indicated specimen now; do not await rescreen D Birth 7 d 14 d 21 d specimen collection window collect by Separate scales: months for hearing, days for cCMV. B Rescreen → diagnose → intervene JCIH Year 2019 Position Statement, Interpretive Criteria · Outpatient Rescreening · JCIH Audiology FAQs (2024) pp. 1–3 · CDC Screening for Hearing Loss (2024) WELL NURSERY Initial inpatient screen. If needed, 1 inpatient rescreen, several hours later. Persistent refer → 1 valid outpatient rescreen of both ears, ASAP and before 1 month. Either ear still refers → pediatric audiology referral now (diagnostic ABR capability). NICU AABR refer → pediatric audiologist for rescreen + diagnostic assessment; OAE alone does not clear this pathway. Very preterm + prolonged stay → diagnostic audiology before discharge, even after PASS. Repeat screening raises the chance of a false pass; middle-ear fluid must not delay diagnosis. CMV collection proceeds in parallel C–D Complete by: screening 1 month · audiologic diagnosis 3 months · early intervention for confirmed hearing loss 6 months. Programs meeting 1–3–6 should strive for 1–2–3 (diagnosis 2 months · intervention 3 months). Outpatient rescreen site ____ · pediatric audiology (diagnostic ABR) ____ · booking route ____ D Collect the right specimen CDC Laboratory Testing for CMV and Congenital CMV (2024), Tests in newborns · Specimen collection · AAP (2026) Diagnostic Testing, KAS 5 · MDH cCMV Provider FAQ (accessed 2026) ≤ 21 daysof age Collection age determines the diagnostic window. Record birth date / time and specimen date / time. Obtain indicated testing promptly. Do not await outpatient rescreen or confirmed hearing loss. Today SPECIMEN ACTION Urine CMV PCR Diagnostic specimen; may be obtained directly. Saliva CMV PCR Collect > 1 h after breastfeeding, per lab instructions. VLBW preterm → urine PCR. Saliva positive Confirm: urine PCR by 21 days. Breast milk can make saliva falsely positive. Window nearly closed Obtain urine directly; avoid losing confirmation time while awaiting saliva results. IgG / IgM do not diagnose cCMV. Newly positive urine / saliva after 21 days cannot alone establish congenital infection. Missed the window → urine PCR promptly + consult pediatric ID; also request stored newborn dried-blood-spot (DBS) PCR when available. Negative DBS does not exclude cCMV. Negative universal DBS screen + compatible findings → urine PCR within the window. Urine CMV PCR order ____ · collection kit ____ · laboratory contact ____ F Valganciclovir · who needs urgent referral? AAP (2026) cCMV Clinical Report, Table 4, KAS 6–11 · CDC CMV in Newborns (2025), Early treatments may help cCMV disease or confirmed sensorineural hearing loss → pediatric ID promptly. Expedite diagnostic ABR. FINDINGS AAP TREATMENT POSITION Moderate / severe CNS involvement · severe or multiorgan disease · > 2 persistent or mild findings Valganciclovir 6 months. Isolated sensorineural hearing loss 6 weeks may be offered if the full baseline evaluation finds nothing else; limited evidence → decide with ID, discuss adverse effects. Mild ≤ 2 transient (< 2 wk) or minor findings Routine treatment unsupported; individual decision with pediatric ID. No disease; normal hearing No antiviral outside research. ≤ 12w6dof age When selected: start ASAP, at the latest through age 12 weeks 6 days. Specialist owns dosing and toxicity monitoring. Pediatric ID contact ____ · referral route / after-hours ____ C Who needs cCMV testing? AAP Clinical Report, Care of the Infant With Congenital CMV Infection (2026), Key Action Statements 2 and 4 AAP: hearing-targeted + expanded testing. Test if any: Initial newborn hearing-screen nonpass. Maternal HIV, or maternal CMV infection during pregnancy. Unexplained petechiae, thrombocytopenia, hepatomegaly or splenomegaly, elevated transaminases / direct bilirubin. Compatible CNS findings or intra-abdominal calcifications. Birth weight or head circumference < 10th percentile for gestational age. Preterm Hearing screening delayed beyond 21 days → consider cCMV testing before 21 days. Universal cCMV screening adopted? ____ · Screening specimen / order ____ · confirmation pathway ____ Universal-screen result still pending near the diagnostic deadline → responsible clinician / laboratory plan ____ E Result returns · confirm and evaluate AAP (2026) cCMV Clinical Report, KAS 5–6, 15 · MDH cCMV Provider FAQ, Screening Follow-up (state model, 2026) Saliva or DBS screen positive; urine pending Urine CMV PCR by 21 days (older: collect anyway + pediatric ID). Assign a result owner H Urine positive, collected ≤ 21 days Confirmed cCMV → baseline evaluation (below) and specialty coordination. Positive screen / urine negative Screen contamination likely. Clinical signs or persistent concern → laboratory + pediatric ID review. Invalid / indeterminate Contact laboratory; recollect while the window remains open. Urine PCR negative Complete the hearing pathway B CMV testing does not establish hearing status. Negative DBS screen does not exclude cCMV D Confirmed cCMV — arrange Complete exam: growth / head circumference, neurologic findings, skin, jaundice, liver / spleen. CBC with platelets · liver tests · cranial ultrasound. Diagnostic pediatric audiology · ophthalmology exam. Pediatric ID coordination. Abnormal neurologic exam or cranial ultrasound → noncontrast brain MRI. Offer early-intervention referral to every infant with cCMV disease or isolated SNHL. Neurodevelopmental assessment at 12 months; also 24 months if treated. Suspected disease or hearing loss → expedite evaluation for treatment decisions F G Passed screen? Risk follow-up still matters AAP Hearing Assessment (2023), Table 1 (JCIH 2019) · AAP (2026) cCMV, Table 6, KAS 15 · JCIH FAQs (2024) RISK DESPITE PASS DIAGNOSTIC AUDIOLOGY Family history of permanent childhood hearing loss NICU > 5 days Hyperbilirubinemia with exchange transfusion Aminoglycosides > 5 days, or shorter with toxic levels / known genetic susceptibility HIE / asphyxia Congenital herpes, rubella, syphilis, toxoplasmosis Congenital microcephaly Congenital or acquired hydrocephalus Relevant craniofacial / temporal-bone anomalies or syndromes By 9 months; later monitoring individualized. A normal early diagnostic ABR does not replace this follow-up. Possible maternal Zika in pregnancy · congenital Zika syndrome AABR by 1 month if passed on OAE only ECMO · meningitis / encephalitis associated with hearing loss Within 3 months of occurrence; annually to school age, sooner for concern Significant head trauma · chemotherapy Within 3 months of occurrence; then individualized Caregiver concern: hearing, language, delay or regression Immediate referral cCMV: initial diagnostic audiology by 12 weeks, even after PASS, so treatment can start by 12w6d. AAP 2026, no recognized hearing changes: recheck at 4, 6, 9, 12, 15, 18, 24, 30 months; annually at 4–6 years; at 8 and 10 years. Known SNHL → audiology / ENT schedule; late-onset SNHL → ophthalmology again. Modality: JCIH: diagnostic audiology, not screening alone · AAP 2026: office OAE / AABR if no hearing changes. cCMV hearing surveillance: adopted schedule ____ · modality ____ · referral triggers ____ · responsible service ____ Exactly 5 NICU days (table > 5 d; JCIH FAQ ≥ 5 d) → boundary rule ____ · special-care-nursery classification ____ H Family · document · report · close the loop ASHA Practice Portal, Documentation · Loss to Follow-Up (accessed 2026) · CDC CMV in Newborns (2025) · reporting is LOCAL Explain: The screen needs follow-up testing. We will check both ears. CMV testing has a short collection window, so we are arranging that now. If cCMV confirmed: hearing changes can appear later, even after a passed newborn screen. Give next appointments, written contacts and family-support resources. Before the family leaves: Rescreen / diagnostic appointment: date, time, place, phone given. Medical home, preferred language / interpreter, reliable contact confirmed. Infant’s chart: each ear’s result, OAE / AABR method, screening dates, risk factors, referrals. CMV indication, specimen type, collection date / time, result or pending status. Named owner reviews pending results, contacts family / PCP, arranges confirmation, tracks missed appointments. General newborn discharge readiness 18 · 07 Hearing / EHDI reporting State / program ____ · portal / form ____ · required results / events ____ · deadline ____ · responsible role ____ cCMV public-health reporting Required? ____ · authority / form ____ · deadline ____ · responsible role ____ Pending-result owner Owner ____ · backup ____ · review deadline ____ Sources: ASHA Practice Portal, Newborn Hearing Screening (living page, accessed apy) or hypertonia, arching, high-pitched cry → emergency escalation: intensive phototherapy, IV hydration, urgent transfer to an exchange-capable NICU 5 · C Continue in transit when feasible; TSB at least q2h. Failed CCHD screen → evaluate hypoxemia now 5 · D A passed CCHD screen or low EOS risk does not clear a clinically ill baby. B Activate transport · confirm destination AAP Levels of Neonatal Care 2023, Std V–VI · S.T.A.B.L.E. 7th ed. · receiving-center protocol (LOCAL) START TOGETHER — CALL WHILE STABILIZATION STARTS Escalation indicated Call NICU · activate transport SBAR E: immediate threat, current support, why higher-level care is needed. Stabilize S.T.A.B.L.E. C · reassess until handoff D Agree with NICU on destination and required capabilities: respiratory support, cooling, cardiology / echo, pediatric surgery or exchange transfusion. Accepting clinician Transport team, mode, ETA THIS UNIT’S LIMITS · RETENTION / TREATMENT CAPABILITY — VERIFIED Minimum GA ____ wk ____ d Minimum birth weight ____ g Oxygen Maximum FiO₂ ____ · flow ____ · duration ____ CPAP Available outside NICU? ____ · maximum pressure ____ cm H₂O · duration ____ IV glucose Max dextrose ____% · maximum GIR manageable on this unit ____ mg/kg/min Service scope Approved nursery service scope ____ · qualified staff and monitoring currently available ____ · monitoring / thermal support ____ Below an agreed GA / weight limit, or support beyond capability → peds / NICU consultation and higher-level care. Do not wait for a limit to be reached if the baby is deteriorating. Transport center / phone ____ · accepting NICU / clinician ____ · bedside medical lead until handoff ____ · alternate destination / escalation if delayed ____ C Stabilize while waiting — S.T.A.B.L.E. S.T.A.B.L.E. 7th ed. 2024 · AHA/AAP 2025 · AAP HIE 2026 · Prostin VR label 2026 · AAP EOS 2018 · PES 2015 · doses on 15 / 5 / 18 DOMAIN START NOW — ASSIGN TASKS IN PARALLEL · RESUSCITATION TAKES PRIORITY TARGET · DOSES · LOCAL S Sugar Bedside glucose now. Symptomatic and < 40 mg/dL → D10W 2 mL/kg IV, then GIR 5–8 mg/kg/min; persistent low → adopted pathway. Confirm low bedside values with a lab glucose; don’t delay treatment. Unsafe to feed → NPO + dextrose maintenance per neonatal plan. LOCAL adopted pathway ____ · target by age and clinical condition ____ · post-treatment recheck ____ min · escalation plan ____ Doses 15 · A 5 · B · pumps 18 · 04 T Temperature Radiant warmer; reduce heat loss; monitor temperature. Maintain normothermia unless the cooling center directs a monitored cooling protocol. Avoid hyperthermia. 36.5–37.5 °C A Airway Position airway; suction if obstructed. Apnea / gasping, or HR < 100/min despite initial steps → assisted ventilation now 5 · A Reassess HR response. Titrate oxygen to the agreed SpO₂ target. For a spontaneously breathing infant, CPAP when indicated by the neonatal team, with trained staff and appropriate monitoring 15 · B Recurrent apnea or worsening support needs → reassess airway and transport urgency. LOCAL SpO₂ target ____% · respiratory settings ____ B Blood pressure Assess HR, pulses, capillary refill, BP, urine output; gas / lactate as indicated. With NICU, treat the cause (blood loss, sepsis, cardiac disease, obstruction); fluids / vasoactive therapy per neonatal plan; reassess response 5 · A Suspected duct-dependent lesion → discuss PGE₁ now 15 · C If PGE₁ starts: watch breathing throughout, ventilation ready; significant BP fall → reduce the infusion rate now and update NICU. PGE₁ dose 15 · C L Lab work Blood culture promptly before antibiotics when obtainable without delaying treatment. Suspected infection → start antibiotics 15 · D Glucose; gas / lactate, CBC and electrolytes as indicated. Do not delay urgent treatment or transport for LP, difficult sampling or central access. E Emotional support Assign a family liaison now. Short updates: what is wrong, what is being done, why transfer is needed, destination and next update. Preferred language ization and escalation plan. Deterioration → immediate bedside action and update NICU / transport. 5 · A 15 · A Name who reassesses and who updates NICU; confirm the new plan before resuming handoff. Before movement: transport team verifies airway / support, thermal and glucose plans, access, infusions and equipment. Agree departure timing around remaining instability and time-critical care needs. BP q____ min · temperature q____ min · glucose q____ min · bedside reassessment lead ____ E Call script · SBAR · packet travels with baby CPQCC/CPeTS 2026 Neonatal Transport Form: time sequence C.14–19, infant condition C.20–29, referral process C.30–35 · CPQCC Perinatal Transport Systems 2026 Use for the initial call; update before departure. Existing summary 15 · H SSituation This is ____ [name / role] at ____, callback ____. Newborn born ____ [date / time], age ____ h as of ____ [time]; GA ____ wk ____ d, birth weight ____ g. Concern for ____. Current threat / support ____. I need peds / NICU consult / transport. BBackground Birth / resuscitation, Apgars, cord gas; maternal infection risks, ROM, GBS and antibiotics / times; relevant diagnoses, medications and prenatal findings. AAssessment Current vitals and trends; SpO₂ pre / post when relevant; respiratory device / settings / FiO₂; glucose and temperature; perfusion / BP; access; treatments, rates and administration times. RRequest · read-back Accepting clinician / unit? Team and ETA? Airway, glucose, temperature, PGE₁ or other treatment before arrival? What should trigger another call? Read back the plan. Send / document Baby’s identification, GA, birth weight and current treatment weight Birth / resuscitation record; relevant maternal / prenatal records Vital / glucose trends; laboratory results and collection times; pending tests Medication administration record: doses, times, concentrations and current rates Access / airway details and confirmation; imaging transferred Transfer indication, receiving acceptance, co → observe → discharge + Plan of Safe Care. Routine care 5 6 18 SEE ALSO 10 Feeding 6 Postpartum 25 Dyad → home 15 Sick newborn A Stabilize first ACOG/ASAM CO 711 (2017) · naloxone 4 mg nasal spray Drug Facts (2026) · AHA 2025 Part 10 Mother unresponsive or breathing slowly → emergency response · pulse present → ventilate + naloxone Now No definite pulse → CPR now 2 · D · naloxone only if it does not interrupt CPR 4 mgnasal Take-home product: 1 spray into 1 nostril → call 911. Still or again breathing slowly → new device every 2–3 min; stay until EMS arrives. Pregnancy is not a reason to withhold naloxone. Inpatient rescue dosing ____ monitoring ____ Infant ill or unstable → 15 · A Depression at birth → 5 · A Do not attribute an ill infant’s presentation to withdrawal without evaluating other causes. Suspected withdrawal after stabilization → assess function H. B Ask everyone · get the history ACOG/ASAM CO 711 (2017) · ACOG CC 10 (2025) · AAP report (2026) Rec 7 Screen Validated verbal screening at the first prenatal visit; update history at delivery and postpartum. Interview privately; explain confidentiality limits. Ask Substance / formulation · prescribed vs nonprescribed · route · frequency · last use · other sedatives · treatment team. Cannabis Interview / self-report / validated tool. Do not use biologic testing as routine cannabis screening. Maternal toxicology Identify the clinical question → explain limitations and possible reporting consequences → obtain informed consent. A positive result does not establish OUD, current impairment or inability to parent. Document: person with OUD · infant with prenatal opioid exposure · positive / negative result. Avoid “addict,” “drug baby,” “clean / dirty.” Screening tool ____ · documentation ____ · maternal consent pathway ____ C Infant tox: will it change care? AAP report (2026) Table 2, Recs 6–7 · ARUP Consult (2025) Universal newborn toxicology is not recommended. Unexpected withdrawal or unclear exposure history → interview the parent first. Test when results will inform assessment, treatment or feeding decisions. Known MOUD or maternal THC positivity alone does not create an automatic clinical indication. Seek parental permission; explain purpose and use of results. Necessary testing for acute clinical concerns may proceed without permission. Testing declined + unresolved clinical concern → neonatal review, clinical observation plan and safety assessment LOCAL ____. SPECIMEN WINDOW · LIMITS Infant urine promptly Short window; recent exposure. Negative does not exclude prenatal exposure. Meconium first stools, per lab Longer window, mainly later pregnancy. Collection may be incomplete; can contain intrapartum and newborn medications. Cord tissue at birth Longer window, mainly later pregnancy. Can contain intrapartum medications; unaffected by medication first given to the infant after collection. Interpret before acting: presumptive immunoassay positive → definitive confirmation. Review medication records — epidural fentanyl can explain positive infant results. Routine “opiates” assays may omit fentanyl, methadone or buprenorphine. Cord / meconium results do not establish timing, dose, impairment or withdrawal severity; do not use them to determine milk clearance. Urgent care proceeds while results are pending. Consent / escalation pathway ____ · indication ____ · specimen / analytes ____ · confirmation ____ · turnaround ____ · result owner ____ D Mother: keep MOUD · treat pain SOAP/SMFM/ASRA consensus (2025) Table 1 · ACOG/ASAM CO 711 Continue prescribed methadone or buprenorphine through labor, cesarean and postpartum. Verify formulation, total daily dose, last dose and prescriber / opioid treatment program (OTP). Newly identified or untreated OUD / opioid withdrawal → prompt addiction-capable assessment and MOUD initiation plan. Avoid abrupt cessation or withdrawal-only treatment. Naltrexone use → anesthesia / addiction plan ____; opioid analgesia may be blocked. Medication for OUD (MOUD) does not provide complete labor or postoperative analgesia. Anesthesia plan early; offer neuraxial. Multimodal 6 · E · acetaminophen / NSAID maximums 19 · 04 Opioids on MOUD: individualized, not capped by 19 · 04. After cesarean with neuraxial morphine: RR + sedation q1h × 12 h, then q2h to 24 h; SpO₂ / capnography as anesthesia directs. With the prescriber, split the total daily dose every 6–8 h when appropriate for analgesia. STOP OUD, with or without MOUD: avoid nalbuphine / butorphanol for pain or itch, and naloxone for itch — may precipitate withdrawal. FHR effects 29 · D Naloxone remains indicated for significant respiratory depression or overdose (A). No automatic postpartum dose reduction. Reassess sedation, breathing, withdrawal and cravings; individualize with prescriber. Review additional sedating medicines. OTP / prescriber verification ____ · addiction contact ____ · missed-dose / initiation / transition pathway ____ E Human milk: decide by substance ABM #21 (2023) · ACOG CC 10 (2025) · AAP (reaff. 2026) · LactMed EXPOSURE FEEDING DECISION Methadone · sublingual buprenorphine ENCOURAGE Breastfeeding when otherwise appropriate, regardless of maintenance dose. Extra attention during methadone titration. Injectable buprenorphine INDIVIDUALIZE With addiction / lactation team. Preserve effective OUD treatment while reviewing formulation-specific evidence. Ongoing nonprescribed opioids AVOID DURING USE During use: no direct breastfeeding or expressed milk. Support expression to protect supply; alternative milk 10 · 06 After clearance: resume after multidisciplinary reassessment; set a recurrence plan. Use stopped by / during the delivery stay: support initiation after sufficient clearance and multidisciplinary assessment. Earlier use or a positive delivery test alone is not permanent exclusion. Cannabis · THC COUNSEL Advise cessation; support reduction when cessation is not achieved. Discuss uncertain infant effects, route, potency and frequency. THC positivity alone does not prohibit breastfeeding. Any opioid MOUD: monitor infant alertness, feeding, breathing and weight gain. Excessive sleepiness, difficulty feeding, breathing difficulty or limpness → urgent assessment. ABM Cessation / reduction; shared decision-making with continued cannabis use. AAP Discourages cannabis use during lactation; advises abstinence and avoiding smoke. ACOG Continued cannabis use is not a breastfeeding contraindication. No established safe THC dose or waiting interval. Brief pump-and-dump does not establish clearance. Do not impose an automatic negative-THC-test gate. Feeding plan / reviewer ____ · lactation contact ____ · recurrence / restart plan ____ F Observe by actual exposure AAP NOWS report (2020) · UCSF NCNC (2024) §4 · as on 05 Chronic prenatal opioid exposure → inpatient ≥ 72 h; longer by row ↓ 5 AAP 2020 published approach 0 1 d 2 d 72 h 4 d 5 d 6 d 7 d Immediate‑release opioid ≥ 72 h Buprenorphine · sustained-release opioid 4 d 4–7 d Methadone 5 d 5–7 d Unknown · nonprescribed fentanyl · mixed ≥ 72 h Individual plan ____ THC alone · well infant Routine newborn discharge criteria; no opioid-withdrawal scoring or prolonged stay solely for THC. minimum published range stay may extend (note below) Brief prescribed intrapartum opioids alone do not cause NOWS. A positive test alone does not assign an observation interval. Symptoms, feeding, comorbidity and treatment may extend the stay; these ranges are not automatic discharge ages. Adopted exposure-specific minimums ____ · observation location ____ · disposition clinician ____ G Comfort first · stay together CDC treatment overview (2026) · AAP safe sleep (2022) · AAP SSC (2022) Rooming-in when clinically safe; caregiver takes part, staff support. Quiet / dim room Cluster care Awake skin-to-skin Gentle holding / rocking Safe swaddling Nonnutritive sucking Feeding support Track intake, output, daily weight and hydration. Feeding assessment / supplementation 10 · 01–06 Continue supportive care if medication becomes necessary. Every sleep: supine, firm flat separate surface, empty bassinet. Rooming-in ≠ bed sharing. Asleep in arms or skin-to-skin only with an awake, alert caregiver. No couch, recliner or weighted swaddles. Caregiver drowsy / impaired / unavailable → infant to bassinet; staff-supported care. Offer respite without blame. Caregiver support / respite ____ · rooming-in accommodation ____ H Eat, Sleep, Console assess function AAP review (2024) · ESC-NOW trial (NEJM 2023) Use the unit-approved standardized NOWS pathway: ESC ____ / approved alternative ____ LOCAL EAT Effective breastfeeding or intake appropriate for gestational and postnatal age SLEEP Undisturbed ≥ 1 h after feeding CONSOLE Settles with soothing ≤ 10 min Assess with the caregiver every 3–4 h, after feeding; review the entire interval. Document the impaired function and likely cause. No universal 30 mL feed requirement. Before attributing impairment to withdrawal, exclude hunger, physiologic cluster feeding, care interruptions and other illness. Function impaired Huddle RN + clinician + caregiver Check feeding technique, hunger, illness Optimize comfort → reassess Finnegan: legacy alternative when required by the unit pathway. Do not combine thresholds or translate scores into ESC. ESC-NOW enrolled infants ≥ 36 wk; preterm / medically complex infants need an individualized neonatal pathway. ESC tool / training ____ · reassessment / escalation process ____ I Persistent impairment → escalate UCSF NCNC (2024) §3 · AAP NOWS (2020) · OPTimize NOW Can’t eat, sleep or console Persistent, because of withdrawal despite optimized care → FM attending + peds / NICU consultation LOCAL ____ Feeding failure Dehydration or poor weight trajectory → prompt clinician reassessment. Ill infant Illness / seizures / respiratory compromise → 15 · A then cause-specific pathways on 15. Medication Neonatal opioid treatment, rescue doses, monitoring and wean: approved neonatal protocol LOCAL ____. Morphine or methadone are established options. Continue comfort care and caregiver involvement. STOP Naloxone does not treat NOWS; it can precipitate abrupt withdrawal and seizures. Opioid exposure / NOWS alone does not require NICU admission. Withdrawal pharmacotherapy requires protocol-specified monitoring: room in only where staffing and equipment meet it; otherwise transfer to an appropriately monitored unit. J Discharge both patients · complete the family plan AAP NOWS (2020) Discharge · ACOG/ASAM CO 711 · CAPTA/CARA (2016) 42 USC §5106a · federal Plans of Safe Care modules (2020) Infant Exposure-specific observation complete (F); feeding, hydration, weight and function acceptable. After withdrawal treatment: observe 24–48 h after stopping withdrawal medication (adopted medication-specific interval ____ when longer); no significant withdrawal signs. Routine newborn gate 18 · 07 All opioid-exposed infants: primary-care follow-up within 48 h of discharge, another visit at 1 week, then individualized. Appointment / clinician ____ Developmental surveillance / early-intervention referral ____ · infectious-exposure (e.g., HCV) follow-up owner ____ · pending-result owner ____ Mother Next MOUD dose / supply / OTP attendance confirmed. Follow-up booked ____ Naloxone in hand; support person taught overdose response. Mood 6 · D contraception 6 · C Plan of Safe Care Begin prenatally when possible; update before discharge. Include infant care, maternal treatment / mental health, milk plan, safe sleep, unimpaired backup caregiver, locked medication storage, transportation and named follow-up owners. CAPTA / CARA notification Notification ≠ abuse report. Infant meets the state’s affected-infant criteria → required notification + Plan of Safe Care (box below). Notification itself neither defines abuse / neglect nor requires prosecution; an abuse / neglect report is a separate determination. Tell the family which is happening and why. Jurisdiction ____ · affected-infant definition / MOUD / THC criteria ____ · notification recipient / form / deadline ____ · abuse-report trigger ____ · responsible clinician / social worker ____ · plan owner / monitoring ____ Sources: ACOG/ASAM CO 711 Opioid Use and Opioid Use Disorder in Pregnancy (2017); ACOG Clinical Consensus 10 Cannabis Use During Pregnancy and Lactation (2025); AAP Clinical Report, Children and Families Affected by Parental Substance Use (2026); ARUP Consult, Newborn Drug Testing (updated 2025); naloxone HCl 4 mg nasal spray Drug Facts (DailyMed, 2026); SOAP/SMFM/ASRA consensus, pain management in pregnancy with OUD (2025); ABM Clinical Protocol #21 (revised 2023); AAP Clinical Report, Marijuana Use During Pregnancy and Breastfeeding (2018, reaffirmed 2026); NICHD LactMed, Buprenorphine and Cannabis (2026); AAP Clinical Report, Neonatal Opioid Withdrawal Syndrome (Pediatrics 2020;146:e2020029074); UCSF Benioff Children’s NCNC NOWS & Drug-Exposed Infant Guidelines (2024); CDC, Treat and Manage Infants Affected by Prenatal Opioid Exposure (2026); AAP Policy Statement, Sleep-Related Infant Deaths (2022); AAP Safe Sleep and Skin-to-Skin Care in the Neonatal Period (2016, reaff. 2022); AHA 2025 Part 10, opioid overdose; AAP review, infants with prenatal opioid exposure and NOWS (2024); Young LW et al., ESC-NOW randomized trial (NEJM 2023); UNC NCCC Eat, Sleep, Console guideline (2025); OPTimize NOW trial (2026); CAPTA as amended by CARA (2016), 42 USC §5106a(b)(2)(B)(ii)–(iii); federal Plans of Safe Care Learning Modules 1, 4 (2020). Items tagged LOCAL are program policy. LOCAL program workflow / policy UPDATED new or changed guidance STOP do not 2 · B sheet · section Open on phone QR: open this sheet in the online kit","panels":[["A","Stabilize first"],["B","Ask everyone · get the history"],["C","Infant tox: will it change care?"],["D","Mother: keep MOUD · treat pain"],["E","Human milk: decide by substance"],["F","Observe by actual exposure"],["G","Comfort first · stay together"],["H","Eat, Sleep, Console"],["I","Persistent impairment → escalate"],["J","Discharge both patients · complete the family plan"]]},{"f":"25-dyad-discharge.html","n":"25-dyad-discharge","sid":"25","g":"workflow","t":"Mother-baby discharge","text":"AFTER DELIVERY · MOTHER + NEWBORN → HOME 25Mother-baby discharge Mother B–C + newborn E–G → both D → appointments H → warning signs I → teach-back J. Still pregnant, leaving triage 21 SEE ALSO 6 Postpartum 18 Nursery card 10 Feeding 22 Hearing · cCMV A Two patients — two discharge decisions WHO Positive Postnatal Experience (2022) Rec 46 · ABM #2 (rev. 2022) Rec 8 · management stays on 6 · A and 18 · 07 Two patients: each assessed separately, with own discharge clinician and order. Ready: exam, course and required observation complete; unresolved findings addressed. Plan agreed: family agrees; home support and follow-up achievable. Both ready → coordinated discharge. One still needs hospital care → separate disposition plans; preserve rooming-in / milk access where feasible. Maternal clinician ____ · newborn clinician ____ · required attending review ____ · boarding / separation pathway ____ Routine term-newborn criteria (E–G): 37w0d–41w6d. Preterm / NICU course or active complications → condition-specific clearance. B MOTHER Recovery + blood pressure WHO (2022) · CMQCC · ACC (2026) · SMFM HDP checklist (2020, reaff. 2025) · drugs / cuff on 6, 11 Vitals / symptoms reviewed; bleeding and uterine findings appropriate. No evolving hemorrhage, infection or cardiopulmonary concern. Incision / perineum assessed; pain manageable with an obtainable oral regimen. Eating / drinking, mobility and bladder function support home care. Retention → explicit catheter / void-trial plan. Medicines reconciled; VTE, anemia and diabetes plans completed when indicated 6 · E 12 · 08 Hypertensive disorder of pregnancy (HDP) BP trend, symptoms and indicated laboratory results reviewed; oral regimen and monitoring plan achievable. Start or titrate at ≥ 150/100 (ACOG) · ACC 2026: target < 140/90 before discharge, consider meds at ≥ 130/80 < 140/90: goal, not an admission rule · program ____. LOCAL observation interval ____ Cuff fits; patient demonstrates use; doses, monitoring and call instructions written 11 · 06 SBP ≥ 160 OR DBP ≥ 110 → hold discharge recheck ≤ 15 min (sooner OK) · tell FM attending now still severe → treat within 30–60 min 2 · B Persistent headache, visual symptoms, upper abdominal pain or dyspnea → urgent assessment regardless of BP. C MOTHER Prevention + emotional health ACOG PB 181 (2017) · CDC (2024) · ACOG schedule (2026) · CPG 4 (2023) · AIM (2021) · details on 6 Rh: maternal antibody / RhD and newborn RhD results reconciled. Unsensitized RhD− mother + newborn RhD+ or unknown → RhIG within 72 h of birth; missed → give now (benefit up to 28 d); dose / FMH testing 6 · F Rubella / varicella: indicated postpartum vaccination completed; remaining doses arranged. RhIG does not delay indicated MMR / varicella vaccination. MMR given with RhIG / blood products → rubella immunity test ≥ 3 mo later when possible. Tdap: pregnancy dose missed and never previously received Tdap → postpartum dose; otherwise review routine catch-up indications. Other indicated vaccines 6 · F Contraception: preference, chosen method / start date and access addressed 6 · C Validated depression / anxiety screen reviewed. Positive → assessment, with treatment / referral and follow-up arranged. Self-harm response → immediate risk assessment; psychosis → emergency assessment 6 · D Outstanding prevention ____ · responsible clinician ____ · completion date ____ D BOTH Home plan works for both AAP safe sleep (2022) · car seats (2018 / 2009, reaff. 2025) · AHRQ RED Tool 3 (2013) Feeding supplies, medicines, equipment, phone and transport available; barriers have a named solution. Capable support identified; language / accessibility needs addressed. Safe sleep: supine for every sleep; separate firm, flat sleep surface; fitted e bilirubin closest to discharge and the threshold at the sample’s age (correct GA / risk curve). Result ____ at ____ h · threshold ____ · Δ ____ · next test / review ____ · owner ____ Δ, mg/dL NEXT ACTION 0.1–1.9 age < 24 h Delay discharge; consider phototherapy; TSB 4–8 h 0.1–1.9 age ≥ 24 h TSB 4–24 h; explicit discharge / treatment decision 2.0–3.4 TSB / TcB 4–24 h 3.5–5.4 TSB / TcB 1–2 d Bilirubin testing: clinical judgment 5.5–6.9 discharge < 72 h Follow-up within 2 d ≥ 7.0 discharge < 72 h Follow-up within 3 d ≥ 5.5 discharge ≥ 72 h Clinical judgment Required bilirubin testing / feeding follow-up unavailable → reassess disposition; delay discharge when needed. G NEWBORN Screens + birth prevention AAP CCHD (2025) · CDC (2026) · JCIH (2019) · HRSA · CDC STI (2021) · NIH HIV (2025) · CDC HepB · AAP RSV (2026) · CDC CMV Syphilis: birth serology for every patient (ACOG); maternal status documented before either leaves; no prenatal care / increased risk → delivery result available + neonatal plan resolved 17 17b HIV: undocumented, or early negative + increased risk without third-trimester retest → expedited testing now; new positive → immediate infant NAT + ARVs; express and store milk, no breastfeeding — do not wait for discharge 18 · 05 CCHD: screen at ≥ 24 h, or as late as possible before earlier discharge. Pass documented, or failed screen evaluated 5 · D Hearing: result explained. Not passed / incomplete → appointment booked; screening complete by 1 mo, diagnosis by 3 mo, intervention by 6 mo. Failed screen → cCMV indication 22 · C; specimen within 3 wk of birth. LOCAL targeted cCMV rule / owner ____ Blood spot: collected 24–48 h, or before earlier discharge; specimen / accession recorded. LOCAL repeat requirements: state rule ____ · date / site ____ Vitamin K / eye prophylaxis: administration verified. Missed → assess and offer indicated prophylaxis now. Refusal → counsel, document, hand off to receiving clinician 18 · 01 Hep B: maternal HBsAg + birthweight ch
