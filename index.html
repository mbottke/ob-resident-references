er an earlier indication to 39 wk only to reach an elective threshold. ≥ 39w0d Elective Reasonable for a well-dated, low-risk nulliparous patient after shared decision-making. ARRIVE (scheduled IOL 39w0d–39w4d): cesarean 18.6% vs 22.2% expectant; primary adverse neonatal composite not significantly reduced. Discuss ripening, L&D time, monitoring, alternatives, preference; ensure staffing + delivery resources. Before starting Indication + dating Presentation Placental location Uterine operative history Maternal status + vitals Membrane status Baseline fetal assessment Contractions + cervical exam GBS plan Consent STOPNot the routine IOL pathway: any contraindication to vaginal birth, including previa / vasa previa; transverse lie; cord prolapse; active genital HSV lesions / prodrome; prior classical incision, rupture or another scar requiring cesarean; compromise requiring immediate delivery → call FM attending; involve OB/GYN. Order set ____ · attending notification / OB backup ____ B Assess readiness ACOG CPG 9 (2025) Table 1 · NICHD/SMFM/ACOG workshop (2012) · NICE NG207 (2021) §1.3 BISHOP 0 1 2 3 Dilation, cm Closed 1–2 3–4 5–6 Effacement, % 0–30 40–50 60–70 ≥ 80 Station −3 −2 −1, 0 +1, +2 Consistency Firm Medium Soft — Position Posterior Mid Anterior — Add all five factors; total 0–13. Higher = more favorable. > 8 favorable (traditional teaching) ≤ 6 often unfavorable CPG 9 sets no universal cutoff; incorporate parity and clinical findings. Unfavorable → ripen (C). Favorable → amniotomy / oxytocin (D). Readiness guides the method; a low score alone does not cancel a medically indicated delivery. Ripening threshold ____ Membrane sweep: discuss from 39w0d; consent; check placental location. Separate membranes digitally through the cervix. May promote spontaneous labor and reduce formal induction; discomfort, spotting and ROM can occur. C Ripen when needed ACOG CPG 9 (2025) Box 1, Pharmacologic / Mechanical / Outpatient, pp.151–156 · Cervidil PI (Ferring, 2020) §§2, 4, 5, 7.1 · Prepidil PI (Pfizer, 2025) · Cytotec label (Pfizer, 2026) STOPPrior cesarean or uterine surgery affecting wall integrity: no misoprostol / dinoprostone, and no misoprostol combination. Confirm labor eligibility; balloon ± oxytocin may be options 3 · B Method miSOPROStol PO miSOPROStol PV Dinoprostone insert (Cervidil) Dinoprostone gel (Prepidil, endocervical) Balloon / Foley Dose / use 25 mcg q2h selected starting regimen 25 mcg q3–6h 10 mg PV once; ≤ 12 h; hospital use 0.5 mg below internal os; repeat q6h if needed; max 1.5 mg/24 h; hospital use Single or double balloon; studied fills 30–80 mL Key limits Pharmacy preparation + maximum doses LOCAL ____ Schedule / maximum doses LOCAL ____ Not removable after administration. Remove when labor commences; for tachysystole, hypertonicity or concerning FHR; with ROM; before amniotomy; by 12 h. ≥ 6 previous term pregnancies: contraindicated. ≥ 6 previous term pregnancies: not recommended. Check formulation-specific contraindications, incl. unexplained vaginal bleeding. Follow device limits. LOCAL device ____ · fill ____ mL · dwell ____ h · removal ____ → Oxytocin Never coadminister. Oxytocin ≥ 4 h after last misoprostol (label-based; not set by CPG 9) with acceptable FHR / uterine activity. LOCAL longer unit interval ____ ≥ 30 min after removal 6–12 h after administration Balloon + oxytocin or balloon + misoprostol may shorten induction in appropriate candidates. All Monitor fetal status + uterine activity during pharmacologic ripening; reassess before repeat dosing. Tachysystole or concerning FHR → hold further prostaglandin (E). Choose the method by clinical findings, history, preference and setting. Monitoring schedule ____ · reassessment ____ Outpatient ripening: selected low-risk patients without an indication for ongoing monitoring; approved pathway required; proposed local option balloon. Cervidil + Prepidil require hospital use; Cytotec labeling specifies hospital use for obstetric administration. Return for ROM, bleeding, reduced movement, painful regular contractions, severe pain or concern 21 Eligibility / method ____ · fetal assessment / observation ____ · return time / contact / access ____ D Amniotomy + oxytocin ACOG CPG 8 (2024) pp.152–154, Table 3 · AHRQ Labor Dystocia (2020) Table 67 · NICE NG207 §1.7.5 · CRICO OB Guideline 15 (2026) · AHRQ Safe Oxytocin tool (2023) Amniotomy shortens induced / augmented labor. Confirm presentation and a stable, well-applied presenting part; assess cord / placental risk. FHR before and immediately after (sudden fall 29 · A); document ROM time + fluid. High / mobile head → attending assessment before proceeding. On oxytocin, also assess maternal vital signs, fluid intake / output, resting tone, pain and bleeding; escalate signs of uterine rupture or water intoxication. Intervals LOCAL OXYTOCIN HIGH ALERT · IV PUMP milliunits/min START INCREASE INTERVAL Low-dose 0.5–2 1–2 15–40 min High-dose ≥ 4 3–6 15–40 min Published regimen categories; use one approved unit order. Either is reasonable; high-dose is not an individualized starting order. Monitor FHR + uterine activity continuously; validate the signals 28 · A 28 · D. Titrate to clinical response. Bag concentration ____ · start / increment / interval ____ · maximum rate ____ · escalation threshold ____ ·","panels":[["A","Induce today?"],["B","Assess readiness"],["C","Ripen when needed"],["D","Amniotomy + oxytocin"],["E","Too many contractions?"],["F","Stages of labor — name the stage, use the right clock"],["G","Slow progress, arrest or failed induction?"]]},{"f":"27-ob-consult.html","n":"27-ob-consult","sid":"27","g":"workflow","t":"When to call OB/GYN","text":"FM MATERNITY CARE · OB/GYN BACKUP · L&D · POSTPARTUM 27When to call OB/GYN Say what you need — phone advice, bedside review, co-management or transfer of care — and who owns care afterward. Competence, privileges, resources and explicit acceptance decide the route. No national diagnosis list exists: response assignments are LOCAL. SEE ALSO 1 Triage 2 Emergencies 26 Induction · labor 4 Workflow A Emergency? Call OB/GYN to the bedside now CMQCC OBH Toolkit v3.0 (2022) App. C · ACOG CO 767 (2019) · SMFM Consult 67 (2023) · ACOG CPG 10 (2025) · AHA (2025) · AAFP Birth Equity (2026) · AAFP–ACOG joint statement §§A–B · ownership is LOCAL Activate the emergency response. Call FM attending + OB/GYN to the bedside; notify the bedside RN. Start treatment while help comes. 2 · A 2 · B 2 · C 2 · D 3 · A 29 · A Now No response, worsening, or safety concern still unresolved? State the concern explicitly; use the chain of command. Immediate danger → activate emergency backup now. Required care exceeds the FM attending’s competence or privileges? Obtain a clinician credentialed for that care. Agree whether OB/GYN takes the procedure, a defined problem or the maternal episode. FM attending ____ OB/GYN first call ____ OB/GYN backup ____ Emergency activation ____ MFM / transfer center ____ Escalate: backup after ____ min Emergencies: OB/GYN assumes maternal primary when ____ · escalation leader ____ · interim responsible attending ____ · chain of command ____ Scope: FM procedural privileges / supervision ____ · scope agreement ____ · OB/GYN-primary criteria ____ · co-management criteria ____ · return-to-FM criteria ____ · postoperative / readmission service ____ B Situation → response CMQCC · CO 767 · SMFM 67 · CPG 10 · OCC 9 Table 3 · OCC 7 · SMFM 37 · PB 205 · 219 · 222 · CO 745 · AAFP (2022) · AFP (2021) · LOCAL cells are program policy CONSULTATION — HOW RESPONSIBILITY — WHO WHERE Separate choices, not one ladder: choose the consultation (how); separately agree who is responsible and where care happens. Situation · defining condition · reference FM manages FM stays primary Phone consult stable · focused question Bedside consult presence needed Co-manage named primary + OB tasks OB assumes care accepted · scope · time Transfer to higher level exceeds capability Emergency · any phase Nowactivate the emergency response · start treatment while help comes Hemorrhage — stage 2 2 · AOB/GYN to the bedside already at stage 2. Call earlier for deterioration or anticipated need beyond current resources. Start Rx — Stage 2 Stage 3 · major or worsening bleeding 2 · ASuspected uterine rupture / inversion / major abruption; shock; bleeding persisting despite initial measures or needing operative control → add surgery, anesthesia, critical care; name procedural lead + maternal primary. Start Rx — Now Eclampsia · severe-range BP 2 · BSBP ≥ 160 or DBP ≥ 110 persisting ≥ 15 min: treat within 30–60 min — do not wait for symptoms or deterioration, antepartum or postpartum. Bedside obstetric + anesthesia response. Start Rx — Now Shoulder dystocia 2 · CCall extra hands, OB/GYN, newborn team. Begin maneuvers immediately. Maneuvers — Now Maternal arrest 2 · DStart CPR immediately; defibrillate when indicated. Activate code + obstetric surgical response. Fundus ≥ umbilicus → prepare resuscitative delivery from recognition; aim for birth by 5 min. CPR — Now Category III · cord prolapse · urgent birth 3 · A 29 · AIntrauterine resuscitation as indicated; cord prolapse → relieve cord compression. Category III unresolved after initial measures → expedite delivery. Resuscitate — Now Suspected sepsis 13 · 02 13 · 04Activate the multidisciplinary emergency response; begin treatment immediately. Emergency source control when indicated; uterine source → prompt delivery / evacuation. Start Rx — Now Antepartumstable findings: formal consult early enough to plan surveillance, delivery site, operator, escalation · record the plan where the admitting team finds it Placenta / vasa previa · suspected PAS 1 · 01Delivery site + hemorrhage plan; MFM / PAS team for suspected PAS or previa + prior uterine surgery. Vasa previa: on-site immediate neonatal transfusion; known + ROM / labor → prompt cesarean; don’t await bleeding. OB/GYN review + MFM / PAS team PAS: level III / IV Prior uterine surgery · planned TOLAC 3 · BReview operative report; candidacy per PB 205. Prior classical / T incision, prior rupture or extensive transfundal surgery generally precludes planned TOLAC. Delivery plan Labor, ROM, bleeding, pain → urgent bedside Preeclampsia with severe features 2 · BUrgent inpatient assessment. ≥ 34w0d: deliver after stabilization; do not delay for late-preterm steroids. < 34w0d: expectant care only if selected, stable, appropriate resources E; maternal / fetal deterioration → deliver after stabilization. Urgent assessment + MFM if complex < 34w0d: level III Twins / higher-order · persistent malpresentationChorionicity + amnionicity; monochorionic → MFM surveillance E. Timing, operator, neonatal resources; name who owns the plan. ECV: contraindications, consent, cesarean readily available. Formal consult + plan Major maternal disease · fetal complication · threatened early birth / PPROM 1 · 04 / 06 7 · 07 7 · 08Define specialist involvement + place of care. Formal consult + MFM if complex Exceeds capability Intrapartumcall before the needed intervention Possible operative vaginal birth or cesarean · unsuccessful vacuum / forceps 3 · B 26 · GRequest bedside assessment while the need is developing; agree indication, urgency, operator, backup + maternal primary. Unsuccessful attempt → bedside reassessment now. As need develops TOLAC · twins · malpresentation in laborOutside the documented plan → bedside review + revised ownership. Per plan Outside plan 3rd- / 4th-degree laceration (OASIS) 3 · CClinician experienced + credentialed in sphincter repair; adequate anesthesia, exposure, assistance. Consider OR. If credentialed Postpartumnew instability, m","panels":[["A","Emergency? Call OB/GYN to the bedside now"],["B","Situation → response"],["C","Make the call — SBAR"],["D","Agree explicitly — who owns care"],["E","Need MFM or a higher level of care?"],["F","Close the loop — document + hand off"]]},{"f":"28-fm-signal.html","n":"28-fm-signal","sid":"28","g":"intrapartum","t":"Fetal monitoring: signal","text":"L&D · INTRAPARTUM · EFM EQUIPMENT 28Fetal monitoring: signal Lost signal, uncertain source or apparent bradycardia = fetal status unknown → assess the patient, call FM attending, confirm by ultrasound. Equipment checks never delay indicated delivery 3 · A 29 · A Confirm fetal rate · troubleshoot sensors · measure contractions. Definitions, Categories, resuscitation 3 · A · oxytocin 26 · D · tachysystole 26 · E SEE ALSO 3 Labor & EFM 29 FHR · response 26 Induction · labor 20 Neuraxial A Confirm the fetal signal ACOG CPG 10 (2025) pp.591–592 · NICE NG229 §§1.4.5–9 · AWHONN (2024) · HRS (2023) · NICE NG137 §1.11 Maternal capture. Pushes look like accelerations because the trace is the mother’s pulse; no fetal information while captured. Synthetic; values illustrative. IS THAT REALLY THE FETUS? Patient + channel: right patient, monitor, transducer, channel. Mother: palpate pulse; display maternal SpO₂ HR beside the tracing. Fetus: listen; compare audible, displayed and maternal rates at the same time. Signal: contact, position, connections. Good signal quality ≠ fetal origin. Still uncertain → bedside ultrasound for fetal cardiac activity + rate; FM attending / OB/GYN now; consider FSE C CAPTURE CLUES · suggest, do not prove Displayed rate = maternal pulse; “accelerations” with each push (key sign); abrupt baseline shift; unexpected “recovery” after poor signal. Can occur without a visible break. Second stage: maternal HR rises into the fetal range as the fetus descends: keep it visible. Push-timed accels on 12% of external vs 4% of FSE tracings — ≈ 8% may be maternal. Fast / irregular maternal pulse: BP, symptoms, 12-lead ECG; confirm fetal rate independently. Source confirmed → classify and act 3 · A Twins: confirm two hearts. Ultrasound-map each heart; label channel ↔ twin; maternal pulse too. Matching detail on both channels → one fetus recorded twice: ultrasound, reposition. A display offset does not prove two sources. Keep monitoring twin B after the first birth. Twin channel labels ____ · FM attending ____ · OB/GYN ____ B Sudden half or double rate? Philips Avalon IFU ch.12 · FIGO CTG (2015) §§3.2–3.3 · GE 250cx manual Exact ×2 / ÷2 jumps while independent checks (◇) stay put: suspect counting artefact. Synthetic. LOOK Abrupt switch to ≈ ½ or 2× the prior rate, often with gaps. WHY Autocorrelation locks onto the wrong interval: missed cycles (halving) or extra counted signals (doubling). DO Verify immediately: assess apparent brady- / tachycardia now; compare maternal pulse; listen; reposition. Uncertain → ultrasound. Ongoing difficulty → FSE when eligible C STOPNever multiply or divide the displayed rate and call it fetal. Assess the true rate + prior record 3 · A Gap = missing data: never read depth, recovery or variability across it. Irregular beats? External Doppler may misrepresent an arrhythmia → FSE when eligible C rhythm 29 · D READ THE SCALE US paper, 3 cm/min: 1 small division = 10 s; 6 = 1 min. FHR 30 bpm/cm; minor line = 10 bpm (as in these strips). Check speed + scale on paper and screen: zoom or 1 cm/min (UK) changes shape, not duration. Monitor model / IFU ____ · recorder speed / scale ____ C FSE: better acquisition, verify the source ACOG CPG 10 (2025) Box 2 · NIH Perinatal HIV (2025) · Philips Avalon IFU ch.16 · FSE IFUs FSE rate = maternal HR: unresolved until ultrasound shows fetal cardiac activity. After fetal death an FSE can record maternal ECG. Synthetic. CONSIDER · BEFORE PLACING Use when external FHR stays inadequate despite adjustment, or maternal vs fetal rate remains unclear. Not routine: small ↑ scalp injury + cephalohematoma. Check: consent · ROM · cervical access · identified vertex scalp · infection + bleeding risk · IFU + minimum GA. STOPACOG absolute: malpresentation / unknown presenting part · HIV viral load > 1,000 copies/mL · active genital HSV lesions · placenta or vasa previa · suspected fetal hematologic disorder (fetal hemophilia, NAIT, maternal ITP). HIV at any viral load: NIH avoids FSE even when suppressed — ≤ 1,000 is not permission; expert review. Hepatitis B / C: relative; individualize. VERIFY · TROUBLESHOOT A readable FSE trace does not prove a fetal heartbeat. Keep maternal HR displayed; compare after application, any abrupt change or unexplained “recovery”. Rates coincide / origin uncertain → urgent bedside ultrasound + FM attending; keep treating apparent compromise meanwhile. Matching rates alone neither prove capture nor diagnose death. Apply / remove per the stocked IFU: avoid fontanelles, sutures, face, genitalia; never over-rotate; unscrew counterclockwise, never pull; check the spiral is intact; tell the newborn team the site. Leads off / erratic: compatible cable, dry connector, reference-electrode contact, lead tension — before any re-application. No blind extra turns or traction. FSE ≠ scalp blood sampling; digital scalp stimulation needs no FSE 29 · D Electrode / IFU revision ____ · minimum GA ____ · authorized operator ____ D External toco: time it, palpate it AWHONN (2020, 2024) · FIGO CTG (2015) §3.4 · ACOG CPG 10 Table 1 Flat toco while contractions are felt: move it over the fundus, secure it. Synthetic. ASSESS EXTERNAL TOCO PALPATION Frequency Detects when acquisition is adequate Palpate if missed / ambiguous Duration Approximate onset → end Time onset → end Intensity Height is relative: not strength, not mmHg Mild / moderate / strong Resting tone Baseline is relative: not resting pressure Soft / firm between contractions Flat / small trace: palpate the fundus while watching; reposition over palpable activity; restore contact; secure belt. Reset the external reference between contractions per IFU. Spikes with breathing, cough, turning or pushing → compare with what you see; count only confirmed contractions. Obesity can reduce detection: a quiet trace does not exclude contractions. Do not titrate oxytocin or calculate MVU from an unreliable or external trace. Tachysystole > 5 / 10 min, averaged over 30 min 26 · E Cont","panels":[["A","Confirm the fetal signal"],["B","Sudden half or double rate?"],["C","FSE: better acquisition, verify the source"],["D","External toco: time it, palpate it"],["E","IUPC: validate the pressure trace"],["F","Calculate MVU over 10 minutes"]]},{"f":"29-fm-response.html","n":"29-fm-response","sid":"29","g":"intrapartum","t":"Fetal monitoring: response","text":"L&D · INTRAPARTUM · FETAL HEART RATE 29Fetal monitoring: response Verified trace → bedside cause → targeted action → reassess. Definitions · Categories · resuscitation bundle 3 · A · signal, sensors, IUPC 28 SEE ALSO 3 Labor & EFM 28 FHR · signal 27 OB/GYN consult 2 Emergencies A Sudden sustained fall: act and find the cause ACOG CPG 10 (2025) Table 2, pp.593–594 · RCOG GTG 50 (2014) · GTG 63 (2011) · FIGO VBAC (2025) §§7.2–7.3 · RCOG GTG 55 (2024) · Ambia 2022 New sustained fall in FHR → bedside now. Call FM attending + OB/GYN to the bedside; notify the bedside RN. Category III, cord prolapse, suspected abruption or rupture → activate the emergency response; prepare for urgent birth while finding the cause. 3 · A 27 · A Now Record onset; review the prior tracing. Fetal, not maternal, rate? 28 · A Mother: BP, pulse, SpO₂, pain, bleeding, tone between contractions. Vaginal exam: cord, dilation, station. Resuscitate 3 · A O₂ only for maternal hypoxemia. Prepare birth: OB/GYN, anesthesia, neonatal team, room. Do not wait for a duration label: 2 min and 10 min are definitions, not waiting periods. Category III unresolved after initial measures → expedited delivery, vaginal, operative vaginal or cesarean. No reliable FHR? Bedside ultrasound now. Lost trace ≠ demise; Doppler, CTG, FSE cannot confirm or exclude it (FSE can record maternal ECG 28 · C). No cardiac activity → experienced confirmation + second opinion; assess bleeding, abruption, sepsis. LOCAL ____ Emergency activation ____ · OB/GYN first call ____ · neonatal team ____ CONTEXT · CLUE THINK ACT NOW After ROM / amniotomy; high presenting part Cord prolapse Examine now. Cord felt → elevate the presenting part; do not replace the cord; fastest safe birth 3 · A Pain; tender or firm uterus ± bleeding Abruption Maternal resuscitation, hemorrhage response 2 · A Bleeding may be concealed; normal ultrasound does not exclude it. TOLAC or other uterine scar Uterine rupture Abnormal FHR is often the first sign; loss of station, pain, scar tenderness, bleeding, shock may be absent. Suspected → emergency operative delivery. Minutes after neuraxial dose / CSE Low BP · hypertonus Check BP and uterine relaxation together → B Excess or sustained contraction Tachysystole Oxytocin off; remove dinoprostone; uterine relaxant 26 · E Never delays emergent birth. Rapid descent, pushing Head / cord compression Station, position; fastest safe birth; modify pushing → C. Near birth ≠ benign. Seizure, hypoxemia, collapse Maternal cause Stabilize the mother first 2 · B 2 · D FHR often recovers after an eclamptic seizure; persistent → abruption? delivery? B After neuraxial: check BP and uterine activity ASA Neuraxial Statement (2021) V · ASA/SOAP (2016) · CPG 10 (2025) Table 2 · Abrão 2009 · PB 116 (2010) Before dosing BP, pulse, SpO₂; FHR by a qualified individual; IV access. Mark dose and top-up times. After first dose Direct observation ≥ 20 min; continuous maternal HR + SpO₂; BP at least q5 min, q2 min for the first 10 min when feasible. Significant provider bolus → same. FHR falls → call anesthesia + FM attending at onset. Check together: BP vs pre-dose · pulse · SpO₂ · uterine relaxation by palpation · fetal vs maternal rate. Lateral · oxytocin off · vaginal exam when indicated 3 · A BP below pre-dose → restore placental perfusion Sympathectomy → hypotension → less placental perfusion. IV crystalloid bolus (less with preeclampsia / pulmonary-edema risk) + prompt IV vasopressor, agent chosen by anesthesia: phenylephrine or ephedrine; no maternal bradycardia → consider phenylephrine (better fetal acid–base; mainly cesarean data). Recurrent → lower basal epidural rate. BP held · uterus not relaxing → relax the uterus Rapid analgesia, especially CSE / intrathecal opioid, can bring uterine hypertonus and prolonged slowing without hypotension. Stop stimulation; palpate (toco height is not pressure 28 · D 28 · E). Rapid-acting uterine relaxant per approved order, e.g. terbutaline 0.25 mg SUBQ; expect maternal tachycardia. Can matter without > 5 contractions / 10 min. Severe decel persists → prepare birth while treating. Category III not responding → expedited delivery; do not wait for a drug to wear off. Maternal respiratory or neurologic deterioration → anesthesia emergency. Later fever → D. Eligibility, anticoagulation 20 Strips: schematic, US paper scale; recovery not guaranteed. Anesthesia ____ · fluid bolus ____ · pressor dose / repeat / max ____ · relaxant repeat limits ____ C Recurrent decelerations: target the cause ACOG CPG 10 (2025) Table 2, Box 3 · CPG 8 (2024) p.156 · Hofmeyr, Cochrane 2012 · Lemos, Cochrane 2017 Recurrent late THINK Less uteroplacental O₂ transfer: hypotension, excess contractions, low placental reserve (preeclampsia, growth restriction); abruption (A). ACT BP, contractions, bleeding. Lateral; reduce / stop oxytocin; IV bolus tailored to the mother. ESCALATE Persistent, falling variability, worse recovery → OB/GYN bedside, delivery assessment 27 · B Absent variability + recurrent lates = Category III. Recurrent variable THINK Cord compression. Sudden severe or prolonged fall after ROM → examine for prolapse (A). ACT Reposition. Persistent → consider transcervical amnioinfusion (attending + unit protocol); watch tone, volume in / out 28 · E ESCALATE Longer events, slow recovery, rising baseline, falling variability → OB/GYN bedside; never delay birth. Absent variability + recurrent variables = Category III. With pushing · second stage CHECK Fetal source: pushing can record maternal “accelerations” 28 · A Recovery, variability, descent. ACT Change position; push every other contraction; brief pause if recovery is poor. Open-glottis pushing is not a proven rescue. ESCALATE Poor recovery or worsening → operative vaginal birth now? 3 · B 27 · B A brief pause ≠ planned delayed pushing; fetal status overrides labor clocks. Amnioinfusion: eligibility, fluid, bolus / rate / maximum, stop criteria ____ D Changed baseline or variability: assess t","panels":[["A","Sudden sustained fall: act and find the cause"],["B","After neuraxial: check BP and uterine activity"],["C","Recurrent decelerations: target the cause"],["D","Changed baseline or variability: assess the context"],["E","Smooth cycling: sinusoidal or a mimic?"],["F","Reassess response; agree who owns care"]]}];const g=document.getElementById('g'),q=document.getElementById('q');
